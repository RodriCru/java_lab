referenceSolution: |
  public class Solution {
      public static int[] mergeSorted(int[] first, int[] second) {
          int[] a = first == null ? new int[0] : first;
          int[] b = second == null ? new int[0] : second;
          int[] resultado = new int[a.length + b.length];
          int i = 0;
          int j = 0;
          int k = 0;
          while (i < a.length && j < b.length) {
              if (a[i] <= b[j]) {
                  resultado[k] = a[i];
                  i++;
              } else {
                  resultado[k] = b[j];
                  j++;
              }
              k++;
          }
          while (i < a.length) {
              resultado[k] = a[i];
              i++;
              k++;
          }
          while (j < b.length) {
              resultado[k] = b[j];
              j++;
              k++;
          }
          return resultado;
      }
  }
tests: |
  import org.junit.jupiter.api.DisplayName;
  import org.junit.jupiter.api.Test;

  import static org.junit.jupiter.api.Assertions.*;

  class SolutionTest {

      @Test
      @DisplayName("Combina dos arreglos intercalando sus elementos")
      void combinacionIntercalada() {
          assertArrayEquals(new int[] {1, 2, 3, 4, 5, 6},
                  Solution.mergeSorted(new int[] {1, 3, 5}, new int[] {2, 4, 6}));
      }

      @Test
      @DisplayName("Devuelve los elementos de first cuando second está vacío")
      void segundoVacio() {
          assertArrayEquals(new int[] {1, 2}, Solution.mergeSorted(new int[] {1, 2}, new int[0]));
      }

      @Test
      @DisplayName("Combina correctamente arreglos de distinto tamaño")
      void tamanosDistintos() {
          assertArrayEquals(new int[] {3, 7, 9}, Solution.mergeSorted(new int[] {7}, new int[] {3, 9}));
      }

      @Test
      @DisplayName("Conserva los duplicados de ambos arreglos")
      void conDuplicados() {
          assertArrayEquals(new int[] {1, 2, 2, 3, 4},
                  Solution.mergeSorted(new int[] {1, 2, 3}, new int[] {2, 4}));
      }

      @Test
      @DisplayName("Trata null como un arreglo vacío")
      void entradaNula() {
          assertArrayEquals(new int[] {5, 6}, Solution.mergeSorted(null, new int[] {5, 6}));
          assertArrayEquals(new int[] {5, 6}, Solution.mergeSorted(new int[] {5, 6}, null));
          assertArrayEquals(new int[0], Solution.mergeSorted(null, null));
      }

      @Test
      @DisplayName("No modifica los arreglos de entrada")
      void noModificaLaEntrada() {
          int[] primero = {1, 3};
          int[] segundo = {2, 4};
          assertArrayEquals(new int[] {1, 2, 3, 4}, Solution.mergeSorted(primero, segundo));
          assertArrayEquals(new int[] {1, 3}, primero);
          assertArrayEquals(new int[] {2, 4}, segundo);
      }
  }
