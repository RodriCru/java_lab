slug: merge-sorted
level: 1
topic: arrays
title: Combinar dos arreglos ordenados
statement: |
  Escribe un método que combine dos arreglos ya ordenados de forma ascendente en un
  arreglo NUEVO que contenga todos los elementos en orden ascendente.

  Ejemplo:
  - Entrada: first=[1, 3, 5], second=[2, 4, 6] -> Salida: [1, 2, 3, 4, 5, 6]
  - Entrada: first=[1, 2], second=[] -> Salida: [1, 2]
  - Entrada: first=[7], second=[3, 9] -> Salida: [3, 7, 9]

  Se asume que ambos arreglos vienen ordenados. Si alguno es null, se trata como vacío.
  El arreglo de entrada nunca debe modificarse.
methodSignature: "public static int[] mergeSorted(int[] first, int[] second)"
className: Solution
estimatedMinutes: 15
difficulty: easy
hints:
  - "Crea un arreglo resultado con el tamaño de la suma de los dos arreglos."
  - "Usa dos índices, uno por cada arreglo, y avanza el que tenga el elemento menor."
  - "Al terminar el recorrido, copia los elementos restantes del arreglo que aún tenga valores."
