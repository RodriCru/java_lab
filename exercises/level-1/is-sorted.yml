slug: is-sorted
level: 1
topic: arrays
title: ¿Está ordenado?
statement: |
  Escribe un método que determine si un arreglo está ordenado de forma ascendente no estricta,
  es decir, cada elemento es mayor o igual que el anterior.

  Ejemplo:
  - Entrada: numbers=[1, 2, 2, 5] -> Salida: true
  - Entrada: numbers=[3, 1, 4] -> Salida: false
  - Entrada: numbers=[7] -> Salida: true

  Si el arreglo es null o está vacío, devuelve true.
  El arreglo de entrada nunca debe modificarse.
methodSignature: "public static boolean isSorted(int[] numbers)"
className: Solution
estimatedMinutes: 8
difficulty: easy
hints:
  - "Compara cada elemento con el anterior dentro de un for."
  - "Si encuentras un elemento menor que el anterior, ya sabes que no está ordenado."
  - "Empieza el recorrido en el índice 1 para no salirte de los límites del arreglo."
starterCode: |
  public class Solution {
      public static boolean isSorted(int[] numbers) {
          // Tu código aquí
          return false;
      }
  }
referenceSolution: |
  public class Solution {
      public static boolean isSorted(int[] numbers) {
          if (numbers == null) {
              return true;
          }
          for (int i = 1; i < numbers.length; i++) {
              if (numbers[i] < numbers[i - 1]) {
                  return false;
              }
          }
          return true;
      }
  }
tests: |
  import org.junit.jupiter.api.DisplayName;
  import org.junit.jupiter.api.Test;

  import static org.junit.jupiter.api.Assertions.*;

  class SolutionTest {

      @Test
      @DisplayName("Devuelve true cuando el arreglo está ordenado de forma ascendente")
      void arregloOrdenado() {
          assertTrue(Solution.isSorted(new int[] {1, 2, 3, 4}));
      }

      @Test
      @DisplayName("Devuelve true cuando hay valores repetidos consecutivos")
      void valoresRepetidos() {
          assertTrue(Solution.isSorted(new int[] {1, 2, 2, 5}));
      }

      @Test
      @DisplayName("Devuelve false para un arreglo desordenado y true para uno ordenado")
      void arregloDesordenado() {
          assertFalse(Solution.isSorted(new int[] {3, 1, 4}));
          assertTrue(Solution.isSorted(new int[] {1, 3, 4}));
      }

      @Test
      @DisplayName("Devuelve true cuando el arreglo tiene un solo elemento")
      void unSoloElemento() {
          assertTrue(Solution.isSorted(new int[] {7}));
      }

      @Test
      @DisplayName("Devuelve true cuando el arreglo es null o está vacío")
      void arregloNuloOVacio() {
          assertTrue(Solution.isSorted(null));
          assertTrue(Solution.isSorted(new int[0]));
      }

      @Test
      @DisplayName("No modifica el arreglo de entrada al evaluarlo")
      void noModificaLaEntrada() {
          int[] original = {1, 2, 5, 4};
          int[] copia = {1, 2, 5, 4};
          assertTrue(Solution.isSorted(new int[] {1, 2, 5}));
          assertFalse(Solution.isSorted(original));
          assertArrayEquals(copia, original);
      }
  }
