slug: least-common-multiple
level: 1
topic: divisibility
title: "Mínimo común múltiplo"
statement: |
  Escribe un método que calcule el mínimo común múltiplo (MCM) de dos números enteros.

  Reglas del contrato:
  - El resultado se declara como long porque el MCM puede superar el rango de int.
  - Se trabaja con el valor absoluto, así que el signo no importa.
  - Si alguno de los dos números es 0, el resultado es 0.
  - Se puede calcular como el producto de los valores absolutos dividido entre su máximo común divisor.

  Ejemplo:
  - lcm(4, 6) -> 12
  - lcm(0, 5) -> 0
  - lcm(-4, 6) -> 12
methodSignature: "public static long lcm(int a, int b)"
className: Solution
estimatedMinutes: 12
difficulty: easy
hints:
  - "Si alguno de los números es cero, devuelve 0 directamente."
  - "Primero calcula el máximo común divisor con el algoritmo de Euclides."
  - "El MCM es el producto de los valores absolutos dividido entre el MCD, y esa división es exacta."
starterCode: |
