slug: bubble-sort
level: 1
topic: sorting
title: Ordenamiento burbuja
statement: |
  Escribe un método que ordene un arreglo de enteros de menor a mayor usando el
  algoritmo de burbuja.

  Reglas del contrato:
  - Devuelve un arreglo NUEVO con los valores ordenados.
  - El arreglo de entrada NO debe modificarse.
  - Si el arreglo es null, devuelve null.
  - Si el arreglo está vacío, devuelve un arreglo vacío.

  Ejemplo:
  - Entrada: [5, 2, 9, 1] -> Salida: [1, 2, 5, 9]
  - Entrada: [3, 3, 1] -> Salida: [1, 3, 3]
  - Entrada: [] -> Salida: []
methodSignature: "public static int[] bubbleSort(int[] numbers)"
className: Solution
estimatedMinutes: 20
difficulty: easy
hints:
  - "Compara cada par de elementos vecinos e intercámbialos si están desordenados."
  - "En cada pasada el valor mayor se va quedando al final, así que puedes reducir el rango de comparación."
  - "Trabaja sobre una copia del arreglo para no modificar la entrada."
starterCode: |
