          return new int[0];
      }
  }
referenceSolution: |
  public class Solution {
      public static int[] bubbleSort(int[] numbers) {
          if (numbers == null) {
              return null;
          }
          int[] resultado = numbers.clone();
          for (int i = 0; i < resultado.length - 1; i++) {
              for (int j = 0; j < resultado.length - 1 - i; j++) {
                  if (resultado[j] > resultado[j + 1]) {
                      int temporal = resultado[j];
                      resultado[j] = resultado[j + 1];
                      resultado[j + 1] = temporal;
                  }
              }
          }
          return resultado;
      }
  }
tests: |
  import org.junit.jupiter.api.DisplayName;
  import org.junit.jupiter.api.Test;

  import static org.junit.jupiter.api.Assertions.*;

  class SolutionTest {

      @Test
      @DisplayName("Ordena un arreglo desordenado")
      void arregloDesordenado() {
          assertArrayEquals(new int[] {1, 2, 5, 9}, Solution.bubbleSort(new int[] {5, 2, 9, 1}));
      }

      @Test
      @DisplayName("Mantiene el orden de un arreglo ya ordenado")
      void arregloOrdenado() {
          assertArrayEquals(new int[] {1, 2, 3}, Solution.bubbleSort(new int[] {1, 2, 3}));
      }

      @Test
      @DisplayName("Ordena un arreglo con valores repetidos")
      void valoresRepetidos() {
          assertArrayEquals(new int[] {1, 3, 3}, Solution.bubbleSort(new int[] {3, 3, 1}));
      }

      @Test
      @DisplayName("No modifica el arreglo de entrada")
      void noModificaLaEntrada() {
          int[] original = {5, 2, 9, 1};
          int[] copia = {5, 2, 9, 1};
          Solution.bubbleSort(original);
          assertArrayEquals(copia, original);
      }

      @Test
      @DisplayName("Ordena un arreglo de un solo elemento")
      void unSoloElemento() {
          assertArrayEquals(new int[] {7}, Solution.bubbleSort(new int[] {7}));
      }

      @Test
      @DisplayName("Devuelve null cuando el arreglo es null")
      void arregloNulo() {
          assertNull(Solution.bubbleSort(null));
      }
  }
