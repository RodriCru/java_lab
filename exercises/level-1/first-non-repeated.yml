slug: first-non-repeated
level: 1
topic: strings
title: Primera letra no repetida
statement: |
  Escribe un método que devuelva el primer carácter que aparece una sola vez en el texto.

  Ejemplo:
  - firstNonRepeated("aabbc") -> 'c'
  - firstNonRepeated("Java") -> 'J'
  - firstNonRepeated("aabb") -> '\0'

  La comparación ignora mayúsculas y minúsculas: por ejemplo, 'a' y 'A' cuentan como
  el mismo carácter. Si ningún carácter es único, o si el texto es null o vacío,
  devuelve el carácter '\0'.
methodSignature: "public static char firstNonRepeated(String text)"
className: Solution
estimatedMinutes: 15
difficulty: easy
hints:
  - "Convierte el texto a minúsculas para comparar sin distinguir mayúsculas."
  - "Cuenta cuántas veces aparece cada carácter antes de buscar el primero único."
  - "Recorre otra vez el texto en minúsculas y devuelve el primer carácter cuyo conteo sea 1; si no hay, devuelve '\\0'."
starterCode: |
  public class Solution {
