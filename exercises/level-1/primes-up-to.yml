slug: primes-up-to
level: 1
topic: divisibility
title: "Primos hasta un límite"
statement: |
  Escribe un método que devuelva todos los números primos desde 2 hasta el límite indicado, ambos inclusive, en orden ascendente.

  Reglas del contrato:
  - Si el límite es menor que 2, devuelve un arreglo vacío (new int[0]).
  - El 2 es el primo más pequeño y también se incluye.
  - El arreglo devuelto debe tener exactamente la cantidad de primos encontrados, sin ceros de relleno.

  Ejemplo:
  - Entrada: 10 -> Salida: [2, 3, 5, 7]
  - Entrada: 2 -> Salida: [2]
  - Entrada: 1 -> Salida: []
methodSignature: "public static int[] primesUpTo(int limit)"
className: Solution
estimatedMinutes: 15
difficulty: easy
hints:
  - "Recorre los números desde 2 hasta el límite y decide cuáles son primos."
  - "Puedes guardar los primos en un java.util.ArrayList y luego copiarlos a un arreglo con un bucle."
  - "Si el límite es menor que 2, devuelve directamente new int[0]."
starterCode: |
