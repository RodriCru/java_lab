referenceSolution: |
  public class Solution {
      public static String titleCase(String text) {
          if (text == null) {
              return "";
          }
          char[] caracteres = text.toCharArray();
          boolean inicioDePalabra = true;
          for (int i = 0; i < caracteres.length; i++) {
              if (caracteres[i] == ' ') {
                  inicioDePalabra = true;
              } else {
                  if (inicioDePalabra) {
                      caracteres[i] = Character.toUpperCase(caracteres[i]);
                  } else {
                      caracteres[i] = Character.toLowerCase(caracteres[i]);
                  }
                  inicioDePalabra = false;
              }
          }
          return new String(caracteres);
      }
  }
tests: |
  import org.junit.jupiter.api.DisplayName;
  import org.junit.jupiter.api.Test;

  import static org.junit.jupiter.api.Assertions.*;

  class SolutionTest {

      @Test
      @DisplayName("Convierte dos palabras minúsculas a formato de título")
      void dosPalabras() {
          assertEquals("Hola Mundo", Solution.titleCase("hola mundo"));
      }

      @Test
      @DisplayName("Normaliza mayúsculas mezcladas y deja el resto en minúscula")
      void mezclaDeMayusculas() {
          assertEquals("Java Es Genial", Solution.titleCase("JAVA es GENIAL"));
      }

      @Test
      @DisplayName("Conserva los espacios múltiples sin colapsarlos")
      void espaciosMultiples() {
          assertEquals("  Hola   Mundo  ", Solution.titleCase("  hola   mundo  "));
      }

      @Test
      @DisplayName("Devuelve una cadena vacía solo cuando el texto es null o está vacío")
      void textoNuloOVacio() {
          assertEquals("Hola", Solution.titleCase("hola"));
          assertEquals("", Solution.titleCase(null));
          assertEquals("", Solution.titleCase(""));
      }

      @Test
      @DisplayName("Formatea correctamente una sola palabra")
      void unaPalabra() {
          assertEquals("Java", Solution.titleCase("jAVA"));
      }

      @Test
      @DisplayName("Deja en minúscula las letras internas de cada palabra")
      void letrasInternasEnMinuscula() {
          assertEquals("Hola Mundo", Solution.titleCase("hOLA mUNDO"));
      }
  }
