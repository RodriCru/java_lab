slug: title-case
level: 1
topic: strings
title: Formato de título
statement: |
  Escribe un método que convierta un texto a formato de título: la primera letra de cada
  palabra en mayúscula y el resto en minúscula.

  Ejemplo:
  - titleCase("hola mundo") -> "Hola Mundo"
  - titleCase("JAVA es GENIAL") -> "Java Es Genial"
  - titleCase("  hola   mundo  ") -> "  Hola   Mundo  "

  Respeta los espacios existentes sin colapsarlos: los espacios múltiples se conservan
  igual que en la entrada. Si el texto es null, devuelve una cadena vacía ("").
methodSignature: "public static String titleCase(String text)"
className: Solution
estimatedMinutes: 12
difficulty: easy
hints:
  - "Recorre el texto carácter por carácter llevando un arreglo de caracteres de salida."
  - "Necesitas una bandera que indique si el carácter anterior fue un espacio (o si estás al inicio)."
  - "Usa Character.toUpperCase y Character.toLowerCase según corresponda a cada posición."
starterCode: |
