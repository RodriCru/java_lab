slug: capitalize-words
level: 1
topic: strings
title: "Capitalizar palabras"
statement: |
  Escribe un método que reciba una cadena de texto y devuelva la misma cadena con la primera letra de cada palabra en mayúscula y el resto de las letras en minúscula.

  Reglas del contrato:
  - Las palabras se separan únicamente por espacios en blanco.
  - Los espacios se conservan tal como vienen, incluidos los espacios repetidos al inicio, al final o entre palabras.
  - Si el texto es null, el método devuelve null.
  - Si el texto está vacío, devuelve una cadena vacía.

  Ejemplo:
  - Entrada: "hola mundo" -> Salida: "Hola Mundo"
  - Entrada: "hOLA mUNDO" -> Salida: "Hola Mundo"
  - Entrada: "  java   es genial  " -> Salida: "  Java   Es Genial  "
methodSignature: "public static String capitalizeWords(String text)"
className: Solution
estimatedMinutes: 12
difficulty: easy
hints:
  - "Necesitas saber si el carácter actual es el primero de una palabra."
  - "Usa una variable booleana que se ponga en true al inicio del texto y cada vez que encuentres un espacio."
  - "Cuando estés al inicio de palabra aplica Character.toUpperCase; en caso contrario aplica Character.toLowerCase."
