referenceSolution: |
  public class Solution {
      public static String capitalizeWords(String text) {
          if (text == null) {
              return null;
          }
          StringBuilder resultado = new StringBuilder();
          boolean inicioDePalabra = true;
          for (int i = 0; i < text.length(); i++) {
              char caracter = text.charAt(i);
              if (caracter == ' ') {
                  resultado.append(caracter);
                  inicioDePalabra = true;
              } else if (inicioDePalabra) {
                  resultado.append(Character.toUpperCase(caracter));
                  inicioDePalabra = false;
              } else {
                  resultado.append(Character.toLowerCase(caracter));
              }
          }
          return resultado.toString();
      }
  }
tests: |
  import org.junit.jupiter.api.DisplayName;
  import org.junit.jupiter.api.Test;

  import static org.junit.jupiter.api.Assertions.assertEquals;
  import static org.junit.jupiter.api.Assertions.assertNull;

  class SolutionTest {

      @Test
      @DisplayName("Capitaliza cada palabra de un texto en minúsculas")
      void textoEnMinusculas() {
          assertEquals("Hola Mundo", Solution.capitalizeWords("hola mundo"));
      }

      @Test
      @DisplayName("Corrige un texto con mayúsculas mezcladas")
      void textoConMayusculasMezcladas() {
          assertEquals("Hola Mundo", Solution.capitalizeWords("hOLA mUNDO"));
      }

      @Test
      @DisplayName("Una sola palabra se capitaliza")
      void unaPalabra() {
          assertEquals("Java", Solution.capitalizeWords("java"));
      }

      @Test
      @DisplayName("Una cadena vacía devuelve una cadena vacía")
      void cadenaVacia() {
          assertEquals("", Solution.capitalizeWords(""));
      }

      @Test
      @DisplayName("Un texto null devuelve null")
      void textoNull() {
          assertNull(Solution.capitalizeWords(null));
      }

      @Test
      @DisplayName("Conserva los espacios repetidos y los de los extremos")
      void espaciosRepetidos() {
          assertEquals("  Java   Es Genial  ", Solution.capitalizeWords("  java   es genial  "));
      }
  }
