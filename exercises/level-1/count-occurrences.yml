slug: count-occurrences
level: 1
topic: arrays
title: Contar ocurrencias
statement: |
  Escribe un método que cuente cuántas veces aparece el valor 'target' dentro del arreglo.

  Ejemplo:
  - Entrada: numbers=[1, 2, 1, 3, 1], target=1 -> Salida: 3
  - Entrada: numbers=[4, 5], target=9 -> Salida: 0
  - Entrada: numbers=[], target=7 -> Salida: 0

  Si el arreglo es null, devuelve 0. El arreglo de entrada nunca debe modificarse.
methodSignature: "public static int countOccurrences(int[] numbers, int target)"
className: Solution
estimatedMinutes: 10
difficulty: easy
hints:
  - "Recorre el arreglo con un for y lleva un contador."
  - "Compara cada elemento con target usando == antes de incrementar el contador."
  - "Antes de recorrer, revisa si numbers es null para no provocar un NullPointerException."
starterCode: |
  public class Solution {
