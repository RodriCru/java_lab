slug: most-common-word
level: 1
topic: structures
title: Palabra más frecuente
statement: |
  Escribe un método que reciba un texto y devuelva la palabra que más veces aparece.

  Reglas del contrato:
  - Las palabras están separadas por espacios.
  - La comparación ignora mayúsculas y minúsculas.
  - El resultado se devuelve en minúsculas.
  - Si dos palabras empatan en frecuencia, devuelve la que aparece primero en el texto.

  Ejemplo:
  - Entrada: "el gato y el perro" -> Salida: "el"
  - Entrada: "Java java JAVA" -> Salida: "java"
  - Entrada: "Hola" -> Salida: "hola"

  Si el texto es null o está vacío, devuelve una cadena vacía ("").
methodSignature: "public static String mostCommonWord(String text)"
className: Solution
estimatedMinutes: 15
difficulty: easy
hints:
  - "Normaliza el texto a minúsculas y sepáralo con split(\" \")."
  - "Cuenta las apariciones con un java.util.HashMap<String, Integer>."
  - "Al empate gana la primera palabra: guarda una referencia a la mejor posición encontrada mientras recorres por primera vez."
