slug: reverse-words
level: 1
topic: strings
title: Invertir el orden de las palabras
statement: |
  Escribe un método que invierta el orden de las palabras de un texto y normalice los
  espacios: la salida lleva una sola espacio entre palabras y sin espacios en los extremos.

  Ejemplo:
  - Entrada: "hola mundo" -> Salida: "mundo hola"
  - Entrada: "  java   es  genial " -> Salida: "genial es java"
  - Entrada: "uno" -> Salida: "uno"

  Si el texto es null, vacío o solo tiene espacios, devuelve una cadena vacía ("").
methodSignature: "public static String reverseWords(String text)"
className: Solution
estimatedMinutes: 15
difficulty: easy
hints:
  - "Primero quita los espacios de los extremos con trim y revisa si quedó vacío."
  - "Separa las palabras con split(\"\\s+\") para que los espacios múltiples no generen elementos vacíos."
  - "Recorre el arreglo de palabras desde el final hacia el inicio y concatena con un solo espacio."
