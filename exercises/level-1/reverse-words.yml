referenceSolution: |
  public class Solution {
      public static String reverseWords(String text) {
          if (text == null) {
              return "";
          }
          String limpio = text.trim();
          if (limpio.isEmpty()) {
              return "";
          }
          String[] palabras = limpio.split("\\s+");
          StringBuilder resultado = new StringBuilder();
          for (int i = palabras.length - 1; i >= 0; i--) {
              resultado.append(palabras[i]);
              if (i > 0) {
                  resultado.append(" ");
              }
          }
          return resultado.toString();
      }
  }
tests: |
  import org.junit.jupiter.api.DisplayName;
  import org.junit.jupiter.api.Test;

  import static org.junit.jupiter.api.Assertions.*;

  class SolutionTest {

      @Test
      @DisplayName("Invierte el orden de dos palabras")
      void dosPalabras() {
          assertEquals("mundo hola", Solution.reverseWords("hola mundo"));
      }

      @Test
      @DisplayName("Normaliza los espacios al invertir tres palabras")
      void normalizaEspacios() {
          assertEquals("genial es java", Solution.reverseWords("  java   es  genial "));
      }

      @Test
      @DisplayName("Devuelve la misma palabra cuando solo hay una")
      void unaPalabra() {
          assertEquals("uno", Solution.reverseWords("uno"));
      }

      @Test
      @DisplayName("Devuelve una cadena vacía solo cuando el texto es null o está vacío")
      void textoNuloOVacio() {
          assertEquals("mundo hola", Solution.reverseWords("hola mundo"));
          assertEquals("", Solution.reverseWords(null));
          assertEquals("", Solution.reverseWords(""));
      }

      @Test
      @DisplayName("Devuelve una cadena vacía solo cuando el texto tiene espacios")
      void soloEspacios() {
          assertEquals("b a", Solution.reverseWords(" a b "));
          assertEquals("", Solution.reverseWords("     "));
      }

      @Test
      @DisplayName("Invierte el orden de tres palabras")
      void tresPalabras() {
          assertEquals("c b a", Solution.reverseWords("a b c"));
      }
  }
