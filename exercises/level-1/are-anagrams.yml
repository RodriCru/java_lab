referenceSolution: |
  public class Solution {
      public static boolean areAnagrams(String first, String second) {
          if (first == null || second == null) {
              return false;
          }
          String a = first.toLowerCase().replace(" ", "");
          String b = second.toLowerCase().replace(" ", "");
          if (a.length() != b.length()) {
              return false;
          }
          int[] conteo = new int[256];
          for (int i = 0; i < a.length(); i++) {
              conteo[a.charAt(i)]++;
          }
          for (int i = 0; i < b.length(); i++) {
              conteo[b.charAt(i)]--;
              if (conteo[b.charAt(i)] < 0) {
                  return false;
              }
          }
          return true;
      }
  }
tests: |
  import org.junit.jupiter.api.DisplayName;
  import org.junit.jupiter.api.Test;

  import static org.junit.jupiter.api.Assertions.*;

  class SolutionTest {

      @Test
      @DisplayName("Reconoce dos palabras que son anagramas")
      void anagramasSimples() {
          assertTrue(Solution.areAnagrams("roma", "amor"));
      }

      @Test
      @DisplayName("Ignora mayúsculas y espacios al comparar")
      void ignorarMayusculasYEspacios() {
          assertTrue(Solution.areAnagrams("Hola Mundo", "aloh odnum"));
      }

      @Test
      @DisplayName("Distingue anagramas válidos de palabras con letras distintas")
      void letrasDistintas() {
          assertTrue(Solution.areAnagrams("roma", "amor"));
          assertFalse(Solution.areAnagrams("casa", "ceja"));
      }

      @Test
      @DisplayName("Reconoce anagramas con letras repetidas")
      void anagramasConLetrasRepetidas() {
          assertTrue(Solution.areAnagrams("perro", "repor"));
      }

      @Test
      @DisplayName("Devuelve false solo cuando alguna cadena es null")
      void algunaCadenaNula() {
          assertTrue(Solution.areAnagrams("roma", "amor"));
          assertFalse(Solution.areAnagrams(null, "amor"));
          assertFalse(Solution.areAnagrams("roma", null));
      }

      @Test
      @DisplayName("Considera dos cadenas vacías como anagramas")
      void cadenasVacias() {
          assertTrue(Solution.areAnagrams("", ""));
      }
  }
