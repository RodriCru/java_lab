slug: are-anagrams
level: 1
topic: strings
title: ¿Son anagramas?
statement: |
  Escribe un método que determine si dos textos son anagramas, es decir, si contienen
  exactamente las mismas letras con la misma cantidad de apariciones.

  Ejemplo:
  - Entrada: "roma", "amor" -> Salida: true
  - Entrada: "Hola", "aloh" -> Salida: true
  - Entrada: "casa", "casas" -> Salida: false

  La comparación ignora mayúsculas y minúsculas, y también los espacios en blanco.
  Si alguna de las cadenas es null, devuelve false.
  Si las longitudes son distintas, devuelve false.
  Dos cadenas vacías se consideran anagramas entre sí (devuelve true).
methodSignature: "public static boolean areAnagrams(String first, String second)"
className: Solution
estimatedMinutes: 15
difficulty: easy
hints:
  - "Normaliza ambas cadenas antes de comparar: pasa todo a minúsculas y quita los espacios."
  - "Si las longitudes normalizadas son distintas, ya puedes devolver false."
  - "Cuenta cuántas veces aparece cada carácter en la primera cadena y descuéntalas al recorrer la segunda."
