slug: is-palindrome
level: 1
topic: strings
title: "¿Es palíndromo?"
statement: |
  Escribe un método que determine si una cadena de texto es un palíndromo, es decir, si se lee igual de izquierda a derecha que de derecha a izquierda.

  Reglas del contrato:
  - Se ignoran las mayúsculas y las minúsculas.
  - Se ignoran los caracteres que no sean letras ni dígitos (espacios, comas, dos puntos, etc.).
  - Una cadena vacía es un palíndromo.
  - Si el texto es null, el método devuelve false.

  Ejemplo:
  - Entrada: "reconocer" -> Salida: true
  - Entrada: "Hola" -> Salida: false
  - Entrada: "A man, a plan, a canal: Panama" -> Salida: true
methodSignature: "public static boolean isPalindrome(String text)"
className: Solution
estimatedMinutes: 12
difficulty: easy
hints:
  - "Usa dos índices: uno al inicio y otro al final de la cadena."
  - "Salta los caracteres que no sean letras ni dígitos con Character.isLetterOrDigit."
  - "Compara los caracteres ya convertidos a minúscula con Character.toLowerCase; si alguno no coincide, no es palíndromo."
