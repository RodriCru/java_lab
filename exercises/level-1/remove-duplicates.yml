slug: remove-duplicates
level: 1
topic: arrays
title: Eliminar duplicados
statement: |
  Escribe un método que devuelva un arreglo NUEVO sin valores duplicados, conservando el ORDEN de primera aparición de cada valor.

  Ejemplo:
  - removeDuplicates([1, 2, 1, 3, 2]) -> [1, 2, 3]
  - removeDuplicates([5, 5, 5]) -> [5]
  - removeDuplicates([]) -> []

  Si el arreglo es null, devuelve un arreglo vacío (new int[0]). El arreglo de entrada nunca debe modificarse.
methodSignature: "public static int[] removeDuplicates(int[] numbers)"
className: Solution
estimatedMinutes: 15
difficulty: easy
hints:
  - "Usa un arreglo auxiliar del mismo tamaño para ir guardando los valores que ya aparecieron."
  - "Antes de agregar un valor, revisa si ya lo guardaste recorriendo el arreglo auxiliar."
  - "Lleva un contador con la cantidad de valores únicos y copia solo esa cantidad al arreglo final."
