referenceSolution: |
  public class Solution {
      public static int[] removeDuplicates(int[] numbers) {
          if (numbers == null) {
              return new int[0];
          }
          int[] unicos = new int[numbers.length];
          int cantidad = 0;
          for (int i = 0; i < numbers.length; i++) {
              boolean repetido = false;
              for (int j = 0; j < cantidad; j++) {
                  if (unicos[j] == numbers[i]) {
                      repetido = true;
                      break;
                  }
              }
              if (!repetido) {
                  unicos[cantidad] = numbers[i];
                  cantidad++;
              }
          }
          int[] resultado = new int[cantidad];
          for (int i = 0; i < cantidad; i++) {
              resultado[i] = unicos[i];
          }
          return resultado;
      }
  }
tests: |
  import org.junit.jupiter.api.DisplayName;
  import org.junit.jupiter.api.Test;

  import static org.junit.jupiter.api.Assertions.*;

  class SolutionTest {

      @Test
      @DisplayName("Elimina duplicados conservando el orden de primera aparición")
      void eliminaDuplicados() {
          assertArrayEquals(new int[] {1, 2, 3}, Solution.removeDuplicates(new int[] {1, 2, 1, 3, 2}));
      }

      @Test
      @DisplayName("Devuelve un solo elemento cuando todos los valores son iguales")
      void todosIguales() {
          assertArrayEquals(new int[] {5}, Solution.removeDuplicates(new int[] {5, 5, 5}));
      }

      @Test
      @DisplayName("Devuelve el mismo contenido cuando no hay duplicados")
      void sinDuplicados() {
          assertArrayEquals(new int[] {4, 9, 2}, Solution.removeDuplicates(new int[] {4, 9, 2}));
      }

      @Test
      @DisplayName("Devuelve un arreglo vacío cuando la entrada está vacía")
      void arregloVacio() {
          assertArrayEquals(new int[0], Solution.removeDuplicates(new int[0]));
      }

      @Test
      @DisplayName("Devuelve un arreglo vacío cuando la entrada es null")
      void entradaNula() {
          assertArrayEquals(new int[0], Solution.removeDuplicates(null));
      }

      @Test
      @DisplayName("No modifica el arreglo de entrada")
      void noModificaLaEntrada() {
          int[] original = {1, 1, 2, 3, 3};
          int[] copia = {1, 1, 2, 3, 3};
          Solution.removeDuplicates(original);
          assertArrayEquals(copia, original);
      }
  }
