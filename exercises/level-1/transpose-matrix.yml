          return new int[0][0];
      }
  }
referenceSolution: |
  public class Solution {
      public static int[][] transpose(int[][] matrix) {
          if (matrix == null || matrix.length == 0) {
              return new int[0][0];
          }
          int filas = matrix.length;
          int columnas = matrix[0].length;
          int[][] resultado = new int[columnas][filas];
          for (int i = 0; i < filas; i++) {
              for (int j = 0; j < columnas; j++) {
                  resultado[j][i] = matrix[i][j];
              }
          }
          return resultado;
      }
  }
tests: |
  import org.junit.jupiter.api.DisplayName;
  import org.junit.jupiter.api.Test;

  import static org.junit.jupiter.api.Assertions.*;

  class SolutionTest {

      @Test
      @DisplayName("Transpone una matriz de 2x3 en una de 3x2")
      void matrizRectangular() {
          int[][] resultado = Solution.transpose(new int[][] {{1, 2, 3}, {4, 5, 6}});
          assertEquals(3, resultado.length);
          assertArrayEquals(new int[] {1, 4}, resultado[0]);
          assertArrayEquals(new int[] {2, 5}, resultado[1]);
          assertArrayEquals(new int[] {3, 6}, resultado[2]);
      }

      @Test
      @DisplayName("Transpone una matriz cuadrada")
      void matrizCuadrada() {
          int[][] resultado = Solution.transpose(new int[][] {{1, 2}, {3, 4}});
          assertArrayEquals(new int[] {1, 3}, resultado[0]);
          assertArrayEquals(new int[] {2, 4}, resultado[1]);
      }

      @Test
      @DisplayName("Devuelve una matriz vacía cuando la entrada es null")
      void entradaNula() {
          int[][] resultado = Solution.transpose(null);
          assertEquals(0, resultado.length);
          assertArrayEquals(new int[0][0], resultado);
      }

      @Test
      @DisplayName("Devuelve una matriz vacía cuando la entrada está vacía")
      void matrizVacia() {
          assertArrayEquals(new int[0][0], Solution.transpose(new int[0][0]));
      }

      @Test
      @DisplayName("No modifica la matriz de entrada")
      void noModificaLaEntrada() {
          int[][] original = {{1, 2, 3}, {4, 5, 6}};
          int[][] copia = {{1, 2, 3}, {4, 5, 6}};
          Solution.transpose(original);
          assertArrayEquals(copia[0], original[0]);
          assertArrayEquals(copia[1], original[1]);
      }
  }
