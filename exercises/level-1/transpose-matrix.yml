slug: transpose-matrix
level: 1
topic: matrices-patterns
title: Transponer una matriz
statement: |
  Escribe un método que devuelva una matriz NUEVA que sea la transpuesta de la matriz recibida, es decir, sus filas pasan a ser columnas y viceversa.

  Ejemplo:
  - Entrada: matrix=[[1, 2, 3], [4, 5, 6]] -> Salida: [[1, 4], [2, 5], [3, 6]]
  - Entrada: matrix=[[1, 2], [3, 4]] -> Salida: [[1, 3], [2, 4]]
  - Entrada: matrix=[] -> Salida: []

  Si la matriz es null o está vacía, devuelve una matriz vacía (new int[0][0]). La matriz de entrada nunca debe modificarse.
methodSignature: "public static int[][] transpose(int[][] matrix)"
className: Solution
estimatedMinutes: 15
difficulty: easy
hints:
  - "La matriz resultado debe tener tantas filas como columnas tenía la original, y viceversa."
  - "El elemento en la posición (i, j) de la original va en la posición (j, i) del resultado."
  - "Cuidado con matrix[0]: si la matriz no tiene filas no puedes leer sus columnas, devuelve new int[0][0]."
starterCode: |
