slug: reverse-integer
level: 1
topic: digits
title: "Invertir un número"
statement: |
  Escribe un método que invierta los dígitos de un número entero.

  Reglas del contrato:
  - Los números negativos conservan el signo: -123 -> -321.
  - Los ceros a la izquierda desaparecen: 100 -> 1, y 1200 -> 21.
  - Si el resultado invertido se sale del rango de int (de -2147483648 a 2147483647), devuelve 0. Por ejemplo, 1534236469 invertido sería 9646324351, que no cabe en un int, así que devuelve 0.

  Ejemplo:
  - Entrada: 123 -> Salida: 321
  - Entrada: -123 -> Salida: -321
  - Entrada: 100 -> Salida: 1
  - Entrada: 1534236469 -> Salida: 0
methodSignature: "public static int reverseInteger(int number)"
className: Solution
estimatedMinutes: 15
difficulty: easy
hints:
  - "Ve tomando el último dígito con el resto de dividir entre 10 y constrúyelo al otro lado multiplicando por 10."
  - "Trabaja con long para el resultado y al final comprueba si cabe en un int."
  - "Recuerda conservar el signo del número original."
starterCode: |
