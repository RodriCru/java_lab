          return 0;
      }
  }
referenceSolution: |
  public class Solution {
      public static int reverseInteger(int number) {
          long invertido = 0;
          long resto = number;
          while (resto != 0) {
              invertido = invertido * 10 + resto % 10;
              resto /= 10;
          }
          if (invertido > Integer.MAX_VALUE || invertido < Integer.MIN_VALUE) {
              return 0;
          }
          return (int) invertido;
      }
  }
tests: |
  import org.junit.jupiter.api.DisplayName;
  import org.junit.jupiter.api.Test;

  import static org.junit.jupiter.api.Assertions.assertEquals;

  class SolutionTest {

      @Test
      @DisplayName("El 123 invertido es 321")
      void numeroPositivo() {
          assertEquals(321, Solution.reverseInteger(123));
      }

      @Test
      @DisplayName("El -123 invertido conserva el signo y es -321")
      void numeroNegativo() {
          assertEquals(-321, Solution.reverseInteger(-123));
      }

      @Test
      @DisplayName("El cero invertido es cero")
      void numeroCero() {
          assertEquals(0, Solution.reverseInteger(0));
      }

      @Test
      @DisplayName("Los ceros a la izquierda desaparecen al invertir")
      void cerosAlFinal() {
          assertEquals(1, Solution.reverseInteger(100));
          assertEquals(21, Solution.reverseInteger(1200));
      }

      @Test
      @DisplayName("Invertir 1534236469 desborda el rango de int y devuelve cero")
      void desbordamientoDevuelveCero() {
          assertEquals(0, Solution.reverseInteger(1534236469));
      }

      @Test
      @DisplayName("Se invierte correctamente un múltiplo de 10 negativo")
      void multiploDeDiezNegativo() {
          assertEquals(-1, Solution.reverseInteger(-10));
      }
  }
