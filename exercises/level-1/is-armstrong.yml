slug: is-armstrong
level: 1
topic: digits
title: "¿Es número de Armstrong?"
statement: |
  Escribe un método que determine si un número entero es un número de Armstrong.

  Un número es de Armstrong si la suma de sus dígitos elevados al número de dígitos es igual al propio número: 153 tiene tres dígitos y 1³ + 5³ + 3³ = 153.

  Reglas del contrato:
  - Los números negativos nunca son de Armstrong.
  - El 0 sí es de Armstrong, porque cumple la condición con un solo dígito.
  - Los números de un solo dígito (del 0 al 9) son todos de Armstrong.

  Ejemplo:
  - isArmstrong(153) -> true
  - isArmstrong(9474) -> true
  - isArmstrong(100) -> false
methodSignature: "public static boolean isArmstrong(int number)"
className: Solution
estimatedMinutes: 15
difficulty: easy
hints:
  - "Primero descarta los números negativos y calcula cuántos dígitos tiene el número."
  - "Recorre los dígitos con el resto de dividir entre 10 y acumula cada dígito elevado al número de dígitos."
  - "Al final compara la suma con el número original; ojo con las potencias, que pueden desbordar un int si usas Math.pow, así que multiplica en un bucle."
