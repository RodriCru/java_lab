referenceSolution: |
  public class Solution {
      public static boolean isArmstrong(int number) {
          if (number < 0) {
              return false;
          }
          int digitos = contarDigitos(number);
          int resto = number;
          long suma = 0;
          while (resto > 0) {
              int digito = resto % 10;
              long potencia = 1;
              for (int i = 0; i < digitos; i++) {
                  potencia *= digito;
              }
              suma += potencia;
              resto /= 10;
          }
          return suma == number;
      }

      private static int contarDigitos(int number) {
          int digitos = 1;
          int resto = number;
          while (resto >= 10) {
              resto /= 10;
              digitos++;
          }
          return digitos;
      }
  }
tests: |
  import org.junit.jupiter.api.DisplayName;
  import org.junit.jupiter.api.Test;

  import static org.junit.jupiter.api.Assertions.assertFalse;
  import static org.junit.jupiter.api.Assertions.assertTrue;

  class SolutionTest {

      @Test
      @DisplayName("El 153 es de Armstrong porque 1³ + 5³ + 3³ = 153")
      void casoClasicoDeTresDigitos() {
          assertTrue(Solution.isArmstrong(153));
      }

      @Test
      @DisplayName("El 9474 es de Armstrong porque 9⁴ + 4⁴ + 7⁴ + 4⁴ = 9474")
      void casoDeCuatroDigitos() {
          assertTrue(Solution.isArmstrong(9474));
      }

      @Test
      @DisplayName("El 100 no es de Armstrong")
      void numeroQueNoEsArmstrong() {
          assertFalse(Solution.isArmstrong(100));
      }

      @Test
      @DisplayName("El 0 y los números de un solo dígito son de Armstrong")
      void cerosYUnDigito() {
          assertTrue(Solution.isArmstrong(0));
          assertTrue(Solution.isArmstrong(5));
          assertTrue(Solution.isArmstrong(9));
      }

      @Test
      @DisplayName("Los números negativos no son de Armstrong")
      void numerosNegativos() {
          assertFalse(Solution.isArmstrong(-153));
      }

      @Test
      @DisplayName("El 9474 no es el único de cuatro dígitos: el 1634 también lo es")
      void otroCasoDeCuatroDigitos() {
          assertTrue(Solution.isArmstrong(1634));
          assertFalse(Solution.isArmstrong(1635));
      }
  }
