referenceSolution: |
  public class Solution {

      public record Money(long cents) {
      }

      public static boolean hasEnough(Money wallet, int price) {
          if (wallet == null) {
              return false;
          }
          return wallet.cents() >= price;
      }
  }
tests: |
  import org.junit.jupiter.api.DisplayName;
  import org.junit.jupiter.api.Test;

  import static org.junit.jupiter.api.Assertions.*;

  class SolutionTest {

      @Test
      @DisplayName("Alcanza cuando el saldo supera el precio")
      void saldoMayor() {
          assertTrue(Solution.hasEnough(new Solution.Money(500), 300));
      }

      @Test
      @DisplayName("Alcanza cuando el saldo es exactamente el precio")
      void saldoExacto() {
          assertTrue(Solution.hasEnough(new Solution.Money(300), 300));
      }

      @Test
      @DisplayName("No alcanza cuando el saldo es menor que el precio")
      void saldoInsuficiente() {
          assertFalse(Solution.hasEnough(new Solution.Money(100), 250));
      }

      @Test
      @DisplayName("Un saldo de cero alcanza solo si el precio es cero")
      void saldoCero() {
          assertTrue(Solution.hasEnough(new Solution.Money(0), 0));
          assertFalse(Solution.hasEnough(new Solution.Money(0), 1));
      }

      @Test
      @DisplayName("Un wallet null devuelve false")
      void walletNull() {
          assertFalse(Solution.hasEnough(null, 100));
      }

      @Test
      @DisplayName("Un saldo muy grande alcanza cualquier precio del rango int")
      void valoresLimite() {
          assertTrue(Solution.hasEnough(new Solution.Money(Long.MAX_VALUE), Integer.MAX_VALUE));
      }
  }
