slug: money-record
level: 1
topic: oop
title: Un registro para dinero
statement: |
  Dentro del archivo Solution.java ya existe un record llamado Money con un único componente: los centavos. Escribe un método que reciba un objeto Money y un precio en centavos, y devuelva true si el saldo alcanza para pagar el precio.

  Reglas del contrato:
  - El precio también viene expresado en centavos.
  - Alcanza si el saldo es mayor o igual que el precio.
  - El record Money tiene un accesor cents() que devuelve los centavos.

  Ejemplo:
  - Entrada: wallet=Money(500), price=300 -> Salida: true
  - Entrada: wallet=Money(300), price=300 -> Salida: true
  - Entrada: wallet=Money(100), price=250 -> Salida: false

  Si wallet es null, devuelve false.
methodSignature: "public static boolean hasEnough(Money wallet, int price)"
className: Solution
estimatedMinutes: 12
difficulty: easy
