slug: sum-matrix
level: 1
topic: matrices-patterns
title: Suma de una matriz
statement: |
  Escribe un método que devuelva la suma de todos los elementos de una matriz de enteros.

  Ejemplo:
  - Entrada: matrix=[[1, 2], [3, 4]] -> Salida: 10
  - Entrada: matrix=[[5]] -> Salida: 5
  - Entrada: matrix=[[-1, -2], [1, 2]] -> Salida: 0

  Si la matriz es null, devuelve 0. La matriz de entrada nunca debe modificarse.
methodSignature: "public static int sumMatrix(int[][] matrix)"
className: Solution
estimatedMinutes: 10
difficulty: easy
hints:
  - "Necesitas dos ciclos: uno para las filas y otro para las columnas de cada fila."
  - "Acumula cada elemento en una variable suma y devuélvela al final."
  - "Antes de recorrer, revisa si matrix es null para no provocar un NullPointerException."
starterCode: |
