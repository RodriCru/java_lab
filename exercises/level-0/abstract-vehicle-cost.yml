slug: abstract-vehicle-cost
level: 0
topic: abstraction
title: Costo de viaje con clase abstracta
statement: |
  Una clase abstracta agrupa los campos y comportamientos comunes y obliga a las subclases a implementar lo que cambia. En Solution la clase abstracta Vehicle guarda el nombre y la tarifa por kilómetro, y declara el método abstracto calculateCost(km). No se puede hacer new Vehicle(...).

  Completa las subclases:
  - Car(name, ratePerKm): calculateCost(km) = km * tarifa por km.
  - Truck(name, ratePerKm, tons): calculateCost(km) = km * tarifa por km + tons * 50 (cargo fijo de 50 por tonelada). Usa getRatePerKm() para leer la tarifa del padre.
  - totalCost recibe una flota (lista de Vehicle) y un número de km y devuelve la suma del costo de cada vehículo para esos km. Si la flota es null o está vacía devuelve 0.0.

  Ejemplo:
  - Entrada: [Car("A", 2.5)], km=10 -> Salida: 25.0
  - Entrada: [Truck("T", 4.0, 2.0)], km=10 -> Salida: 140.0 (10*4.0 + 2.0*50)
  - Entrada: [Car("A", 2.5), Truck("T", 4.0, 2.0)], km=10 -> Salida: 165.0
methodSignature: public static double totalCost(List<Vehicle> fleet, int km)
className: Solution
estimatedMinutes: 20
difficulty: medium
hints:
- Una subclase concreta DEBE implementar todos los métodos abstract que heredó; si no, el compilador falla.
- 'Los campos de Vehicle son private: desde la subclase usa los getters (getRatePerKm()).'
- En totalCost recorre la flota y suma v.calculateCost(km); Java decide en tiempo de ejecución si ejecuta la versión de Car o de Truck.
