topic: spring-principles
title: Inyección por constructor
statement: |
  La **inyección de dependencias** significa que una clase no crea lo que necesita: se lo entregan desde fuera. La forma más recomendada (la que usa Spring) es la **inyección por constructor**: el servicio recibe su dependencia como parámetro y la guarda en un campo final. Así depende de una interfaz y se puede probar con una implementación falsa.

  Dentro de Solution ya existe la interfaz UserRepository con el método String findNameById(int id) (devuelve null si el usuario no existe). Completa la clase anidada GreetingService:
  - Su constructor recibe un UserRepository y lo guarda. Si es null, lanza IllegalArgumentException.
  - greet(int id) devuelve "Hola, " + nombre + "!" usando el repositorio; si el repositorio devuelve null, devuelve "Hola, invitado!".

  Además, escribe el método greetUser, que crea un GreetingService con el repositorio recibido y devuelve greet(id).

  Ejemplos (repositorio donde 1 -> "Ana"):
  - greetUser(repo, 1) -> "Hola, Ana!"
  - greetUser(repo, 99) -> "Hola, invitado!"
  - greetUser(null, 1) -> lanza IllegalArgumentException
methodSignature: "public static String greetUser(UserRepository repository, int id)"
