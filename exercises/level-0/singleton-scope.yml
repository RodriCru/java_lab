hints:
  - "Guarda la receta junto con su scope: por ejemplo un Map<String, Supplier<Object>> y un Map<String, Scope>, o una clase anidada privada con ambos datos."
  - "En get, mira el scope: si es PROTOTYPE devuelve supplier.get() directamente, sin guardar nada."
  - "Si es SINGLETON, usa un Map<String, Object> de instancias: si ya existe (containsKey) devuélvelo; si no, créalo, guárdalo y devuélvelo."
