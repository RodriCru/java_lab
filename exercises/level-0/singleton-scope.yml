referenceSolution: |
  import java.util.*;
  import java.util.function.Supplier;

  public class Solution {

      public enum Scope {
          SINGLETON,
          PROTOTYPE
      }

      public static class Container {
          private final Map<String, Supplier<Object>> recipes = new HashMap<>();
          private final Map<String, Scope> scopes = new HashMap<>();
          private final Map<String, Object> singletons = new HashMap<>();

          public void register(String name, Supplier<Object> supplier, Scope scope) {
              if (supplier == null || scope == null) {
                  throw new IllegalArgumentException("supplier y scope son obligatorios");
              }
              if (recipes.containsKey(name)) {
                  throw new IllegalStateException("Bean ya registrado: " + name);
              }
              recipes.put(name, supplier);
              scopes.put(name, scope);
          }

          public Object get(String name) {
              Supplier<Object> supplier = recipes.get(name);
              if (supplier == null) {
                  throw new IllegalArgumentException("Bean no registrado: " + name);
              }
              if (scopes.get(name) == Scope.PROTOTYPE) {
                  return supplier.get();
              }
              if (!singletons.containsKey(name)) {
                  singletons.put(name, supplier.get());
              }
              return singletons.get(name);
          }
      }

      public static Container newContainer() {
          return new Container();
      }
  }
tests: |
  import org.junit.jupiter.api.DisplayName;
  import org.junit.jupiter.api.Test;

  import static org.junit.jupiter.api.Assertions.*;

  class SolutionTest {

      @Test
      @DisplayName("SINGLETON devuelve siempre la misma instancia")
      void singletonMismaInstancia() {
          Solution.Container c = Solution.newContainer();
          c.register("o", Object::new, Solution.Scope.SINGLETON);
          assertSame(c.get("o"), c.get("o"));
      }

      @Test
      @DisplayName("SINGLETON crea una sola instancia aunque se pida varias veces")
      void singletonCuentaInstancias() {
          int[] created = {0};
          Solution.Container c = Solution.newContainer();
          c.register("o", () -> {
              created[0]++;
              return new Object();
          }, Solution.Scope.SINGLETON);
          c.get("o");
          c.get("o");
          c.get("o");
          assertEquals(1, created[0]);
      }

      @Test
      @DisplayName("PROTOTYPE devuelve una instancia distinta en cada llamada")
      void prototypeInstanciasDistintas() {
          Solution.Container c = Solution.newContainer();
          c.register("o", Object::new, Solution.Scope.PROTOTYPE);
          assertNotSame(c.get("o"), c.get("o"));
      }

      @Test
      @DisplayName("PROTOTYPE crea una instancia por cada get")
      void prototypeCuentaInstancias() {
          int[] created = {0};
          Solution.Container c = Solution.newContainer();
          c.register("o", () -> {
              created[0]++;
              return new Object();
          }, Solution.Scope.PROTOTYPE);
          c.get("o");
          c.get("o");
          c.get("o");
          assertEquals(3, created[0]);
      }

      @Test
      @DisplayName("Registrar no crea instancias: es perezoso en ambos scopes")
      void creacionPerezosa() {
          int[] created = {0};
          Solution.Container c = Solution.newContainer();
          c.register("s", () -> {
              created[0]++;
              return new Object();
          }, Solution.Scope.SINGLETON);
          c.register("p", () -> {
              created[0]++;
              return new Object();
          }, Solution.Scope.PROTOTYPE);
          assertEquals(0, created[0]);
      }

      @Test
      @DisplayName("Un singleton y un prototype conviven en el mismo contenedor")
      void convivencia() {
          Solution.Container c = Solution.newContainer();
          c.register("s", Object::new, Solution.Scope.SINGLETON);
          c.register("p", Object::new, Solution.Scope.PROTOTYPE);
          assertSame(c.get("s"), c.get("s"));
          assertNotSame(c.get("p"), c.get("p"));
      }

      @Test
      @DisplayName("Errores: nombre desconocido, duplicado y argumentos null")
      void errores() {
          Solution.Container c = Solution.newContainer();
          assertThrows(IllegalArgumentException.class, () -> c.get("x"));
          c.register("a", Object::new, Solution.Scope.SINGLETON);
          assertThrows(IllegalStateException.class, () -> c.register("a", Object::new, Solution.Scope.PROTOTYPE));
          assertThrows(IllegalArgumentException.class, () -> c.register("b", null, Solution.Scope.SINGLETON));
          assertThrows(IllegalArgumentException.class, () -> c.register("b", Object::new, null));
      }
  }
