slug: singleton-scope
level: 0
topic: spring-principles
title: Scope singleton y prototype
statement: |
  En Spring cada bean tiene un **scope**:
  - **singleton** (por defecto): se crea UNA sola instancia y se reutiliza siempre.
  - **prototype**: se crea una instancia NUEVA cada vez que se pide.

  Dentro de Solution existen el enum Scope (SINGLETON, PROTOTYPE) y la clase anidada Container (con esqueleto). Impleméntala sin reflexión:
  - register(String name, Supplier<Object> supplier, Scope scope): registra la receta con su scope. No crea nada todavía. Si el nombre ya existe, lanza IllegalStateException. Si supplier o scope son null, lanza IllegalArgumentException.
  - get(String name): para SINGLETON, llama al supplier la primera vez y devuelve siempre esa misma instancia; para PROTOTYPE, llama al supplier en CADA llamada y devuelve el objeto nuevo. Si el nombre no está registrado, lanza IllegalArgumentException.

  El método newContainer devuelve un contenedor nuevo y vacío.

  Ejemplo (el supplier cuenta cuántas veces se llama):
  - SINGLETON, tres get -> el supplier se llamó 1 vez y los tres resultados son el mismo objeto
  - PROTOTYPE, tres get -> el supplier se llamó 3 veces y los tres resultados son objetos distintos
methodSignature: "public static Container newContainer()"
className: Solution
estimatedMinutes: 20
