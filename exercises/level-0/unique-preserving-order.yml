title: Únicos conservando el orden
statement: |
  Escribe un método que reciba una lista de enteros y devuelva una nueva lista sin duplicados, conservando el orden de la primera aparición de cada valor. Usa un LinkedHashSet: es un Set (no admite repetidos) que además recuerda el orden de inserción.

  Ejemplos:
  - [3, 1, 3, 2, 1] -> [3, 1, 2]
  - [5, 5, 5] -> [5]
  - [1, 2, 3] -> [1, 2, 3]

  No modifiques la lista original. Si la lista es null o está vacía, devuelve una lista vacía.
