referenceSolution: |
  import java.util.ArrayList;
  import java.util.LinkedHashSet;
  import java.util.List;

  public class Solution {
      public static List<Integer> uniquePreservingOrder(List<Integer> list) {
          if (list == null) {
              return new ArrayList<>();
          }
          return new ArrayList<>(new LinkedHashSet<>(list));
      }
  }
tests: |
  import org.junit.jupiter.api.DisplayName;
  import org.junit.jupiter.api.Test;

  import java.util.*;

  import static org.junit.jupiter.api.Assertions.*;

  class SolutionTest {

      @Test
      @DisplayName("Elimina duplicados conservando el orden")
      void t20378() {
          assertEquals(Arrays.asList(3, 1, 2), Solution.uniquePreservingOrder(Arrays.asList(3, 1, 3, 2, 1)));
      }

      @Test
      @DisplayName("Todos iguales dan un solo elemento")
      void t35522() {
          assertEquals(List.of(5), Solution.uniquePreservingOrder(Arrays.asList(5, 5, 5)));
      }

      @Test
      @DisplayName("Sin duplicados queda igual")
      void t94303() {
          assertEquals(Arrays.asList(1, 2, 3), Solution.uniquePreservingOrder(Arrays.asList(1, 2, 3)));
      }

      @Test
      @DisplayName("Lista vacía o null da lista vacía")
      void t3552() {
          assertTrue(Solution.uniquePreservingOrder(new ArrayList<>()).isEmpty());
          assertTrue(Solution.uniquePreservingOrder(null).isEmpty());
      }

      @Test
      @DisplayName("No modifica la lista original")
      void t51121() {
          List<Integer> original = new ArrayList<>(Arrays.asList(2, 2, 1));
          Solution.uniquePreservingOrder(original);
          assertEquals(Arrays.asList(2, 2, 1), original);
      }

      @Test
      @DisplayName("El orden NO es el natural")
      void t36180() {
          assertEquals(Arrays.asList(9, 4, 7), Solution.uniquePreservingOrder(Arrays.asList(9, 4, 9, 7, 4)));
      }

      @Test
      @DisplayName("Funciona con negativos")
      void t72205() {
          assertEquals(Arrays.asList(-1, 0, 1), Solution.uniquePreservingOrder(Arrays.asList(-1, 0, -1, 1, 0)));
      }
  }
