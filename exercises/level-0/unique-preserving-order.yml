estimatedMinutes: 10
difficulty: easy
hints:
- Un HashSet elimina duplicados pero no garantiza el orden; LinkedHashSet elimina duplicados Y conserva el orden de inserción.
- 'Crea new LinkedHashSet<>(list): el constructor copia los elementos y descarta repetidos automáticamente.'
- Convierte el resultado a lista con new ArrayList<>(set). Antes, comprueba el caso null para devolver new ArrayList<>().
