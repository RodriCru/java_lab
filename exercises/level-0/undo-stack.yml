slug: undo-stack
level: 0
topic: collections
title: Pila para deshacer
statement: |
  Una pila (stack) es LIFO: lo último que entra es lo primero que sale. En Java se usa Deque con ArrayDeque y los métodos push (apilar) y pop (desapilar). Es la estructura ideal para "deshacer".

  Simula un editor de texto que parte con el texto vacío "". Recibes una lista de comandos:
  - "WRITE <texto>" agrega <texto> al final del texto actual (lo que sigue a "WRITE ", puede contener espacios).
  - "UNDO" deshace el último WRITE que aún no se haya deshecho, devolviendo el texto al estado anterior. Si no hay nada que deshacer, no hace nada.

  Devuelve el texto final. Una lista null o vacía devuelve "".

  Ejemplos:
  - ["WRITE Hola", "WRITE  mundo"] -> "Hola mundo"   (el segundo comando agrega " mundo" con espacio inicial)
  - ["WRITE a", "WRITE b", "UNDO"] -> "a"
  - ["UNDO", "WRITE x"] -> "x"
  - ["WRITE a", "UNDO", "UNDO"] -> ""
methodSignature: "public static String applyCommands(List<String> commands)"
