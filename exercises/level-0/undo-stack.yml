referenceSolution: |
  import java.util.*;

  public class Solution {

      public static String applyCommands(List<String> commands) {
          String text = "";
          if (commands == null) {
              return text;
          }
          Deque<String> history = new ArrayDeque<>();
          for (String command : commands) {
              if (command.equals("UNDO")) {
                  if (!history.isEmpty()) {
                      text = history.pop();
                  }
              } else if (command.startsWith("WRITE ")) {
                  history.push(text);
                  text = text + command.substring(6);
              }
          }
          return text;
      }
  }
tests: |
  import org.junit.jupiter.api.DisplayName;
  import org.junit.jupiter.api.Test;

  import java.util.*;

  import static org.junit.jupiter.api.Assertions.*;

  class SolutionTest {

      @Test
      @DisplayName("Varios WRITE se acumulan")
      void escribirVarios() {
          assertEquals("Hola mundo", Solution.applyCommands(List.of("WRITE Hola", "WRITE  mundo")));
      }

      @Test
      @DisplayName("UNDO deshace el último WRITE")
      void deshacerUno() {
          assertEquals("a", Solution.applyCommands(List.of("WRITE a", "WRITE b", "UNDO")));
      }

      @Test
      @DisplayName("UNDO sin historial no hace nada")
      void deshacerSinHistorial() {
          assertEquals("x", Solution.applyCommands(List.of("UNDO", "WRITE x")));
      }

      @Test
      @DisplayName("Más UNDO que WRITE deja el texto vacío")
      void deshacerDeMas() {
          assertEquals("", Solution.applyCommands(List.of("WRITE a", "UNDO", "UNDO")));
      }

      @Test
      @DisplayName("Los UNDO se aplican en orden inverso (LIFO)")
      void ordenLifo() {
          assertEquals("ab", Solution.applyCommands(List.of("WRITE a", "WRITE b", "WRITE c", "WRITE d", "UNDO", "UNDO")));
      }

      @Test
      @DisplayName("Se puede escribir de nuevo después de deshacer")
      void escribirTrasDeshacer() {
          assertEquals("az", Solution.applyCommands(List.of("WRITE a", "WRITE b", "UNDO", "WRITE z")));
      }

      @Test
      @DisplayName("Una lista null o vacía devuelve cadena vacía")
      void listaVaciaONula() {
          assertEquals("", Solution.applyCommands(null));
          assertEquals("", Solution.applyCommands(new ArrayList<>()));
      }
  }
