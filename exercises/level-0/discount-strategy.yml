slug: discount-strategy
level: 0
topic: abstraction
title: Estrategia de descuento
statement: |
  El patrón estrategia permite cambiar un algoritmo sin tocar el código que lo usa. Dentro de Solution existe la interfaz DiscountStrategy con el método:

    int apply(int price)    // devuelve el precio ya con descuento

  Completa las implementaciones (todo en enteros):
  - NoDiscount: devuelve el precio sin cambios.
  - PercentDiscount(int percent): resta percent % del precio, con división entera: price - price * percent / 100.
  - FixedDiscount(int amount): resta una cantidad fija, pero nunca devuelve menos de 0.

  Y el método finalPrice(price, strategy), que devuelve lo que calcule la estrategia. Si strategy es null, devuelve el precio sin cambios.

  Ejemplos:
  - finalPrice(200, new PercentDiscount(10)) -> 180
  - finalPrice(200, new FixedDiscount(50)) -> 150
  - finalPrice(30, new FixedDiscount(50)) -> 0
  - finalPrice(200, new NoDiscount()) -> 200
methodSignature: public static int finalPrice(int price, DiscountStrategy strategy)
className: Solution
estimatedMinutes: 15
difficulty: easy
hints:
- Cada estrategia es una clase que implementa DiscountStrategy; el código que la usa no necesita saber cuál es.
- PercentDiscount guarda el porcentaje en un campo (constructor) y lo usa en apply. FixedDiscount usa Math.max(0, price - amount).
- 'finalPrice solo delega: strategy.apply(price). Antes comprueba si strategy es null.'
