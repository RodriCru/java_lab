referenceSolution: |
  public class Solution {

      public interface DiscountStrategy {
          int apply(int price);
      }

      public static class NoDiscount implements DiscountStrategy {
          @Override
          public int apply(int price) {
              return price;
          }
      }

      public static class PercentDiscount implements DiscountStrategy {
          private final int percent;

          public PercentDiscount(int percent) {
              this.percent = percent;
          }

          @Override
          public int apply(int price) {
              return price - price * percent / 100;
          }
      }

      public static class FixedDiscount implements DiscountStrategy {
          private final int amount;

          public FixedDiscount(int amount) {
              this.amount = amount;
          }

          @Override
          public int apply(int price) {
              return Math.max(0, price - amount);
          }
      }

      public static int finalPrice(int price, DiscountStrategy strategy) {
          if (strategy == null) {
              return price;
          }
          return strategy.apply(price);
      }
  }
tests: |
  import org.junit.jupiter.api.DisplayName;
  import org.junit.jupiter.api.Test;

  import static org.junit.jupiter.api.Assertions.*;

  import java.util.*;

  class SolutionTest {

      @Test
      @DisplayName("Descuento porcentual")
      void t1() throws Exception {
          assertEquals(180, Solution.finalPrice(200, new Solution.PercentDiscount(10)));
      }

      @Test
      @DisplayName("Descuento porcentual con división entera")
      void t2() throws Exception {
          assertEquals(97, Solution.finalPrice(99, new Solution.PercentDiscount(3)));
      }

      @Test
      @DisplayName("Descuento fijo")
      void t3() throws Exception {
          assertEquals(150, Solution.finalPrice(200, new Solution.FixedDiscount(50)));
      }

      @Test
      @DisplayName("El descuento fijo nunca deja el precio negativo")
      void t4() throws Exception {
          assertEquals(0, Solution.finalPrice(30, new Solution.FixedDiscount(50)));
      }

      @Test
      @DisplayName("Sin descuento el precio no cambia")
      void t5() throws Exception {
          assertEquals(200, Solution.finalPrice(200, new Solution.NoDiscount()));
      }

      @Test
      @DisplayName("Estrategia null devuelve el precio original")
      void t6() throws Exception {
          assertEquals(200, Solution.finalPrice(200, null));
      }

      @Test
      @DisplayName("Porcentaje 100 deja el precio en cero")
      void t7() throws Exception {
          assertEquals(0, Solution.finalPrice(80, new Solution.PercentDiscount(100)));
      }

      @Test
      @DisplayName("Se puede usar una estrategia propia (lambda)")
      void t8() throws Exception {
          Solution.DiscountStrategy mitad = p -> p / 2;
          assertEquals(50, Solution.finalPrice(100, mitad));
      }
  }
