slug: resource-closing-order
level: 0
topic: exceptions
title: Orden de cierre en try-with-resources
statement: |
  try-with-resources cierra automáticamente los recursos AutoCloseable, y lo hace en ORDEN INVERSO al de apertura (el último abierto se cierra primero), incluso si el cuerpo lanza una excepción.

  Dentro de Solution existe la clase Resource, que implementa AutoCloseable y registra eventos en una lista compartida:
  - El constructor agrega "abrir " + nombre.
  - close() debe agregar "cerrar " + nombre (complétalo).

  Escribe useResources(first, second, fail), que devuelve la lista de eventos:
  1. Crea la lista de eventos.
  2. Con try-with-resources abre primero Resource(first) y luego Resource(second).
  3. Dentro del cuerpo: si fail es true lanza new IllegalStateException("fallo"); si no, agrega "usar".
  4. Con un catch (IllegalStateException) agrega "capturado".
  5. Devuelve la lista.

  Ejemplos:
  - useResources("A", "B", false) -> [abrir A, abrir B, usar, cerrar B, cerrar A]
  - useResources("A", "B", true) -> [abrir A, abrir B, cerrar B, cerrar A, capturado]
  (el catch se ejecuta DESPUÉS de cerrar los recursos).
methodSignature: public static List<String> useResources(String first, String second, boolean fail)
className: Solution
estimatedMinutes: 20
difficulty: medium
hints:
- 'Sintaxis: try (Resource a = new Resource(first, log); Resource b = new Resource(second, log)) { ... }. Los recursos se separan con punto y coma.'
- En Resource.close() agrega 'cerrar ' + name a la lista. No declares throws en close() para no tener que capturar Exception.
- 'No cierres nada a mano: Java llama a close() en orden inverso. El catch va después del bloque try-with-resources.'
