referenceSolution: |
  public class Solution {

      public static String joinWith(String separator, String... parts) {
          StringBuilder sb = new StringBuilder();
          for (int i = 0; i < parts.length; i++) {
              if (i > 0) {
                  sb.append(separator);
              }
              sb.append(parts[i]);
          }
          return sb.toString();
      }
  }
tests: |
  import org.junit.jupiter.api.DisplayName;
  import org.junit.jupiter.api.Test;

  import static org.junit.jupiter.api.Assertions.*;

  class SolutionTest {
      @Test
      @DisplayName("Une tres partes con coma y espacio")
      void caso1() {
          assertEquals("a, b, c", Solution.joinWith(", ", "a", "b", "c"));
      }

      @Test
      @DisplayName("Une una fecha con guiones")
      void caso2() {
          assertEquals("2024-10-08", Solution.joinWith("-", "2024", "10", "08"));
      }

      @Test
      @DisplayName("Una sola parte no lleva separador")
      void caso3() {
          assertEquals("solo", Solution.joinWith("-", "solo"));
      }

      @Test
      @DisplayName("Sin partes devuelve cadena vacía")
      void caso4() {
          assertEquals("", Solution.joinWith("-"));
      }

      @Test
      @DisplayName("Separador vacío concatena")
      void caso5() {
          assertEquals("xy", Solution.joinWith("", "x", "y"));
      }

      @Test
      @DisplayName("Acepta un arreglo de cadenas")
      void caso6() {
          assertEquals("a|b", Solution.joinWith("|", new String[] {"a", "b"}));
      }

      @Test
      @DisplayName("Las partes vacías se conservan")
      void caso7() {
          assertEquals("a,,b", Solution.joinWith(",", "a", "", "b"));
      }

      @Test
      @DisplayName("Separador de varios caracteres")
      void caso8() {
          assertEquals("1 y 2 y 3", Solution.joinWith(" y ", "1", "2", "3"));
      }
  }
