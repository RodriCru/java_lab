slug: join-with-separator
level: 0
topic: functions
title: "Unir con separador"
statement: |
  Escribe un método que una varias cadenas poniendo un separador ENTRE ellas (no al principio ni al final). El primer parámetro es el separador y el resto son varargs: String... parts. Un parámetro variable debe ser siempre el último de la lista.

  Reglas:
  - Sin partes (ninguna cadena después del separador) devuelve "".
  - Con una sola parte devuelve esa parte, sin separador.
  - No uses String.join: practica con un bucle y StringBuilder.

  Ejemplos:
  - Entrada: separator=", ", parts="a", "b", "c" -> Salida: "a, b, c"
  - Entrada: separator="-", parts="2024", "10", "08" -> Salida: "2024-10-08"
  - Entrada: separator="-", parts="solo" -> Salida: "solo"
  - Entrada: separator="-" (sin partes) -> Salida: ""
  - Entrada: separator="", parts="x", "y" -> Salida: "xy"
methodSignature: "public static String joinWith(String separator, String... parts)"
className: Solution
estimatedMinutes: 12
difficulty: easy
hints:
  - "parts es un String[] dentro del método; puedes preguntar parts.length y recorrerlo con un for con índice."
  - "El truco para no dejar un separador sobrante: añade el separador ANTES de cada elemento, excepto del primero (i > 0)."
  - "Usa StringBuilder sb = new StringBuilder(); y sb.append(...); al final return sb.toString(); Con 0 partes devuelve \"\" de forma natural."
