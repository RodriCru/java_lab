slug: ticket-queue
level: 0
topic: collections
title: Cola de atención
statement: |
  Una cola (Queue) es FIFO: el primero en llegar es el primero en ser atendido. En Java se usa ArrayDeque con offer (encolar) y poll (sacar el primero).

  Simula una ventanilla. Recibes una lista de eventos de tipo String:
  - Un evento "ATENDER" significa que la ventanilla atiende a la persona que lleva más tiempo esperando.
  - Cualquier otro texto es el nombre de una persona que llega y se pone al final de la cola.

  Devuelve la lista de nombres atendidos, en el orden en que se atendieron. Si llega "ATENDER" y no hay nadie en la cola, agrega "VACÍA" a la lista de resultados. Las personas que sigan esperando al final simplemente no aparecen. Una lista null o vacía devuelve una lista vacía.

  Ejemplos:
  - ["Ana", "Luis", "ATENDER", "Marta", "ATENDER", "ATENDER"] -> ["Ana", "Luis", "Marta"]
  - ["ATENDER", "Ana"] -> ["VACÍA"]
  - ["Ana", "Luis"] -> []
methodSignature: "public static List<String> processEvents(List<String> events)"
className: Solution
estimatedMinutes: 15
difficulty: easy
hints:
  - "Crea una cola con Queue<String> queue = new ArrayDeque<>(); es una cola FIFO."
  - "offer(nombre) agrega al final y poll() saca y devuelve el primero; poll() devuelve null si la cola está vacía."
  - "Para cada evento: si es \"ATENDER\" haz poll y agrega el resultado (o \"VACÍA\" si fue null); si no, haz offer del nombre."
