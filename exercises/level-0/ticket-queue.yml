referenceSolution: |
  import java.util.*;

  public class Solution {

      public static List<String> processEvents(List<String> events) {
          List<String> served = new ArrayList<>();
          if (events == null) {
              return served;
          }
          Queue<String> queue = new ArrayDeque<>();
          for (String event : events) {
              if ("ATENDER".equals(event)) {
                  String next = queue.poll();
                  served.add(next == null ? "VACÍA" : next);
              } else {
                  queue.offer(event);
              }
          }
          return served;
      }
  }
tests: |
  import org.junit.jupiter.api.DisplayName;
  import org.junit.jupiter.api.Test;

  import java.util.*;

  import static org.junit.jupiter.api.Assertions.*;

  class SolutionTest {

      @Test
      @DisplayName("Se atiende en orden de llegada (FIFO)")
      void ordenFifo() {
          assertEquals(List.of("Ana", "Luis", "Marta"),
                  Solution.processEvents(List.of("Ana", "Luis", "ATENDER", "Marta", "ATENDER", "ATENDER")));
      }

      @Test
      @DisplayName("Atender con la cola vacía devuelve VACÍA")
      void colaVacia() {
          assertEquals(List.of("VACÍA"), Solution.processEvents(List.of("ATENDER", "Ana")));
      }

      @Test
      @DisplayName("Quienes siguen esperando al final no aparecen")
      void siguenEsperando() {
          assertEquals(List.of(), Solution.processEvents(List.of("Ana", "Luis")));
      }

      @Test
      @DisplayName("Una lista vacía devuelve una lista vacía")
      void listaVacia() {
          assertEquals(List.of(), Solution.processEvents(new ArrayList<>()));
      }

      @Test
      @DisplayName("Una lista null devuelve una lista vacía")
      void listaNula() {
          assertEquals(List.of(), Solution.processEvents(null));
      }

      @Test
      @DisplayName("Varios ATENDER seguidos agotan la cola y luego devuelven VACÍA")
      void agotarCola() {
          assertEquals(List.of("Ana", "VACÍA", "VACÍA"),
                  Solution.processEvents(List.of("Ana", "ATENDER", "ATENDER", "ATENDER")));
      }

      @Test
      @DisplayName("Una persona repetida se atiende tantas veces como llegó")
      void nombresRepetidos() {
          assertEquals(List.of("Ana", "Ana"),
                  Solution.processEvents(List.of("Ana", "Ana", "ATENDER", "ATENDER")));
      }
  }
