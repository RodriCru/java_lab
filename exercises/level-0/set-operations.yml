slug: set-operations
level: 0
topic: collections
title: Operaciones con conjuntos
statement: |
  Un Set guarda elementos sin repetir. Con los métodos addAll, retainAll y removeAll puedes hacer las operaciones clásicas de conjuntos.

  Escribe tres métodos que reciben dos Set<Integer> y devuelven un TreeSet<Integer> (así el resultado sale ordenado de menor a mayor):
  - union(a, b): elementos que están en a, en b o en ambos.
  - intersection(a, b): elementos que están en a Y en b.
  - difference(a, b): elementos que están en a pero NO en b.

  Reglas:
  - Los conjuntos recibidos NO deben modificarse (trabaja sobre una copia).
  - Si un parámetro es null se trata como un conjunto vacío.

  Ejemplos (a = {1, 2, 3}, b = {3, 4}):
  - union(a, b) -> [1, 2, 3, 4]
  - intersection(a, b) -> [3]
  - difference(a, b) -> [1, 2]
  - difference(b, a) -> [4]

  El método principal es union; intersection y difference también deben implementarse.
methodSignature: "public static TreeSet<Integer> union(Set<Integer> a, Set<Integer> b)"
className: Solution
estimatedMinutes: 15
difficulty: easy
hints:
  - "new TreeSet<>(a) crea una copia ordenada de a, así no modificas el conjunto original."
  - "Sobre la copia usa addAll(b) para la unión, retainAll(b) para la intersección y removeAll(b) para la diferencia."
  - "Si a es null, la copia debe empezar vacía: new TreeSet<>() (y recuerda tratar b null como vacío)."
