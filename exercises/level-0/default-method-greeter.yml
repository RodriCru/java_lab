referenceSolution: |
  public class Solution {

      public interface Greeter {
          String name();

          default String greet() {
              return "Hola, " + name() + "!";
          }

          static String shout(String text) {
              if (text == null) {
                  return "";
              }
              return text.toUpperCase();
          }
      }

      public static String greetAndShout(Greeter greeter) {
          return Greeter.shout(greeter.greet());
      }
  }
tests: |
  import org.junit.jupiter.api.DisplayName;
  import org.junit.jupiter.api.Test;

  import static org.junit.jupiter.api.Assertions.*;

  import java.util.*;

  class SolutionTest {

      @Test
      @DisplayName("El método default construye el saludo")
      void t1() throws Exception {
          Solution.Greeter g = () -> "Ana";
          assertEquals("Hola, Ana!", g.greet());
      }

      @Test
      @DisplayName("El método static pasa a mayúsculas")
      void t2() throws Exception {
          assertEquals("HOLA", Solution.Greeter.shout("hola"));
      }

      @Test
      @DisplayName("shout con null devuelve cadena vacía")
      void t3() throws Exception {
          assertEquals("", Solution.Greeter.shout(null));
      }

      @Test
      @DisplayName("greetAndShout combina ambos métodos")
      void t4() throws Exception {
          Solution.Greeter g = () -> "Ana";
          assertEquals("HOLA, ANA!", Solution.greetAndShout(g));
      }

      @Test
      @DisplayName("Una clase puede sobrescribir el método default")
      void t5() throws Exception {
          class Formal implements Solution.Greeter {
              public String name() { return "Luis"; }
              @Override
              public String greet() { return "Buenos días, " + name(); }
          }
          assertEquals("Buenos días, Luis", new Formal().greet());
          assertEquals("BUENOS DÍAS, LUIS", Solution.greetAndShout(new Formal()));
      }

      @Test
      @DisplayName("Con nombre vacío")
      void t6() throws Exception {
          Solution.Greeter g = () -> "";
          assertEquals("Hola, !", g.greet());
          assertEquals("HOLA, !", Solution.greetAndShout(g));
      }

      @Test
      @DisplayName("Los nombres con minúsculas y acentos se convierten")
      void t7() throws Exception {
          Solution.Greeter g = () -> "José";
          assertEquals("HOLA, JOSÉ!", Solution.greetAndShout(g));
      }
  }
