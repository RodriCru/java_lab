slug: default-method-greeter
level: 0
topic: abstraction
title: Métodos default y static en interfaces
statement: |
  Desde Java 8 una interfaz puede tener métodos con cuerpo:
  - default: lo heredan todas las clases que la implementan (y pueden sobrescribirlo).
  - static: pertenece a la interfaz y se llama como Greeter.shout(...).

  Dentro de Solution existe la interfaz Greeter con el método abstracto String name(). Completa:
  - default String greet(): devuelve "Hola, " + name() + "!".
  - static String shout(String text): devuelve el texto en MAYÚSCULAS (si es null, devuelve "").
  - El método greetAndShout(greeter): devuelve Greeter.shout(greeter.greet()).

  Ejemplos (con un Greeter cuyo name() es "Ana"):
  - greet() -> "Hola, Ana!"
  - Greeter.shout("hola") -> "HOLA"
  - greetAndShout(greeter) -> "HOLA, ANA!"

  Si una clase sobrescribe greet(), greetAndShout usa esa versión.
methodSignature: public static String greetAndShout(Greeter greeter)
className: Solution
estimatedMinutes: 15
difficulty: easy
hints:
- 'Un método default se escribe dentro de la interfaz así: default String greet() { ... }.'
- 'Un método static de interfaz se escribe: static String shout(String text) { ... }. Usa text.toUpperCase() y cuida el null.'
- En greetAndShout llama primero greeter.greet() y pasa el resultado a Greeter.shout(...).
