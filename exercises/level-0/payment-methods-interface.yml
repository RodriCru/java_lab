slug: payment-methods-interface
level: 0
topic: abstraction
title: Métodos de pago con interfaz
statement: |
  Una interfaz define QUÉ se puede hacer sin decir CÓMO. Dentro de Solution ya existe la interfaz Payment con un único método:

    int commission(int amount)

  Todas las cantidades son enteros (por ejemplo, centavos). Completa:
  - La clase CardPayment: su comisión es el 3 % del monto, con división entera (amount * 3 / 100).
  - La clase CashPayment: no cobra comisión (0).
  - El método totalToPay(payment, amount): devuelve el monto más la comisión que calcule el pago recibido. No importa qué implementación sea: usa solo la interfaz.

  Ejemplos:
  - totalToPay(new CardPayment(), 100) -> 103
  - totalToPay(new CardPayment(), 250) -> 257   (250 * 3 / 100 = 7)
  - totalToPay(new CashPayment(), 100) -> 100

  Si payment es null, devuelve el monto sin comisión.
methodSignature: public static int totalToPay(Payment payment, int amount)
className: Solution
estimatedMinutes: 15
difficulty: easy
hints:
- Una interfaz solo declara el método; cada clase que la implementa (implements Payment) debe darle cuerpo con @Override.
- CardPayment.commission devuelve amount * 3 / 100. CashPayment.commission devuelve 0.
- 'En totalToPay llama a payment.commission(amount): Java elige la implementación correcta en tiempo de ejecución (polimorfismo). No olvides el caso null.'
