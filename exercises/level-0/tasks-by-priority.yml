referenceSolution: |
  import java.util.*;

  public class Solution {

      public static class Task {
          private final String name;
          private final int priority;

          public Task(String name, int priority) {
              this.name = name;
              this.priority = priority;
          }

          public String getName() {
              return name;
          }

          public int getPriority() {
              return priority;
          }
      }

      public static List<String> executionOrder(List<Task> tasks) {
          List<String> order = new ArrayList<>();
          if (tasks == null) {
              return order;
          }
          PriorityQueue<Task> queue = new PriorityQueue<>(
                  Comparator.comparingInt(Task::getPriority).thenComparing(Task::getName));
          queue.addAll(tasks);
          while (!queue.isEmpty()) {
              order.add(queue.poll().getName());
          }
          return order;
      }
  }
tests: |
  import org.junit.jupiter.api.DisplayName;
  import org.junit.jupiter.api.Test;

  import java.util.*;

  import static org.junit.jupiter.api.Assertions.*;

  class SolutionTest {

      @Test
      @DisplayName("Ordena por prioridad ascendente")
      void porPrioridad() {
          List<Solution.Task> tasks = List.of(
                  new Solution.Task("lavar", 3), new Solution.Task("pagar", 1), new Solution.Task("cocinar", 2));
          assertEquals(List.of("pagar", "cocinar", "lavar"), Solution.executionOrder(tasks));
      }

      @Test
      @DisplayName("Con igual prioridad desempata por nombre alfabético")
      void desempate() {
          List<Solution.Task> tasks = List.of(new Solution.Task("b", 1), new Solution.Task("a", 1));
          assertEquals(List.of("a", "b"), Solution.executionOrder(tasks));
      }

      @Test
      @DisplayName("Combina prioridad y desempate")
      void mixto() {
          List<Solution.Task> tasks = List.of(
                  new Solution.Task("z", 2), new Solution.Task("m", 1), new Solution.Task("a", 2), new Solution.Task("c", 1));
          assertEquals(List.of("c", "m", "a", "z"), Solution.executionOrder(tasks));
      }

      @Test
      @DisplayName("Una sola tarea devuelve esa tarea")
      void unaTarea() {
          assertEquals(List.of("solo"), Solution.executionOrder(List.of(new Solution.Task("solo", 9))));
      }

      @Test
      @DisplayName("Una lista vacía o null devuelve lista vacía")
      void vaciaONula() {
          assertEquals(List.of(), Solution.executionOrder(new ArrayList<>()));
          assertEquals(List.of(), Solution.executionOrder(null));
      }

      @Test
      @DisplayName("Admite prioridades negativas y no modifica la lista de entrada")
      void negativasYSinMutar() {
          List<Solution.Task> tasks = new ArrayList<>(List.of(
                  new Solution.Task("x", 5), new Solution.Task("y", -2), new Solution.Task("w", 0)));
          assertEquals(List.of("y", "w", "x"), Solution.executionOrder(tasks));
          assertEquals(3, tasks.size());
          assertEquals("x", tasks.get(0).getName());
      }
  }
