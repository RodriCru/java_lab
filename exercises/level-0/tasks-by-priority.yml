title: Tareas por prioridad
statement: |
  Una PriorityQueue siempre entrega primero el "menor" elemento según su orden (o según el Comparator que le des). Es ideal para atender tareas por prioridad.

  Dentro de Solution ya existe la clase anidada Task, con name (String) y priority (int), y los getters getName() y getPriority(). Escribe un método que devuelva los nombres de las tareas en el orden en que deben ejecutarse:
  - Primero las de MENOR número de prioridad (1 es más urgente que 5).
  - Si dos tareas tienen la misma prioridad, primero la de nombre menor alfabéticamente (String.compareTo).

  Una lista null o vacía devuelve una lista vacía. No modifiques la lista recibida.

  Ejemplos:
  - orderByPriority(List.of(new Task("lavar", 3), new Task("pagar", 1), new Task("cocinar", 2))) -> ["pagar", "cocinar", "lavar"]
  - orderByPriority(List.of(new Task("b", 1), new Task("a", 1))) -> ["a", "b"]
methodSignature: "public static List<String> executionOrder(List<Task> tasks)"
className: Solution
estimatedMinutes: 20
difficulty: medium
hints:
  - "Crea new PriorityQueue<Task>(comparador) y agrega todas las tareas con addAll o add."
  - "El comparador: Comparator.comparingInt(Task::getPriority).thenComparing(Task::getName)."
  - "Mientras la cola no esté vacía, poll() devuelve la siguiente tarea; agrega su nombre a la lista de resultado. No iteres la PriorityQueue con for: no garantiza el orden."
