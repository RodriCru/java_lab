slug: traffic-light-enum
level: 0
topic: enums
title: Semáforo como máquina de estados
statement: |
  Un enum puede modelar una máquina de estados: cada valor es un estado y un método dice cuál es el siguiente. En Solution existe el enum Light con tres estados.

  Completa:
  - RED dura 30 segundos, GREEN dura 25 y YELLOW dura 5. getSeconds() devuelve la duración.
  - next(): el ciclo es RED -> GREEN -> YELLOW -> RED.
  - canGo(): true solo en GREEN.

  Además, totalSeconds(start, changes) devuelve el tiempo total que transcurre desde que se enciende la luz start hasta que se han completado exactamente `changes` cambios de luz. Es decir, suma la duración de start y de las luces siguientes, en total `changes` luces. Si changes es 0 devuelve 0. Si start es null devuelve 0. changes no será negativo.

  Ejemplo:
  - totalSeconds(Light.RED, 1) -> 30
  - totalSeconds(Light.RED, 3) -> 60   (30 + 25 + 5)
  - totalSeconds(Light.GREEN, 3) -> 60   (25 + 5 + 30)
  - totalSeconds(Light.YELLOW, 2) -> 35   (5 + 30)
methodSignature: public static int totalSeconds(Light start, int changes)
className: Solution
