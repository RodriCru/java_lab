referenceSolution: |
  public class Solution {

      public enum Light {
          RED(30), GREEN(25), YELLOW(5);

          private final int seconds;

          Light(int seconds) {
              this.seconds = seconds;
          }

          public int getSeconds() {
              return seconds;
          }

          public Light next() {
              switch (this) {
                  case RED:
                      return GREEN;
                  case GREEN:
                      return YELLOW;
                  default:
                      return RED;
              }
          }

          public boolean canGo() {
              return this == GREEN;
          }
      }

      public static int totalSeconds(Light start, int changes) {
          if (start == null) {
              return 0;
          }
          int total = 0;
          Light current = start;
          for (int i = 0; i < changes; i++) {
              total += current.getSeconds();
              current = current.next();
          }
          return total;
      }
  }
tests: |
  import org.junit.jupiter.api.DisplayName;
  import org.junit.jupiter.api.Test;
  import java.util.*;

  import static org.junit.jupiter.api.Assertions.*;

  class SolutionTest {

      @Test
      @DisplayName("Duración de cada luz")
      void duraciones() {
          assertEquals(30, Solution.Light.RED.getSeconds());
          assertEquals(25, Solution.Light.GREEN.getSeconds());
          assertEquals(5, Solution.Light.YELLOW.getSeconds());
      }

      @Test
      @DisplayName("El ciclo es rojo, verde, amarillo, rojo")
      void ciclo() {
          assertEquals(Solution.Light.GREEN, Solution.Light.RED.next());
          assertEquals(Solution.Light.YELLOW, Solution.Light.GREEN.next());
          assertEquals(Solution.Light.RED, Solution.Light.YELLOW.next());
      }

      @Test
      @DisplayName("Solo se puede avanzar en verde")
      void puedeAvanzar() {
          assertTrue(Solution.Light.GREEN.canGo());
          assertFalse(Solution.Light.RED.canGo());
          assertFalse(Solution.Light.YELLOW.canGo());
      }

      @Test
      @DisplayName("totalSeconds con un cambio es la duración de la luz inicial")
      void unCambio() {
          assertEquals(30, Solution.totalSeconds(Solution.Light.RED, 1));
          assertEquals(5, Solution.totalSeconds(Solution.Light.YELLOW, 1));
      }

      @Test
      @DisplayName("totalSeconds con un ciclo completo")
      void cicloCompleto() {
          assertEquals(60, Solution.totalSeconds(Solution.Light.RED, 3));
          assertEquals(60, Solution.totalSeconds(Solution.Light.GREEN, 3));
      }

      @Test
      @DisplayName("totalSeconds empezando en amarillo")
      void empezandoEnAmarillo() {
          assertEquals(35, Solution.totalSeconds(Solution.Light.YELLOW, 2));
      }

      @Test
      @DisplayName("totalSeconds con varios ciclos")
      void variosCiclos() {
          assertEquals(120, Solution.totalSeconds(Solution.Light.RED, 6));
          assertEquals(90, Solution.totalSeconds(Solution.Light.RED, 4));
      }

      @Test
      @DisplayName("totalSeconds con 0 cambios o start null devuelve 0")
      void casosBorde() {
          assertEquals(0, Solution.totalSeconds(Solution.Light.RED, 0));
          assertEquals(0, Solution.totalSeconds(null, 5));
      }
  }
