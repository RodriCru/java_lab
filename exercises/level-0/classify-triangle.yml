slug: classify-triangle
level: 0
topic: operators-decisions
title: "Clasificar un triángulo"
statement: |
  Escribe un método que clasifique un triángulo según la longitud de sus tres lados, usando if / else if y operadores lógicos (&&, ||).

  Reglas, evaluadas en este orden:
  - Si algún lado es menor o igual que 0, o si no se cumple la desigualdad triangular (la suma de dos lados cualesquiera debe ser ESTRICTAMENTE mayor que el tercero), devuelve "inválido".
  - Si los tres lados son iguales, devuelve "equilátero".
  - Si exactamente dos lados son iguales, devuelve "isósceles".
  - En otro caso, devuelve "escaleno".

  Ejemplos:
  - Entrada: a=3, b=3, c=3 -> Salida: "equilátero"
  - Entrada: a=5, b=5, c=8 -> Salida: "isósceles"
  - Entrada: a=3, b=4, c=5 -> Salida: "escaleno"
  - Entrada: a=1, b=2, c=3 -> Salida: "inválido" (1 + 2 no es mayor que 3)
  - Entrada: a=0, b=4, c=4 -> Salida: "inválido"

  Los textos se devuelven exactamente así, en minúsculas y con acentos.
methodSignature: "public static String classify(int a, int b, int c)"
className: Solution
estimatedMinutes: 10
difficulty: easy
hints:
  - "Primero descarta lo inválido: if (a <= 0 || b <= 0 || c <= 0 || a + b <= c || a + c <= b || b + c <= a). El operador || significa 'o'."
  - "Con if / else if, el orden importa: solo llegas a la siguiente condición si la anterior fue falsa."
  - "Equilátero: a == b && b == c. Isósceles: a == b || b == c || a == c (ya sabes que no es equilátero)."
