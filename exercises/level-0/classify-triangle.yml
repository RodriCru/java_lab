referenceSolution: |
  public class Solution {

      public static String classify(int a, int b, int c) {
          if (a <= 0 || b <= 0 || c <= 0 || a + b <= c || a + c <= b || b + c <= a) {
              return "inválido";
          } else if (a == b && b == c) {
              return "equilátero";
          } else if (a == b || b == c || a == c) {
              return "isósceles";
          } else {
              return "escaleno";
          }
      }
  }
tests: |
  import org.junit.jupiter.api.DisplayName;
  import org.junit.jupiter.api.Test;

  import static org.junit.jupiter.api.Assertions.*;

  class SolutionTest {
      @Test
      @DisplayName("Tres lados iguales es equilátero")
      void caso1() {
          assertEquals("equilátero", Solution.classify(3, 3, 3));
      }

      @Test
      @DisplayName("Dos lados iguales es isósceles")
      void caso2() {
          assertEquals("isósceles", Solution.classify(5, 5, 8));
      }

      @Test
      @DisplayName("El par igual puede estar en cualquier posición")
      void caso3() {
          assertEquals("isósceles", Solution.classify(8, 5, 5));
          assertEquals("isósceles", Solution.classify(5, 8, 5));
      }

      @Test
      @DisplayName("Tres lados distintos es escaleno")
      void caso4() {
          assertEquals("escaleno", Solution.classify(3, 4, 5));
      }

      @Test
      @DisplayName("Si la suma de dos lados iguala al tercero es inválido")
      void caso5() {
          assertEquals("inválido", Solution.classify(1, 2, 3));
      }

      @Test
      @DisplayName("Si la suma de dos lados es menor que el tercero es inválido")
      void caso6() {
          assertEquals("inválido", Solution.classify(1, 2, 10));
          assertEquals("inválido", Solution.classify(10, 1, 2));
      }

      @Test
      @DisplayName("Un lado cero o negativo es inválido")
      void caso7() {
          assertEquals("inválido", Solution.classify(0, 4, 4));
          assertEquals("inválido", Solution.classify(-3, -3, -3));
      }

      @Test
      @DisplayName("Tres ceros es inválido, no equilátero")
      void caso8() {
          assertEquals("inválido", Solution.classify(0, 0, 0));
      }
  }
