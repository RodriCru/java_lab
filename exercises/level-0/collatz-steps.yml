slug: collatz-steps
level: 0
topic: loops
title: Pasos de Collatz
statement: |
  La conjetura de Collatz parte de un entero positivo n y repite: si n es par, n = n / 2; si es impar, n = 3 * n + 1; hasta llegar a 1. Escribe un método con un ciclo while que cuente cuántos pasos se necesitan para llegar a 1.

  Ejemplos:
  - collatzSteps(1) -> 0   (ya está en 1)
  - collatzSteps(2) -> 1   (2 -> 1)
  - collatzSteps(6) -> 8   (6, 3, 10, 5, 16, 8, 4, 2, 1)
  - collatzSteps(27) -> 111

  Si n es menor o igual a 0, devuelve 0.
methodSignature: public static int collatzSteps(int n)
className: Solution
estimatedMinutes: 10
difficulty: easy
hints:
- 'Un while se usa cuando no sabes de antemano cuántas vueltas dará el ciclo: aquí, while (n != 1).'
- Dentro del ciclo, decide con n % 2 == 0 si n es par (n = n / 2) o impar (n = 3 * n + 1), y suma 1 al contador de pasos.
- Antes del ciclo, devuelve 0 si n <= 0; sin ese control, un n no positivo nunca llegaría a 1 y el ciclo sería infinito.
