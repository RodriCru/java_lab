referenceSolution: |
  public class Solution {
      public static int collatzSteps(int n) {
          if (n <= 0) {
              return 0;
          }
          int pasos = 0;
          while (n != 1) {
              if (n % 2 == 0) {
                  n = n / 2;
              } else {
                  n = 3 * n + 1;
              }
              pasos++;
          }
          return pasos;
      }
  }
tests: |
  import org.junit.jupiter.api.DisplayName;
  import org.junit.jupiter.api.Test;

  import java.util.*;

  import static org.junit.jupiter.api.Assertions.*;

  class SolutionTest {

      @Test
      @DisplayName("El 1 ya está en el destino")
      void t66373() {
          assertEquals(0, Solution.collatzSteps(1));
      }

      @Test
      @DisplayName("El 2 necesita un paso")
      void t12912() {
          assertEquals(1, Solution.collatzSteps(2));
      }

      @Test
      @DisplayName("El 6 necesita 8 pasos")
      void t22618() {
          assertEquals(8, Solution.collatzSteps(6));
      }

      @Test
      @DisplayName("El 27 necesita 111 pasos")
      void t82939() {
          assertEquals(111, Solution.collatzSteps(27));
      }

      @Test
      @DisplayName("Las potencias de dos bajan en línea recta")
      void t98400() {
          assertEquals(10, Solution.collatzSteps(1024));
      }

      @Test
      @DisplayName("Cero y negativos devuelven 0")
      void t21065() {
          assertEquals(0, Solution.collatzSteps(0));
          assertEquals(0, Solution.collatzSteps(-7));
      }

      @Test
      @DisplayName("El 7 necesita 16 pasos")
      void t2791() {
          assertEquals(16, Solution.collatzSteps(7));
      }
  }
