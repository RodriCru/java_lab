title: toString, equals y hashCode de Person
statement: |
  Todas las clases heredan de Object los métodos toString, equals y hashCode, pero su versión por defecto compara referencias y muestra algo poco útil. En Solution existe la clase Person (nombre y edad) sin esos métodos.

  Completa Person sobrescribiendo (con @Override):
  - toString(): devuelve exactamente "Person{name='Ana', age=30}" (con el nombre y la edad del objeto).
  - equals(Object): dos personas son iguales si tienen el MISMO nombre y la MISMA edad. Con null o con un objeto de otra clase devuelve false.
  - hashCode(): debe ser coherente con equals (personas iguales, mismo hashCode).

  Además, countDistinct recibe una lista de personas y devuelve cuántas son distintas según equals (usa un HashSet, que depende de equals y hashCode). Si la lista es null o vacía, devuelve 0.

  Ejemplo:
  - countDistinct(List.of(new Person("Ana", 30), new Person("Ana", 30), new Person("Luis", 25))) -> 2
  - countDistinct(List.of(new Person("Ana", 30), new Person("Ana", 31))) -> 2
  - countDistinct(List.of()) -> 0
methodSignature: public static int countDistinct(List<Person> people)
