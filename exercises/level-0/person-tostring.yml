- Usa Objects.equals(a, b) para comparar nombres (puede ser null) y Objects.hash(name, age) para el hashCode; java.util.Objects está permitido.
- 'En equals: primero if (this == other) return true; luego if (!(other instanceof Person)) return false; después compara los campos.'
- 'Un HashSet usa hashCode para ubicar y equals para confirmar: si no los sobrescribes, dos Person iguales cuentan como distintos.'
