title: Enum de días de la semana
statement: |
  Un enum es un tipo con un conjunto fijo de valores, y puede tener campos, constructor y métodos. En Solution existe el enum Day con los siete días, de MONDAY a SUNDAY, en ese orden.

  Completa:
  - Cada día lleva su número (MONDAY=1, TUESDAY=2, ... SUNDAY=7) en un campo; getNumber() lo devuelve.
  - isWeekend(): true solo para SATURDAY y SUNDAY.
  - next(): devuelve el día siguiente; después de SUNDAY vuelve a MONDAY.

  Además, advance(day, n) devuelve el día que resulta de avanzar n días desde day (usa next()). Si n es 0 devuelve el mismo día. Si day es null devuelve null. n no será negativo.

  Ejemplo:
  - Entrada: day=MONDAY, n=1 -> Salida: TUESDAY
  - Entrada: day=SATURDAY, n=2 -> Salida: MONDAY
  - Entrada: day=WEDNESDAY, n=7 -> Salida: WEDNESDAY
methodSignature: public static Day advance(Day day, int n)
className: Solution
estimatedMinutes: 15
difficulty: easy
hints:
- 'Los valores de un enum con campos se declaran así: MONDAY(1), TUESDAY(2)... y el constructor (privado) recibe ese número.'
- values() devuelve un arreglo con todos los días en orden; ordinal() es la posición (0 para MONDAY). Usa values()[(ordinal() + 1) % 7] para dar la vuelta.
- advance es un bucle de n repeticiones que va haciendo day = day.next().
