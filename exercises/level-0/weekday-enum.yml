referenceSolution: |
  public class Solution {

      public enum Day {
          MONDAY(1), TUESDAY(2), WEDNESDAY(3), THURSDAY(4), FRIDAY(5), SATURDAY(6), SUNDAY(7);

          private final int number;

          Day(int number) {
              this.number = number;
          }

          public int getNumber() {
              return number;
          }

          public boolean isWeekend() {
              return this == SATURDAY || this == SUNDAY;
          }

          public Day next() {
              return values()[(ordinal() + 1) % values().length];
          }
      }

      public static Day advance(Day day, int n) {
          if (day == null) {
              return null;
          }
          Day current = day;
          for (int i = 0; i < n; i++) {
              current = current.next();
          }
          return current;
      }
  }
tests: |
  import org.junit.jupiter.api.DisplayName;
  import org.junit.jupiter.api.Test;
  import java.util.*;

  import static org.junit.jupiter.api.Assertions.*;

  class SolutionTest {

      @Test
      @DisplayName("Cada día tiene su número de 1 a 7")
      void numeros() {
          assertEquals(1, Solution.Day.MONDAY.getNumber());
          assertEquals(4, Solution.Day.THURSDAY.getNumber());
          assertEquals(7, Solution.Day.SUNDAY.getNumber());
      }

      @Test
      @DisplayName("Sábado y domingo son fin de semana")
      void finDeSemana() {
          assertTrue(Solution.Day.SATURDAY.isWeekend());
          assertTrue(Solution.Day.SUNDAY.isWeekend());
      }

      @Test
      @DisplayName("Los días entre semana no son fin de semana")
      void entreSemana() {
          assertFalse(Solution.Day.MONDAY.isWeekend());
          assertFalse(Solution.Day.WEDNESDAY.isWeekend());
          assertFalse(Solution.Day.FRIDAY.isWeekend());
      }

      @Test
      @DisplayName("next devuelve el día siguiente")
      void siguiente() {
          assertEquals(Solution.Day.TUESDAY, Solution.Day.MONDAY.next());
          assertEquals(Solution.Day.SATURDAY, Solution.Day.FRIDAY.next());
      }

      @Test
      @DisplayName("Después de domingo viene lunes")
      void vueltaCompleta() {
          assertEquals(Solution.Day.MONDAY, Solution.Day.SUNDAY.next());
      }

      @Test
      @DisplayName("advance avanza n días")
      void avanzar() {
          assertEquals(Solution.Day.TUESDAY, Solution.advance(Solution.Day.MONDAY, 1));
          assertEquals(Solution.Day.MONDAY, Solution.advance(Solution.Day.SATURDAY, 2));
      }

      @Test
      @DisplayName("advance con 0 devuelve el mismo día y con 7 da la vuelta completa")
      void casosBorde() {
          assertEquals(Solution.Day.THURSDAY, Solution.advance(Solution.Day.THURSDAY, 0));
          assertEquals(Solution.Day.WEDNESDAY, Solution.advance(Solution.Day.WEDNESDAY, 7));
          assertEquals(Solution.Day.FRIDAY, Solution.advance(Solution.Day.FRIDAY, 14));
      }

      @Test
      @DisplayName("advance con day null devuelve null")
      void diaNull() {
          assertNull(Solution.advance(null, 3));
      }
  }
