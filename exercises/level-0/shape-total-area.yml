title: Área total de figuras
statement: |
  Polimorfismo con interfaces: Solution define la interfaz Shape con el método area() y tres figuras: Circle, Rectangle y Triangle. Cada una calcula su área de forma distinta.

  Completa:
  - Circle(radius): area() = Math.PI * radius * radius.
  - Rectangle(width, height): area() = width * height.
  - Triangle(base, height): area() = base * height / 2.
  - totalArea recibe una lista de figuras y devuelve la suma de sus áreas, sin preguntar de qué tipo es cada una.

  Si la lista es null o está vacía, devuelve 0.0.

  Ejemplo:
  - totalArea(List.of(new Rectangle(2, 3), new Triangle(4, 5))) -> 16.0   (6.0 + 10.0)
  - totalArea(List.of(new Circle(1))) -> 3.141592653589793
  - totalArea(List.of()) -> 0.0
methodSignature: public static double totalArea(List<Shape> shapes)
className: Solution
estimatedMinutes: 15
difficulty: easy
hints:
- Una interfaz define QUÉ hace una figura (area()) y cada clase decide CÓMO; las clases la implementan con implements.
- 'Cuidado con la división del triángulo: usa 2.0 o trabaja con doubles para no truncar.'
- En totalArea recorre la lista con un for-each y acumula shape.area(); no necesitas instanceof.
