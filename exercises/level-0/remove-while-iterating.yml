referenceSolution: |
  import java.util.*;

  public class Solution {

      public static int removeNegatives(List<Integer> numbers) {
          if (numbers == null) {
              return 0;
          }
          int removed = 0;
          Iterator<Integer> it = numbers.iterator();
          while (it.hasNext()) {
              if (it.next() < 0) {
                  it.remove();
                  removed++;
              }
          }
          return removed;
      }
  }
tests: |
  import org.junit.jupiter.api.DisplayName;
  import org.junit.jupiter.api.Test;

  import java.util.*;

  import static org.junit.jupiter.api.Assertions.*;

  class SolutionTest {

      @Test
      @DisplayName("Elimina los negativos y devuelve cuántos eliminó")
      void mezcla() {
          List<Integer> list = new ArrayList<>(List.of(1, -2, 3, -4));
          assertEquals(2, Solution.removeNegatives(list));
          assertEquals(List.of(1, 3), list);
      }

      @Test
      @DisplayName("Negativos consecutivos no se saltan")
      void consecutivos() {
          List<Integer> list = new ArrayList<>(List.of(-1, -2, -3, 4, -5, -6));
          assertEquals(5, Solution.removeNegatives(list));
          assertEquals(List.of(4), list);
      }

      @Test
      @DisplayName("Si todos son negativos la lista queda vacía")
      void todosNegativos() {
          List<Integer> list = new ArrayList<>(List.of(-1, -2, -3));
          assertEquals(3, Solution.removeNegatives(list));
          assertTrue(list.isEmpty());
      }

      @Test
      @DisplayName("El cero se conserva")
      void ceroSeConserva() {
          List<Integer> list = new ArrayList<>(List.of(0, 5));
          assertEquals(0, Solution.removeNegatives(list));
          assertEquals(List.of(0, 5), list);
      }

      @Test
      @DisplayName("Una lista vacía devuelve 0")
      void listaVacia() {
          List<Integer> list = new ArrayList<>();
          assertEquals(0, Solution.removeNegatives(list));
          assertTrue(list.isEmpty());
      }

      @Test
      @DisplayName("Una lista null devuelve 0")
      void listaNula() {
          assertEquals(0, Solution.removeNegatives(null));
      }

      @Test
      @DisplayName("Se conserva el orden de los elementos restantes y los repetidos")
      void conservaOrden() {
          List<Integer> list = new ArrayList<>(List.of(5, -1, 3, 3, -7, 1));
          assertEquals(2, Solution.removeNegatives(list));
          assertEquals(List.of(5, 3, 3, 1), list);
      }
  }
