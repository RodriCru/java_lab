slug: remove-while-iterating
level: 0
topic: collections
title: Eliminar mientras se recorre
statement: |
  Si eliminas elementos de una lista dentro de un for-each, Java lanza ConcurrentModificationException. Y si lo haces con un for de índices sin cuidado, te saltas elementos. La forma segura es usar un Iterator (su método remove) o el método removeIf.

  Escribe un método que elimine, DENTRO de la propia lista recibida, todos los números negativos (menores que 0) y devuelva cuántos eliminó. El cero NO es negativo y se conserva. El orden de los elementos restantes no cambia. Si la lista es null, devuelve 0.

  Ejemplos:
  - [1, -2, 3, -4] -> devuelve 2 y la lista queda [1, 3]
  - [-1, -2, -3] -> devuelve 3 y la lista queda []
  - [0, 5] -> devuelve 0 y la lista queda [0, 5]

  La lista recibida es modificable (por ejemplo un ArrayList).
methodSignature: "public static int removeNegatives(List<Integer> numbers)"
className: Solution
estimatedMinutes: 12
difficulty: easy
hints:
  - "No uses remove dentro de un for-each sobre la misma lista: lanza ConcurrentModificationException."
  - "Con Iterator<Integer> it = numbers.iterator(); while (it.hasNext()) { if (it.next() < 0) it.remove(); } eliminas de forma segura."
  - "Para contar, incrementa un contador en cada it.remove(), o compara numbers.size() antes y después de numbers.removeIf(n -> n < 0)."
