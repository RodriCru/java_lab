slug: multi-interface-robot
level: 0
topic: abstraction
title: Un robot, dos interfaces
statement: |
  Una clase puede implementar VARIAS interfaces (a diferencia de la herencia, que es de una sola clase). Dentro de Solution existen:

    interface Walker { String walk(); }
    interface Talker { String talk(); }

  Completa la clase Robot, que implementa ambas y guarda su nombre:
  - walk() devuelve nombre + " camina"
  - talk() devuelve nombre + " dice: beep"

  Y el método demo(name): crea un Robot con ese nombre, y lo usa una vez como Walker y otra como Talker, devolviendo walk() + " y " + talk().

  Ejemplos:
  - demo("R2") -> "R2 camina y R2 dice: beep"
  - demo("") -> " camina y  dice: beep"
methodSignature: public static String demo(String name)
className: Solution
estimatedMinutes: 15
difficulty: easy
hints:
- 'Se declara así: class Robot implements Walker, Talker, separando las interfaces con coma.'
- Robot debe sobrescribir los dos métodos (walk y talk) con @Override y usar el campo name.
- 'En demo: Walker w = new Robot(name); Talker t = new Robot(name); y concatena w.walk() + '' y '' + t.talk().'
