slug: bounded-counter
level: 0
topic: oop-basics
title: Contador acotado (encapsulamiento)
statement: |
  Encapsulamiento: el estado de un objeto se oculta (campos private) y solo se modifica con métodos que protegen las reglas. En Solution existe la clase Counter, un contador con límites mínimo y máximo.

  Completa Counter:
  - El constructor Counter(min, max) deja el valor inicial en min. Si min > max lanza IllegalArgumentException.
  - getValue() devuelve el valor actual.
  - increment(): si el valor es menor que max lo aumenta en 1 y devuelve true; si ya está en max no cambia nada y devuelve false.
  - decrement(): si el valor es mayor que min lo disminuye en 1 y devuelve true; si ya está en min no cambia nada y devuelve false.

  Además, completa applyOperations: crea un Counter(min, max), recorre el texto ops y, por cada carácter '+' llama a increment() y por cada '-' llama a decrement() (cualquier otro carácter se ignora). Devuelve el valor final. Si ops es null, devuelve el valor inicial.

  Ejemplo:
  - Entrada: min=0, max=3, ops="++-" -> Salida: 1
  - Entrada: min=0, max=2, ops="+++++" -> Salida: 2 (no pasa del máximo)
  - Entrada: min=0, max=2, ops="---" -> Salida: 0 (no baja del mínimo)
methodSignature: public static int applyOperations(int min, int max, String ops)
className: Solution
estimatedMinutes: 15
difficulty: easy
hints:
- Los campos private solo se tocan desde dentro de la clase; por eso el valor no puede salirse de los límites desde fuera.
- Guarda min, max y value en campos; en el constructor valida min > max antes de asignar y lanza new IllegalArgumentException(...).
- increment() y decrement() deben comprobar el límite ANTES de modificar el valor y devolver si el cambio ocurrió.
