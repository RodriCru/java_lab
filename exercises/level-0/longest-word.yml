referenceSolution: |
  import java.util.List;

  public class Solution {
      public static String longestWord(List<String> words) {
          if (words == null) {
              return "";
          }
          String mejor = "";
          for (String palabra : words) {
              if (palabra.length() > mejor.length()) {
                  mejor = palabra;
              }
          }
          return mejor;
      }
  }
tests: |
  import org.junit.jupiter.api.DisplayName;
  import org.junit.jupiter.api.Test;

  import java.util.*;

  import static org.junit.jupiter.api.Assertions.*;

  class SolutionTest {

      @Test
      @DisplayName("Devuelve la palabra más larga")
      void t95833() {
          assertEquals("montaña", Solution.longestWord(Arrays.asList("sol", "montaña", "mar")));
      }

      @Test
      @DisplayName("La más larga puede ir al final")
      void t59732() {
          assertEquals("siete", Solution.longestWord(Arrays.asList("uno", "dos", "tres", "siete")));
      }

      @Test
      @DisplayName("En un empate gana la primera")
      void t93308() {
          assertEquals("ab", Solution.longestWord(Arrays.asList("ab", "cd")));
          assertEquals("hola", Solution.longestWord(Arrays.asList("hi", "hola", "adió", "yo")));
      }

      @Test
      @DisplayName("Una lista vacía devuelve cadena vacía")
      void t59670() {
          assertEquals("", Solution.longestWord(new ArrayList<>()));
      }

      @Test
      @DisplayName("Una lista null devuelve cadena vacía")
      void t13209() {
          assertEquals("", Solution.longestWord(null));
      }

      @Test
      @DisplayName("Una lista de un solo elemento")
      void t59276() {
          assertEquals("único", Solution.longestWord(List.of("único")));
      }

      @Test
      @DisplayName("Palabras de longitud cero no ganan")
      void t78598() {
          assertEquals("a", Solution.longestWord(Arrays.asList("", "a", "")));
      }
  }
