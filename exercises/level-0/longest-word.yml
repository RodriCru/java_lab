title: La palabra más larga
statement: |
  Escribe un método que reciba una lista de palabras y devuelva la más larga, usando un ciclo for-each. Si hay empate en longitud, devuelve la primera que aparece en la lista.

  Ejemplos:
  - ["sol", "montaña", "mar"] -> "montaña"
  - ["uno", "dos", "tres", "siete"] -> "siete"
  - ["ab", "cd"] -> "ab" (empate: gana la primera)

  Si la lista es null o está vacía, devuelve "" (cadena vacía).
methodSignature: public static String longestWord(List<String> words)
className: Solution
estimatedMinutes: 10
difficulty: easy
hints:
- 'Mantén una variable String mejor = "" y actualízala mientras recorres la lista con for (String w : words).'
- 'Cambia la mejor palabra solo si w.length() > mejor.length(): con ''>'' estricto, en un empate se queda la primera.'
- Al principio, devuelve "" si la lista es null; si está vacía, el ciclo no se ejecuta y mejor ya vale "".
