referenceSolution: |
  import java.util.*;

  public class Solution {

      public static class Ticket {
          private static int count = 0;
          private final int id;

          public Ticket() {
              count++;
              this.id = count;
          }

          public int getId() {
              return id;
          }

          public static int getCount() {
              return count;
          }

          public static void reset() {
              count = 0;
          }
      }

      public static List<Integer> createTickets(int n) {
          Ticket.reset();
          List<Integer> ids = new ArrayList<>();
          for (int i = 0; i < n; i++) {
              ids.add(new Ticket().getId());
          }
          return ids;
      }
  }
tests: |
  import org.junit.jupiter.api.DisplayName;
  import org.junit.jupiter.api.Test;
  import java.util.*;

  import org.junit.jupiter.api.BeforeEach;
  import static org.junit.jupiter.api.Assertions.*;

  class SolutionTest {

      @BeforeEach
      void reiniciar() {
          Solution.Ticket.reset();
      }

      @Test
      @DisplayName("El primer ticket tiene id 1")
      void primerId() {
          assertEquals(1, new Solution.Ticket().getId());
      }

      @Test
      @DisplayName("Los ids son consecutivos y cada objeto conserva el suyo")
      void idsConsecutivos() {
          Solution.Ticket a = new Solution.Ticket();
          Solution.Ticket b = new Solution.Ticket();
          Solution.Ticket c = new Solution.Ticket();
          assertEquals(1, a.getId());
          assertEquals(2, b.getId());
          assertEquals(3, c.getId());
      }

      @Test
      @DisplayName("getCount cuenta los tickets creados")
      void contador() {
          assertEquals(0, Solution.Ticket.getCount());
          new Solution.Ticket();
          new Solution.Ticket();
          assertEquals(2, Solution.Ticket.getCount());
      }

      @Test
      @DisplayName("reset reinicia el contador y los ids vuelven a empezar en 1")
      void reinicio() {
          new Solution.Ticket();
          new Solution.Ticket();
          Solution.Ticket.reset();
          assertEquals(0, Solution.Ticket.getCount());
          assertEquals(1, new Solution.Ticket().getId());
      }

      @Test
      @DisplayName("createTickets devuelve los ids en orden")
      void crearTickets() {
          assertEquals(List.of(1, 2, 3), Solution.createTickets(3));
      }

      @Test
      @DisplayName("createTickets reinicia el contador antes de crear")
      void crearReinicia() {
          new Solution.Ticket();
          new Solution.Ticket();
          assertEquals(List.of(1), Solution.createTickets(1));
          assertEquals(1, Solution.Ticket.getCount());
      }

      @Test
      @DisplayName("createTickets con n cero o negativo devuelve lista vacía")
      void sinTickets() {
          assertTrue(Solution.createTickets(0).isEmpty());
          assertTrue(Solution.createTickets(-4).isEmpty());
      }
  }
