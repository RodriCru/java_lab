slug: static-id-generator
level: 0
topic: oop-basics
title: Generador de ids con static
statement: |
  Un campo static pertenece a la CLASE (se comparte entre todos los objetos); un campo normal pertenece a cada INSTANCIA. En Solution existe la clase Ticket, que debe asignar ids autoincrementales.

  Completa Ticket:
  - Un contador static privado (count) que cuenta cuántos tickets se han creado.
  - Cada ticket tiene su propio id (campo de instancia, final). Al crearlo, el contador sube en 1 y el id es el nuevo valor: el primer ticket tiene id 1, el segundo id 2, etc.
  - getId() devuelve el id del ticket.
  - static getCount() devuelve cuántos tickets se han creado desde el último reset.
  - static reset() deja el contador en 0.

  Además, createTickets(n): llama primero a Ticket.reset(), crea n tickets y devuelve la lista de sus ids en orden de creación. Si n <= 0 devuelve una lista vacía.

  Ejemplo:
  - createTickets(3) -> [1, 2, 3]
  - createTickets(1) -> [1]   (porque createTickets reinicia el contador)
  - createTickets(0) -> []
methodSignature: public static List<Integer> createTickets(int n)
className: Solution
estimatedMinutes: 15
difficulty: easy
hints:
- 'static significa ''de la clase'': existe una sola copia del campo, aunque crees mil objetos.'
- En el constructor haz count++ (o ++count) y asigna this.id = count; así cada objeto guarda su propio id mientras count sigue compartido.
- getCount() y reset() son métodos static porque trabajan con el campo static; se llaman como Ticket.getCount().
