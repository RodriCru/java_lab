          // Tu código aquí
      }
  }
referenceSolution: |
  public class Solution {

      public static void swap(int[] arr, int i, int j) {
          if (arr == null || i < 0 || j < 0 || i >= arr.length || j >= arr.length) {
              return;
          }
          int tmp = arr[i];
          arr[i] = arr[j];
          arr[j] = tmp;
      }
  }
tests: |
  import org.junit.jupiter.api.DisplayName;
  import org.junit.jupiter.api.Test;

  import static org.junit.jupiter.api.Assertions.*;

  class SolutionTest {
      @Test
      @DisplayName("Intercambia el primero y el último")
      void caso1() {
          int[] arr = {1, 2, 3, 4};
          Solution.swap(arr, 0, 3);
          assertArrayEquals(new int[] {4, 2, 3, 1}, arr);
      }

      @Test
      @DisplayName("Intercambia dos posiciones intermedias")
      void caso2() {
          int[] arr = {1, 2, 3, 4, 5};
          Solution.swap(arr, 1, 3);
          assertArrayEquals(new int[] {1, 4, 3, 2, 5}, arr);
      }

      @Test
      @DisplayName("Es simétrico: el orden de i y j no importa")
      void caso3() {
          int[] arr = {1, 2, 3};
          Solution.swap(arr, 2, 0);
          assertArrayEquals(new int[] {3, 2, 1}, arr);
      }

      @Test
      @DisplayName("Con i igual a j no cambia nada")
      void caso4() {
          int[] arr = {5, 6};
          Solution.swap(arr, 1, 1);
          assertArrayEquals(new int[] {5, 6}, arr);
      }

      @Test
      @DisplayName("Índice fuera de rango no modifica el arreglo")
      void caso5() {
          int[] arr = {1, 2, 3};
          Solution.swap(arr, 0, 9);
          Solution.swap(arr, -1, 1);
          Solution.swap(arr, 3, 0);
          assertArrayEquals(new int[] {1, 2, 3}, arr);
      }

      @Test
      @DisplayName("Arreglo null no lanza excepción")
      void caso6() {
          assertDoesNotThrow(() -> Solution.swap(null, 0, 1));
      }

      @Test
      @DisplayName("Arreglo de un solo elemento")
      void caso7() {
          int[] arr = {7};
          Solution.swap(arr, 0, 0);
          assertArrayEquals(new int[] {7}, arr);
      }

      @Test
      @DisplayName("Intercambiar dos veces restaura el original")
      void caso8() {
          int[] arr = {9, 8, 7, 6};
          Solution.swap(arr, 0, 2);
          Solution.swap(arr, 0, 2);
          assertArrayEquals(new int[] {9, 8, 7, 6}, arr);
      }
  }
