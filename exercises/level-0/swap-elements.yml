slug: swap-elements
level: 0
topic: functions
title: "Intercambiar elementos de un arreglo"
statement: |
  Escribe un método que intercambie los elementos de las posiciones i y j de un arreglo. El método es void: no devuelve nada, MODIFICA el arreglo original. Esto funciona porque en Java los arreglos (y todos los objetos) se pasan por referencia: el método recibe la referencia al mismo arreglo que tiene quien lo llama. (Intercambiar dos int sueltos, en cambio, no afectaría al que llama, porque los tipos primitivos se pasan por valor.)

  Reglas:
  - Si i == j, el arreglo no cambia.
  - Si arr es null, o i o j están fuera del rango [0, arr.length - 1], no hagas nada (sin lanzar excepción).

  Ejemplos:
  - swapElements(new int[]{1, 2, 3, 4}, 0, 3) -> el arreglo queda [4, 2, 3, 1]
  - swapElements(new int[]{5, 6}, 1, 1) -> el arreglo queda [5, 6]
  - swapElements(new int[]{1, 2, 3}, 0, 9) -> el arreglo queda [1, 2, 3]
methodSignature: "public static void swap(int[] arr, int i, int j)"
className: Solution
estimatedMinutes: 10
difficulty: easy
hints:
  - "Como arr es una referencia, cualquier cambio dentro del método se ve fuera. Por eso no hace falta devolver nada."
  - "Para intercambiar necesitas una variable temporal: int tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp; Sin ella perderías uno de los valores."
  - "Antes de tocar el arreglo valida: arr != null, 0 <= i < arr.length y 0 <= j < arr.length. Si algo falla, return;"
starterCode: |
