referenceSolution: |
  public class Solution {

      public static int sumOneToN(int n) {
          int suma = 0;
          for (int i = 1; i <= n; i++) {
              suma += i;
          }
          return suma;
      }
  }
tests: |
  import org.junit.jupiter.api.DisplayName;
  import org.junit.jupiter.api.Test;

  import static org.junit.jupiter.api.Assertions.*;

  import java.io.ByteArrayOutputStream;
  import java.io.PrintStream;

  class SolutionTest {

      @Test
      @DisplayName("Hasta 4")
      void t1() {
          assertEquals(10, Solution.sumOneToN(4));
      }

      @Test
      @DisplayName("Hasta 1")
      void t2() {
          assertEquals(1, Solution.sumOneToN(1));
      }

      @Test
      @DisplayName("Cero")
      void t3() {
          assertEquals(0, Solution.sumOneToN(0));
      }

      @Test
      @DisplayName("Negativo")
      void t4() {
          assertEquals(0, Solution.sumOneToN(-5));
      }

      @Test
      @DisplayName("Hasta 100")
      void t5() {
          assertEquals(5050, Solution.sumOneToN(100));
      }
  }
