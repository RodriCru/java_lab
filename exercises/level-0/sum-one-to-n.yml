title: Sumar del 1 al n
statement: |
  Un ciclo que acumula un resultado. Escribe un método que devuelva la suma de los enteros del 1 al n. Si n es menor que 1 devuelve 0.

  Ejemplos:
  - sumOneToN(4) -> 10 (1+2+3+4)
  - sumOneToN(1) -> 1
  - sumOneToN(0) -> 0
methodSignature: public static int sumOneToN(int n)
className: Solution
estimatedMinutes: 8
difficulty: easy
hints:
- Crea una variable suma = 0 antes del ciclo.
- En cada vuelta del for suma += i.
- Si n < 1 el ciclo no se ejecuta y devuelves 0 sin caso especial.
