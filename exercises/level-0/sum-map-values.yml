title: Sumar los valores de un mapa
statement: |
  Escribe un método que sume todos los valores de un Map<String, Integer> usando un ciclo for-each (sobre map.values() o sobre map.entrySet()).

  Ejemplos:
  - {a=1, b=2, c=3} -> 6
  - {x=-5, y=5} -> 0
  - {} -> 0

  Si el mapa es null o está vacío, devuelve 0.
