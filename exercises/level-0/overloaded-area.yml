slug: overloaded-area
level: 0
topic: functions
title: "Sobrecarga de métodos: áreas"
statement: |
  La sobrecarga (overloading) permite tener varios métodos con el MISMO nombre pero distintos parámetros; Java elige cuál ejecutar según los argumentos de la llamada. Implementa tres versiones de area en la clase Solution:

  1. area(double width, double height): área de un RECTÁNGULO = width * height. (Es la firma principal.)
  2. area(double radius): área de un CÍRCULO = Math.PI * radius * radius.
  3. area(double base, double height, boolean triangle): si triangle es true, área de un TRIÁNGULO = base * height / 2; si es false, área de un rectángulo = base * height.

  Ejemplos:
  - area(3.0, 4.0) -> 12.0
  - area(1.0) -> 3.14159... (Math.PI)
  - area(2.0) -> 12.566... (4 * Math.PI)
  - area(6.0, 5.0, true) -> 15.0
  - area(6.0, 5.0, false) -> 30.0

  Se garantiza que los valores recibidos son mayores o iguales que 0.
methodSignature: "public static double area(double width, double height)"
className: Solution
estimatedMinutes: 12
difficulty: easy
hints:
  - "Los tres métodos se llaman area; el compilador los distingue por el número y tipo de parámetros, no por el nombre ni por el tipo de retorno."
  - "Círculo: Math.PI * radius * radius. Rectángulo: width * height."
  - "En la tercera versión usa el booleano: if (triangle) { return base * height / 2; } return base * height; (o un ternario)."
