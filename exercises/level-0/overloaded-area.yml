referenceSolution: |
  public class Solution {

      public static double area(double width, double height) {
          return width * height;
      }

      public static double area(double radius) {
          return Math.PI * radius * radius;
      }

      public static double area(double base, double height, boolean triangle) {
          return triangle ? base * height / 2 : base * height;
      }
  }
tests: |
  import org.junit.jupiter.api.DisplayName;
  import org.junit.jupiter.api.Test;

  import static org.junit.jupiter.api.Assertions.*;

  class SolutionTest {
      @Test
      @DisplayName("Área de un rectángulo")
      void caso1() {
          assertEquals(12.0, Solution.area(3.0, 4.0), 1e-9);
      }

      @Test
      @DisplayName("Rectángulo con un lado cero")
      void caso2() {
          assertEquals(0.0, Solution.area(0.0, 5.0), 1e-9);
      }

      @Test
      @DisplayName("Área de un círculo de radio 1")
      void caso3() {
          assertEquals(Math.PI, Solution.area(1.0), 1e-9);
      }

      @Test
      @DisplayName("Área de un círculo de radio 2")
      void caso4() {
          assertEquals(4 * Math.PI, Solution.area(2.0), 1e-9);
      }

      @Test
      @DisplayName("Círculo de radio cero")
      void caso5() {
          assertEquals(0.0, Solution.area(0.0), 1e-9);
      }

      @Test
      @DisplayName("Área de un triángulo")
      void caso6() {
          assertEquals(15.0, Solution.area(6.0, 5.0, true), 1e-9);
      }

      @Test
      @DisplayName("Con triangle en false calcula un rectángulo")
      void caso7() {
          assertEquals(30.0, Solution.area(6.0, 5.0, false), 1e-9);
      }

      @Test
      @DisplayName("Cada sobrecarga se elige según los argumentos")
      void caso8() {
          assertEquals(10.0, Solution.area(2.0, 5.0), 1e-9);
          assertEquals(5.0, Solution.area(2.0, 5.0, true), 1e-9);
          assertEquals(Math.PI * 25, Solution.area(5.0), 1e-9);
      }
  }
