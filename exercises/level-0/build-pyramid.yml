slug: build-pyramid
level: 0
topic: loops
title: Construir una pirámide
statement: |
  Escribe un método que construya una pirámide de asteriscos de n filas usando ciclos anidados. La fila i (empezando en 1) tiene n - i espacios a la izquierda y 2*i - 1 asteriscos; no lleva espacios a la derecha. Las filas se unen con '\n' y NO hay salto de línea al final.

  Ejemplo con n = 3 (los puntos aquí solo representan espacios):
  ```
  ..*
  .***
  *****
  ```
  Es decir: "  *\n ***\n*****"

  Otros ejemplos:
  - n = 1 -> "*"
  - n = 2 -> " *\n***"

  Si n es menor o igual a 0, devuelve "" (cadena vacía).
methodSignature: public static String buildPyramid(int n)
className: Solution
estimatedMinutes: 20
difficulty: medium
hints:
- Usa un ciclo externo for (int i = 1; i <= n; i++) para las filas y construye cada fila con un StringBuilder.
- Dentro, un primer ciclo interno agrega n - i espacios y un segundo agrega 2 * i - 1 asteriscos.
- 'Agrega ''\n'' entre filas, pero no después de la última: pon el salto solo cuando i < n (o al inicio de cada fila excepto la primera).'
