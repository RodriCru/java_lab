referenceSolution: |
  public class Solution {
      public static String buildPyramid(int n) {
          StringBuilder sb = new StringBuilder();
          for (int i = 1; i <= n; i++) {
              for (int e = 0; e < n - i; e++) {
                  sb.append(' ');
              }
              for (int a = 0; a < 2 * i - 1; a++) {
                  sb.append('*');
              }
              if (i < n) {
                  sb.append('\n');
              }
          }
          return sb.toString();
      }
  }
tests: |
  import org.junit.jupiter.api.DisplayName;
  import org.junit.jupiter.api.Test;

  import java.util.*;

  import static org.junit.jupiter.api.Assertions.*;

  class SolutionTest {

      @Test
      @DisplayName("Una pirámide de una fila")
      void t45083() {
          assertEquals("*", Solution.buildPyramid(1));
      }

      @Test
      @DisplayName("Una pirámide de dos filas")
      void t86050() {
          assertEquals(" *\n***", Solution.buildPyramid(2));
      }

      @Test
      @DisplayName("Una pirámide de tres filas")
      void t52736() {
          assertEquals("  *\n ***\n*****", Solution.buildPyramid(3));
      }

      @Test
      @DisplayName("No termina con salto de línea")
      void t99711() {
          assertFalse(Solution.buildPyramid(4).endsWith("\n"));
      }

      @Test
      @DisplayName("n cero o negativo devuelve cadena vacía")
      void t23185() {
          assertEquals("", Solution.buildPyramid(0));
          assertEquals("", Solution.buildPyramid(-3));
      }

      @Test
      @DisplayName("Una pirámide de cinco filas")
      void t54086() {
          assertEquals("    *\n   ***\n  *****\n *******\n*********", Solution.buildPyramid(5));
      }

      @Test
      @DisplayName("La última fila tiene 2n-1 asteriscos sin espacios")
      void t73519() {
          String[] filas = Solution.buildPyramid(10).split("\n");
          assertEquals(10, filas.length);
          assertEquals("*".repeat(19), filas[9]);
      }
  }
