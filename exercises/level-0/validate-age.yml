referenceSolution: |
  public class Solution {

      public static class InvalidAgeException extends Exception {
          public InvalidAgeException(String message) {
              super(message);
          }
      }

      public static int validateAge(int age) throws InvalidAgeException {
          if (age < 0 || age > 150) {
              throw new InvalidAgeException("Edad inválida: " + age);
          }
          return age;
      }
  }
tests: |
  import org.junit.jupiter.api.DisplayName;
  import org.junit.jupiter.api.Test;

  import static org.junit.jupiter.api.Assertions.*;

  import java.util.*;

  class SolutionTest {

      @Test
      @DisplayName("Edad válida")
      void t1() throws Exception {
          assertEquals(30, Solution.validateAge(30));
      }

      @Test
      @DisplayName("El límite inferior 0 es válido")
      void t2() throws Exception {
          assertEquals(0, Solution.validateAge(0));
      }

      @Test
      @DisplayName("El límite superior 150 es válido")
      void t3() throws Exception {
          assertEquals(150, Solution.validateAge(150));
      }

      @Test
      @DisplayName("Edad negativa lanza la excepción con su mensaje")
      void t4() throws Exception {
          Solution.InvalidAgeException e = assertThrows(Solution.InvalidAgeException.class, () -> Solution.validateAge(-1));
          assertEquals("Edad inválida: -1", e.getMessage());
      }

      @Test
      @DisplayName("Edad mayor a 150 lanza la excepción con su mensaje")
      void t5() throws Exception {
          Solution.InvalidAgeException e = assertThrows(Solution.InvalidAgeException.class, () -> Solution.validateAge(151));
          assertEquals("Edad inválida: 151", e.getMessage());
      }

      @Test
      @DisplayName("El mensaje incluye el número recibido")
      void t6() throws Exception {
          Solution.InvalidAgeException e = assertThrows(Solution.InvalidAgeException.class, () -> Solution.validateAge(-200));
          assertEquals("Edad inválida: -200", e.getMessage());
      }

      @Test
      @DisplayName("InvalidAgeException es checked (hereda de Exception, no de RuntimeException)")
      void t7() throws Exception {
          assertTrue(Exception.class.isAssignableFrom(Solution.InvalidAgeException.class));
          assertFalse(RuntimeException.class.isAssignableFrom(Solution.InvalidAgeException.class));
      }
  }
