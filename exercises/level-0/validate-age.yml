slug: validate-age
level: 0
topic: exceptions
title: Validar edad con excepción propia
statement: |
  Las excepciones propias hacen el código más expresivo. Dentro de Solution debes completar la clase InvalidAgeException, que es una excepción CHECKED (hereda de Exception, no de RuntimeException) y tiene un constructor que recibe el mensaje y lo pasa a super.

  Escribe validateAge(age), que devuelve la edad si es válida y, si no, lanza InvalidAgeException. Una edad es válida si está entre 0 y 150, ambos incluidos. El mensaje debe ser exactamente "Edad inválida: " seguido del número.

  Ejemplos:
  - validateAge(30) -> 30
  - validateAge(0) -> 0
  - validateAge(150) -> 150
  - validateAge(-1) -> lanza InvalidAgeException("Edad inválida: -1")
  - validateAge(151) -> lanza InvalidAgeException("Edad inválida: 151")

  Como la excepción es checked, el método debe declararla con throws InvalidAgeException (ya está en la firma).
methodSignature: public static int validateAge(int age) throws InvalidAgeException
className: Solution
estimatedMinutes: 15
