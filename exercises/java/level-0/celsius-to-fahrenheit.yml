title: De Celsius a Fahrenheit
statement: |
  Variables numéricas y una fórmula. Escribe un método que convierta grados Celsius a Fahrenheit con la fórmula F = C * 9 / 5 + 32 y devuelva un double.

  Cuidado: 9 / 5 con enteros da 1, no 1.8. Usa 9.0 / 5 (o multiplica primero) para no perder decimales.

  Ejemplos:
  - celsiusToFahrenheit(0) -> 32.0
  - celsiusToFahrenheit(100) -> 212.0
  - celsiusToFahrenheit(37) -> 98.6
methodSignature: public static double celsiusToFahrenheit(double celsius)
className: Solution
estimatedMinutes: 6
difficulty: easy
hints:
- El parámetro ya es double, así que celsius * 9 / 5 no pierde decimales.
- Suma 32 al final.
