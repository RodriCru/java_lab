referenceSolution: |
  public class Solution {

      public static double celsiusToFahrenheit(double celsius) {
          return celsius * 9 / 5 + 32;
      }
  }
tests: |
  import org.junit.jupiter.api.DisplayName;
  import org.junit.jupiter.api.Test;

  import static org.junit.jupiter.api.Assertions.*;

  import java.io.ByteArrayOutputStream;
  import java.io.PrintStream;

  class SolutionTest {

      @Test
      @DisplayName("Punto de congelación")
      void t1() {
          assertEquals(32.0, Solution.celsiusToFahrenheit(0), 0.0001);
      }

      @Test
      @DisplayName("Punto de ebullición")
      void t2() {
          assertEquals(212.0, Solution.celsiusToFahrenheit(100), 0.0001);
      }

      @Test
      @DisplayName("Temperatura corporal")
      void t3() {
          assertEquals(98.6, Solution.celsiusToFahrenheit(37), 0.0001);
      }

      @Test
      @DisplayName("Negativos")
      void t4() {
          assertEquals(-40.0, Solution.celsiusToFahrenheit(-40), 0.0001);
      }

      @Test
      @DisplayName("Decimales")
      void t5() {
          assertEquals(79.7, Solution.celsiusToFahrenheit(26.5), 0.0001);
      }
  }
