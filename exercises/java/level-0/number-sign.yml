referenceSolution: |
  public class Solution {

      public static String numberSign(int n) {
          if (n > 0) {
              return "positivo";
          } else if (n < 0) {
              return "negativo";
          }
          return "cero";
      }
  }
tests: |
  import org.junit.jupiter.api.DisplayName;
  import org.junit.jupiter.api.Test;

  import static org.junit.jupiter.api.Assertions.*;

  import java.io.ByteArrayOutputStream;
  import java.io.PrintStream;

  class SolutionTest {

      @Test
      @DisplayName("Positivo")
      void t1() {
          assertEquals("positivo", Solution.numberSign(8));
      }

      @Test
      @DisplayName("Negativo")
      void t2() {
          assertEquals("negativo", Solution.numberSign(-2));
      }

      @Test
      @DisplayName("Cero")
      void t3() {
          assertEquals("cero", Solution.numberSign(0));
      }

      @Test
      @DisplayName("Uno")
      void t4() {
          assertEquals("positivo", Solution.numberSign(1));
      }

      @Test
      @DisplayName("Menos uno")
      void t5() {
          assertEquals("negativo", Solution.numberSign(-1));
      }

      @Test
      @DisplayName("Extremos")
      void t6() {
          assertEquals("positivo", Solution.numberSign(Integer.MAX_VALUE));
          assertEquals("negativo", Solution.numberSign(Integer.MIN_VALUE));
      }
  }
