title: Sonidos de animales
statement: |
  Dentro de Solution hay una clase base Animal y tres subclases: Dog, Cat y Cow. Cada animal hace un sonido distinto: eso es polimorfismo, el mismo método sound() se comporta distinto según el objeto real.

  Completa:
  - Dog.sound() devuelve "Guau".
  - Cat.sound() devuelve "Miau".
  - Cow.sound() devuelve "Muu".
  - El método estático sounds recibe una lista de animales y devuelve una lista con el sonido de cada uno, en el mismo orden.

  Si la lista es null o está vacía, devuelve una lista vacía.

  Ejemplo:
  - sounds(List.of(new Dog(), new Cat(), new Dog())) -> ["Guau", "Miau", "Guau"]
  - sounds(List.of(new Cow())) -> ["Muu"]
  - sounds(List.of()) -> []
methodSignature: public static List<String> sounds(List<Animal> animals)
className: Solution
