slug: vehicle-super
level: 0
topic: oop-basics
title: Constructores encadenados con super
statement: |
  En Solution existe la clase Vehicle (marca y número de ruedas) con un método describe(). Las subclases Car y Motorcycle deben llamar al constructor de la clase padre con super(...) y sobrescribir describe() reutilizando el del padre.

  Completa:
  - Car(brand, doors): llama a super(brand, 4). Su describe() devuelve super.describe() + " y " + doors + " puertas".
  - Motorcycle(brand): llama a super(brand, 2). Su describe() devuelve super.describe() + " (moto)".
  - Vehicle.describe() ya devuelve "Vehículo <marca> con <ruedas> ruedas".
  - describeAll recibe una lista de vehículos y une sus descripciones separadas por "; " (punto y coma y un espacio), en el mismo orden.

  Si la lista es null o está vacía, devuelve "".

  Ejemplo:
  - describeAll(List.of(new Car("Toyota", 4))) -> "Vehículo Toyota con 4 ruedas y 4 puertas"
  - describeAll(List.of(new Motorcycle("Honda"))) -> "Vehículo Honda con 2 ruedas (moto)"
  - describeAll(List.of(new Motorcycle("Honda"), new Car("Kia", 2))) -> "Vehículo Honda con 2 ruedas (moto); Vehículo Kia con 4 ruedas y 2 puertas"
methodSignature: public static String describeAll(List<Vehicle> vehicles)
className: Solution
estimatedMinutes: 15
difficulty: easy
hints:
- super(...) debe ser la primera instrucción del constructor de la subclase y envía los datos al constructor del padre.
- Dentro de un método sobrescrito, super.describe() ejecuta la versión del padre; así no repites el texto base.
- En describeAll puedes acumular las descripciones en una lista y unirlas con String.join("; ", lista).
