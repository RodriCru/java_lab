referenceSolution: |
  import java.util.LinkedHashMap;
  import java.util.Map;

  public class Solution {
      public static Map<String, Integer> parseKeyValues(String text) {
          Map<String, Integer> resultado = new LinkedHashMap<>();
          if (text == null || text.trim().isEmpty()) {
              return resultado;
          }
          for (String par : text.split(";")) {
              if (par.isEmpty()) {
                  continue;
              }
              String[] partes = par.split("=");
              resultado.put(partes[0], Integer.parseInt(partes[1]));
          }
          return resultado;
      }
  }
tests: |
  import org.junit.jupiter.api.DisplayName;
  import org.junit.jupiter.api.Test;

  import java.util.*;

  import static org.junit.jupiter.api.Assertions.*;

  class SolutionTest {

      @Test
      @DisplayName("Parsea dos pares")
      void t98880() {
          Map<String, Integer> m = Solution.parseKeyValues("a=1;b=2");
          assertEquals(2, m.size());
          assertEquals(1, m.get("a"));
          assertEquals(2, m.get("b"));
      }

      @Test
      @DisplayName("Parsea un solo par")
      void t75266() {
          assertEquals(Map.of("x", 10), Solution.parseKeyValues("x=10"));
      }

      @Test
      @DisplayName("Conserva el orden de aparición")
      void t1223() {
          Map<String, Integer> m = Solution.parseKeyValues("z=1;a=2;m=3");
          assertEquals(Arrays.asList("z", "a", "m"), new ArrayList<>(m.keySet()));
      }

      @Test
      @DisplayName("Una clave repetida conserva el último valor y su posición")
      void t5575() {
          Map<String, Integer> m = Solution.parseKeyValues("a=1;b=2;a=5");
          assertEquals(5, m.get("a"));
          assertEquals(Arrays.asList("a", "b"), new ArrayList<>(m.keySet()));
      }

      @Test
      @DisplayName("Texto null, vacío o en blanco da un mapa vacío")
      void t8247() {
          assertTrue(Solution.parseKeyValues(null).isEmpty());
          assertTrue(Solution.parseKeyValues("").isEmpty());
          assertTrue(Solution.parseKeyValues("   ").isEmpty());
      }

      @Test
      @DisplayName("Ignora el fragmento vacío de un punto y coma final")
      void t96801() {
          Map<String, Integer> m = Solution.parseKeyValues("a=1;b=2;");
          assertEquals(2, m.size());
      }

      @Test
      @DisplayName("Acepta valores negativos")
      void t73341() {
          assertEquals(Map.of("temp", -15, "max", 0), Solution.parseKeyValues("temp=-15;max=0"));
      }
  }
