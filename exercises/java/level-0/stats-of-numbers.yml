slug: stats-of-numbers
level: 0
topic: functions
title: Estadísticas con argumentos variables
statement: |
  Escribe un método que reciba una cantidad variable de enteros (varargs) y devuelva un arreglo de 3 posiciones con el mínimo, el máximo y la suma, en ese orden: {min, max, suma}.

  Los varargs (int... nums) permiten llamar al método con cualquier cantidad de argumentos, incluso ninguno; dentro del método, nums se comporta como un int[].

  Ejemplos:
  - statsOfNumbers(4, 9, 1) -> {1, 9, 14}
  - statsOfNumbers(7) -> {7, 7, 7}
  - statsOfNumbers(-3, 5) -> {-3, 5, 2}

  Si no se recibe ningún número (o nums es null), devuelve {0, 0, 0}.
methodSignature: public static int[] statsOfNumbers(int... nums)
className: Solution
estimatedMinutes: 10
difficulty: easy
hints:
- 'Un parámetro int... nums se usa dentro del método exactamente como un arreglo int[]: puedes usar nums.length y nums[i].'
- 'Maneja primero el caso especial: si nums es null o nums.length == 0, devuelve new int[] {0, 0, 0}.'
- Inicializa min y max con nums[0] y recorre el arreglo actualizando min, max y la suma en el mismo ciclo.
starterCode: |
  public class Solution {
