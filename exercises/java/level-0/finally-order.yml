referenceSolution: |
  import java.util.*;

  public class Solution {

      public static String traceOrder(String input) {
          List<String> log = new ArrayList<>();
          try {
              log.add("try");
              Integer.parseInt(input);
          } catch (NumberFormatException e) {
              log.add("catch");
          } finally {
              log.add("finally");
          }
          log.add("end");
          return String.join(",", log);
      }
  }
tests: |
  import org.junit.jupiter.api.DisplayName;
  import org.junit.jupiter.api.Test;

  import static org.junit.jupiter.api.Assertions.*;

  import java.util.*;

  class SolutionTest {

      @Test
      @DisplayName("Sin excepción: try, finally, end")
      void t1() throws Exception {
          assertEquals("try,finally,end", Solution.traceOrder("5"));
      }

      @Test
      @DisplayName("Con excepción: try, catch, finally, end")
      void t2() throws Exception {
          assertEquals("try,catch,finally,end", Solution.traceOrder("abc"));
      }

      @Test
      @DisplayName("null provoca excepción")
      void t3() throws Exception {
          assertEquals("try,catch,finally,end", Solution.traceOrder(null));
      }

      @Test
      @DisplayName("Cadena vacía provoca excepción")
      void t4() throws Exception {
          assertEquals("try,catch,finally,end", Solution.traceOrder(""));
      }

      @Test
      @DisplayName("Número negativo válido")
      void t5() throws Exception {
          assertEquals("try,finally,end", Solution.traceOrder("-12"));
      }

      @Test
      @DisplayName("Decimal provoca excepción")
      void t6() throws Exception {
          assertEquals("try,catch,finally,end", Solution.traceOrder("3.14"));
      }

      @Test
      @DisplayName("Fuera de rango provoca excepción")
      void t7() throws Exception {
          assertEquals("try,catch,finally,end", Solution.traceOrder("99999999999"));
      }
  }
