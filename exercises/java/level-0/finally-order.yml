slug: finally-order
level: 0
topic: exceptions
title: Orden de try, catch y finally
statement: |
  El bloque finally se ejecuta SIEMPRE, haya o no excepción. Escribe un método que registre el orden de ejecución en una lista y devuelva la traza unida por comas (sin espacios).

  Debes seguir exactamente esta estructura:
  1. Crea una lista de texto vacía.
  2. try: agrega "try" y luego convierte input con Integer.parseInt (descarta el resultado).
  3. catch (NumberFormatException): agrega "catch".
  4. finally: agrega "finally".
  5. Después de todo el bloque, agrega "end" y devuelve la lista unida con ",".

  Ejemplos:
  - traceOrder("5") -> "try,finally,end"
  - traceOrder("abc") -> "try,catch,finally,end"
  - traceOrder(null) -> "try,catch,finally,end"
methodSignature: public static String traceOrder(String input)
className: Solution
estimatedMinutes: 15
difficulty: easy
hints:
- Usa una List<String> (por ejemplo ArrayList) y String.join(',', lista) para unirla.
- Si parseInt no falla, el catch se salta pero el finally se ejecuta igual.
- 'Estructura: try { log.add(''try''); Integer.parseInt(input); } catch (NumberFormatException e) { log.add(''catch''); } finally { log.add(''finally''); } log.add(''end'');'
