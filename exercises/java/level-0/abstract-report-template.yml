slug: abstract-report-template
level: 0
topic: abstraction
title: Informe con método plantilla
statement: |
  Una clase abstracta puede definir el ESQUELETO de un algoritmo (método plantilla) y dejar pasos abstractos para que las subclases los rellenen. En Solution la clase abstracta Report ya declara los pasos title(), body() y footer() (este último con un valor por defecto).

  Completa:
  - Report.generate(): método plantilla, debe ser final. Devuelve tres líneas separadas por "\n": "=== " + title() + " ===", luego body(), luego footer().
  - SalesReport(total): title() = "Ventas", body() = "Total: " + total (el double tal cual, p. ej. "Total: 150.5").
  - InventoryReport(items): title() = "Inventario", body() = "Artículos: " + items, y sobrescribe footer() para devolver "-- Inventario cerrado --".
  - buildAll recibe una lista de informes y une el resultado de generate() de cada uno separándolos por una línea en blanco ("\n\n"). Si la lista es null o vacía devuelve "".

  Ejemplo:
  ```java
  buildAll(List.of(new SalesReport(150.5)))
  ```
  ```java-lab
  === Ventas ===
  Total: 150.5
  -- Fin --
  ```

  Otro ejemplo:
  ```java
  buildAll(List.of(new InventoryReport(12)))
  ```
  ```java-lab
  === Inventario ===
  Artículos: 12
  -- Inventario cerrado --
  ```
methodSignature: public static String buildAll(List<Report> reports)
className: Solution
estimatedMinutes: 20
difficulty: medium
hints:
- Un método abstract no tiene cuerpo y obliga a cada subclase concreta a implementarlo; el método plantilla llama a esos pasos sin saber quién los implementa.
- 'Marca generate() como final para que ninguna subclase pueda cambiar el orden del esqueleto: public final String generate().'
- Para la separación usa "\n" dentro del String de Java; en buildAll junta los informes con String.join("\n\n", lista).
