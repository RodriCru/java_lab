slug: mini-container
level: 0
topic: spring-principles
title: Mini contenedor IoC
statement: |
  Un contenedor de **Inversión de Control (IoC)**, como el ApplicationContext de Spring, guarda "recetas" para crear objetos (beans) y los entrega cuando se piden. Por defecto cada bean es un **singleton**: se crea una sola vez y siempre se devuelve la misma instancia.

  Dentro de Solution existe la clase anidada Container (con esqueleto). Impleméntala SIN reflexión, usando Map:
  - register(String name, Supplier<Object> supplier): registra la receta para crear el bean. NO crea el objeto todavía (creación perezosa). Si ya hay una receta con ese nombre, lanza IllegalStateException.
  - get(String name): devuelve el bean. La primera vez llama al supplier y guarda el resultado; las siguientes veces devuelve exactamente el mismo objeto (sin volver a llamar al supplier). Si el nombre no está registrado, lanza IllegalArgumentException.

  Además, el método newContainer devuelve un contenedor nuevo y vacío.

  Ejemplo:
  ```java
  var c = newContainer();
  c.register("saludo", () -> new StringBuilder("hola"));
  c.get("saludo") == c.get("saludo")
  ```
  ```java-lab
  true
  ```

  Otro ejemplo:
  - c.get("noExiste") -> lanza IllegalArgumentException
