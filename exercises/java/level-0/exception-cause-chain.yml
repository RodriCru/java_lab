referenceSolution: |
  public class Solution {

      public static class DataException extends RuntimeException {
          public DataException(String message) {
              super(message);
          }

          public DataException(String message, Throwable cause) {
              super(message, cause);
          }
      }

      public static int parsePositive(String text) {
          if (text == null) {
              throw new DataException("El texto no puede ser null");
          }
          int value;
          try {
              value = Integer.parseInt(text);
          } catch (NumberFormatException e) {
              throw new DataException("Valor inválido: " + text, e);
          }
          if (value <= 0) {
              throw new DataException("El valor debe ser positivo: " + text);
          }
          return value;
      }
  }
tests: |
  import org.junit.jupiter.api.DisplayName;
  import org.junit.jupiter.api.Test;

  import static org.junit.jupiter.api.Assertions.*;

  class SolutionTest {

      @Test
      @DisplayName("Un entero positivo válido se devuelve tal cual")
      void valorValido() {
          assertEquals(42, Solution.parsePositive("42"));
          assertEquals(1, Solution.parsePositive("1"));
      }

      @Test
      @DisplayName("Un texto no numérico lanza DataException con el mensaje esperado")
      void textoInvalidoMensaje() {
          Solution.DataException ex = assertThrows(Solution.DataException.class, () -> Solution.parsePositive("abc"));
          assertEquals("Valor inválido: abc", ex.getMessage());
      }

      @Test
      @DisplayName("La causa de un texto inválido es la NumberFormatException original")
      void textoInvalidoCausa() {
          Solution.DataException ex = assertThrows(Solution.DataException.class, () -> Solution.parsePositive("12x"));
          assertNotNull(ex.getCause());
          assertInstanceOf(NumberFormatException.class, ex.getCause());
      }

      @Test
      @DisplayName("Un texto vacío también es inválido y conserva la causa")
      void textoVacio() {
          Solution.DataException ex = assertThrows(Solution.DataException.class, () -> Solution.parsePositive(""));
          assertEquals("Valor inválido: ", ex.getMessage());
          assertInstanceOf(NumberFormatException.class, ex.getCause());
      }

      @Test
      @DisplayName("Un número negativo lanza DataException sin causa")
      void negativo() {
          Solution.DataException ex = assertThrows(Solution.DataException.class, () -> Solution.parsePositive("-5"));
          assertEquals("El valor debe ser positivo: -5", ex.getMessage());
          assertNull(ex.getCause());
      }

      @Test
      @DisplayName("El cero no es positivo y lanza DataException sin causa")
      void cero() {
          Solution.DataException ex = assertThrows(Solution.DataException.class, () -> Solution.parsePositive("0"));
          assertEquals("El valor debe ser positivo: 0", ex.getMessage());
          assertNull(ex.getCause());
      }

      @Test
      @DisplayName("Un texto null lanza DataException sin causa")
      void nulo() {
          Solution.DataException ex = assertThrows(Solution.DataException.class, () -> Solution.parsePositive(null));
          assertEquals("El texto no puede ser null", ex.getMessage());
          assertNull(ex.getCause());
      }
  }
