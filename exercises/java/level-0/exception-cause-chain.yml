title: Envolver una excepción con su causa
statement: |
  Dentro de Solution ya existe la excepción propia DataException (hereda de RuntimeException). Aprenderás a **encadenar** excepciones: cuando una excepción de bajo nivel (como NumberFormatException) se convierte en una de tu dominio, hay que conservar la original como causa para no perder información del error.

  Escribe el método parsePositive, que convierte un texto en un entero positivo:
  - Si el texto es un entero válido y mayor que 0, devuelve ese entero.
  - Si el texto es null, lanza DataException con el mensaje "El texto no puede ser null" y SIN causa (getCause() == null).
  - Si el texto no es un entero válido, captura la NumberFormatException y lanza DataException con el mensaje "Valor inválido: " + texto, pasando la excepción capturada como causa (getCause() debe ser esa NumberFormatException).
  - Si el entero es 0 o negativo, lanza DataException con el mensaje "El valor debe ser positivo: " + texto y SIN causa.

  Ejemplos:
  - "42" -> 42
  - "abc" -> DataException("Valor inválido: abc") con causa NumberFormatException
  - "-5" -> DataException("El valor debe ser positivo: -5") sin causa
  - null -> DataException("El texto no puede ser null") sin causa
