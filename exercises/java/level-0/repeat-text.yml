slug: repeat-text
level: 0
topic: basics
title: Repetir un texto
statement: |
  Un ciclo que construye un String. Escribe un método que devuelva el texto repetido n veces, pegado, sin separadores. Si n es 0 o negativo devuelve la cadena vacía. No uses String.repeat.

  Ejemplos:
  - repeatText("ab", 3) -> "ababab"
  - repeatText("x", 1) -> "x"
  - repeatText("hola", 0) -> ""   (cadena vacía)
methodSignature: public static String repeatText(String text, int times)
className: Solution
estimatedMinutes: 8
difficulty: easy
hints:
- Empieza con un String resultado = "" y añade text en cada vuelta.
- Para muchas repeticiones es mejor un StringBuilder, pero aquí con + basta.
- Un for de 0 a times-1 no se ejecuta si times <= 0.
starterCode: |
  public class Solution {

