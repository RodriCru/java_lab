          // Tu código aquí
          return "";
      }
  }
referenceSolution: |
  public class Solution {

      public static String repeatText(String text, int times) {
          StringBuilder sb = new StringBuilder();
          for (int i = 0; i < times; i++) {
              sb.append(text);
          }
          return sb.toString();
      }
  }
tests: |
  import org.junit.jupiter.api.DisplayName;
  import org.junit.jupiter.api.Test;

  import static org.junit.jupiter.api.Assertions.*;

  import java.io.ByteArrayOutputStream;
  import java.io.PrintStream;

  class SolutionTest {

      @Test
      @DisplayName("Tres veces")
      void t1() {
          assertEquals("ababab", Solution.repeatText("ab", 3));
      }

      @Test
      @DisplayName("Una vez")
      void t2() {
          assertEquals("x", Solution.repeatText("x", 1));
      }

      @Test
      @DisplayName("Cero veces")
      void t3() {
          assertEquals("", Solution.repeatText("hola", 0));
      }

      @Test
      @DisplayName("Negativo")
      void t4() {
          assertEquals("", Solution.repeatText("hola", -2));
      }

      @Test
      @DisplayName("Texto vacío")
      void t5() {
          assertEquals("", Solution.repeatText("", 5));
      }
  }
