referenceSolution: |
  import java.util.ArrayList;
  import java.util.List;
  import java.util.Scanner;

  public class Solution {
      public static int[] parseNumbersLine(String line) {
          if (line == null) {
              return new int[0];
          }
          Scanner scanner = new Scanner(line);
          List<Integer> valores = new ArrayList<>();
          while (scanner.hasNextInt()) {
              valores.add(scanner.nextInt());
          }
          scanner.close();
          int[] resultado = new int[valores.size()];
          for (int i = 0; i < resultado.length; i++) {
              resultado[i] = valores.get(i);
          }
          return resultado;
      }
  }
tests: |
  import org.junit.jupiter.api.DisplayName;
  import org.junit.jupiter.api.Test;

  import java.util.*;

  import static org.junit.jupiter.api.Assertions.*;

  class SolutionTest {

      @Test
      @DisplayName("Lee varios números separados por espacio")
      void t16643() {
          assertArrayEquals(new int[] {3, 10, -4}, Solution.parseNumbersLine("3 10 -4"));
      }

      @Test
      @DisplayName("Ignora espacios extra")
      void t85989() {
          assertArrayEquals(new int[] {7, 8}, Solution.parseNumbersLine("  7   8 "));
      }

      @Test
      @DisplayName("Un solo número")
      void t37598() {
          assertArrayEquals(new int[] {42}, Solution.parseNumbersLine("42"));
      }

      @Test
      @DisplayName("Una línea vacía da un arreglo vacío")
      void t66058() {
          assertEquals(0, Solution.parseNumbersLine("").length);
          assertEquals(0, Solution.parseNumbersLine("   ").length);
      }

      @Test
      @DisplayName("Una línea null da un arreglo vacío")
      void t87300() {
          assertEquals(0, Solution.parseNumbersLine(null).length);
      }

      @Test
      @DisplayName("Respeta el orden y los repetidos")
      void t96179() {
          assertArrayEquals(new int[] {5, 5, 1, 5}, Solution.parseNumbersLine("5 5 1 5"));
      }

      @Test
      @DisplayName("Acepta números grandes y ceros")
      void t52991() {
          assertArrayEquals(new int[] {0, 2000000000, -2000000000}, Solution.parseNumbersLine("0 2000000000 -2000000000"));
      }
  }
