referenceSolution: |
  import java.util.*;

  public class Solution {

      public interface Listener {
          void onEvent(String message);
      }

      public static class EventPublisher {
          private final Map<String, List<Listener>> listeners = new HashMap<>();

          public void subscribe(String topic, Listener listener) {
              if (listener == null) {
                  throw new IllegalArgumentException("El listener es obligatorio");
              }
              listeners.computeIfAbsent(topic, t -> new ArrayList<>()).add(listener);
          }

          public int publish(String topic, String message) {
              List<Listener> subscribed = listeners.getOrDefault(topic, List.of());
              for (Listener listener : new ArrayList<>(subscribed)) {
                  listener.onEvent(message);
              }
              return subscribed.size();
          }

          public boolean unsubscribe(String topic, Listener listener) {
              List<Listener> subscribed = listeners.get(topic);
              return subscribed != null && subscribed.remove(listener);
          }
      }

      public static EventPublisher newPublisher() {
          return new EventPublisher();
      }
  }
tests: |
  import org.junit.jupiter.api.DisplayName;
  import org.junit.jupiter.api.Test;

  import java.util.*;

  import static org.junit.jupiter.api.Assertions.*;

  class SolutionTest {

      @Test
      @DisplayName("Todos los suscriptores del tema reciben el mensaje y se devuelve cuántos fueron")
      void variosSuscriptores() {
          Solution.EventPublisher p = Solution.newPublisher();
          List<String> received = new ArrayList<>();
          p.subscribe("pedidos", m -> received.add("A:" + m));
          p.subscribe("pedidos", m -> received.add("B:" + m));
          assertEquals(2, p.publish("pedidos", "nuevo"));
          assertEquals(List.of("A:nuevo", "B:nuevo"), received);
      }

      @Test
      @DisplayName("Un tema sin suscriptores devuelve 0")
      void sinSuscriptores() {
          Solution.EventPublisher p = Solution.newPublisher();
          assertEquals(0, p.publish("nadie", "x"));
      }

      @Test
      @DisplayName("Los suscriptores no reciben eventos de otros temas")
      void aislamientoPorTema() {
          Solution.EventPublisher p = Solution.newPublisher();
          List<String> received = new ArrayList<>();
          p.subscribe("a", received::add);
          assertEquals(0, p.publish("b", "x"));
          assertTrue(received.isEmpty());
          assertEquals(1, p.publish("a", "y"));
          assertEquals(List.of("y"), received);
      }

      @Test
      @DisplayName("Se notifica en el orden de suscripción")
      void ordenDeSuscripcion() {
          Solution.EventPublisher p = Solution.newPublisher();
          List<Integer> order = new ArrayList<>();
          p.subscribe("t", m -> order.add(1));
          p.subscribe("t", m -> order.add(2));
          p.subscribe("t", m -> order.add(3));
          p.publish("t", "go");
          assertEquals(List.of(1, 2, 3), order);
      }

      @Test
      @DisplayName("unsubscribe quita la suscripción y devuelve true; si no existía, false")
      void desuscribir() {
          Solution.EventPublisher p = Solution.newPublisher();
          List<String> received = new ArrayList<>();
          Solution.Listener l = received::add;
          p.subscribe("t", l);
          assertTrue(p.unsubscribe("t", l));
          assertEquals(0, p.publish("t", "x"));
          assertTrue(received.isEmpty());
          assertFalse(p.unsubscribe("t", l));
          assertFalse(p.unsubscribe("otro", l));
      }

      @Test
      @DisplayName("Suscribir un listener null lanza IllegalArgumentException")
      void listenerNulo() {
          Solution.EventPublisher p = Solution.newPublisher();
          assertThrows(IllegalArgumentException.class, () -> p.subscribe("t", null));
      }

      @Test
      @DisplayName("El mismo listener suscrito dos veces recibe el evento dos veces")
      void suscripcionDoble() {
          Solution.EventPublisher p = Solution.newPublisher();
          int[] count = {0};
          Solution.Listener l = m -> count[0]++;
          p.subscribe("t", l);
          p.subscribe("t", l);
          assertEquals(2, p.publish("t", "x"));
          assertEquals(2, count[0]);
      }

      @Test
      @DisplayName("Cada publicador nuevo es independiente")
      void publicadoresIndependientes() {
          Solution.EventPublisher p1 = Solution.newPublisher();
          Solution.EventPublisher p2 = Solution.newPublisher();
          p1.subscribe("t", m -> { });
          assertEquals(1, p1.publish("t", "x"));
          assertEquals(0, p2.publish("t", "x"));
      }
  }
