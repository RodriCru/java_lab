hints:
  - "Guarda los suscriptores en un Map<String, List<Listener>>: la clave es el tema y la lista conserva el orden de suscripción."
  - "Para subscribe usa computeIfAbsent(topic, t -> new ArrayList<>()).add(listener). Para publish, usa getOrDefault(topic, List.of()) y recorre la lista llamando a onEvent."
  - "unsubscribe: obtén la lista del tema (puede no existir) y devuelve el resultado de list.remove(listener), que quita solo la primera coincidencia."
