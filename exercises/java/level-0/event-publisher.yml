slug: event-publisher
level: 0
topic: spring-principles
title: Publicador de eventos
statement: |
  El **patrón observador** permite que unos objetos (suscriptores) reaccionen a lo que ocurre en otro sin que este los conozca en detalle. Spring lo usa con ApplicationEventPublisher y @EventListener: quien publica no sabe quién escucha.

  Dentro de Solution existe la interfaz Listener (con el método void onEvent(String message)) y la clase anidada EventPublisher (con esqueleto). Impleméntala:
  - subscribe(String topic, Listener listener): suscribe el listener a ese tema. Si listener es null, lanza IllegalArgumentException.
  - publish(String topic, String message): llama a onEvent(message) de TODOS los listeners suscritos a ese tema, en el orden en que se suscribieron, y devuelve cuántos fueron notificados. Un tema sin suscriptores devuelve 0 (no es un error).
  - unsubscribe(String topic, Listener listener): quita la suscripción y devuelve true si existía, false si no.

  Los listeners de un tema no reciben los eventos de otros temas. Si el mismo listener se suscribe dos veces al mismo tema, recibe el evento dos veces.

  El método newPublisher devuelve un publicador nuevo y sin suscriptores.

  Ejemplo:
  - dos listeners suscritos a "pedidos"; publish("pedidos", "nuevo") -> ambos reciben "nuevo" y devuelve 2
  - publish("otro", "x") -> devuelve 0
