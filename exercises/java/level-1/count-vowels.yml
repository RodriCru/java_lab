referenceSolution: |
  public class Solution {
      public static int countVowels(String text) {
          if (text == null) {
              return 0;
          }
          int contador = 0;
          String vocales = "aeiouAEIOU";
          for (int i = 0; i < text.length(); i++) {
              if (vocales.indexOf(text.charAt(i)) >= 0) {
                  contador++;
              }
          }
          return contador;
      }
  }
tests: |
  import org.junit.jupiter.api.DisplayName;
  import org.junit.jupiter.api.Test;

  import static org.junit.jupiter.api.Assertions.assertEquals;

  class SolutionTest {

      @Test
      @DisplayName("Cuenta las vocales en minúscula")
      void vocalesMinusculas() {
          assertEquals(2, Solution.countVowels("hola"));
      }

      @Test
      @DisplayName("Cuenta las vocales sin distinguir mayúsculas")
      void vocalesMayusculas() {
          assertEquals(5, Solution.countVowels("AEIOU"));
      }

      @Test
      @DisplayName("Una cadena vacía devuelve cero")
      void cadenaVacia() {
          assertEquals(0, Solution.countVowels(""));
      }

      @Test
      @DisplayName("Un texto null devuelve cero")
      void textoNull() {
          assertEquals(0, Solution.countVowels(null));
      }

      @Test
      @DisplayName("Devuelve cero cuando no hay vocales")
      void sinVocales() {
          assertEquals(0, Solution.countVowels("xyz"));
      }

      @Test
      @DisplayName("Mezcla mayúsculas, minúsculas y consonantes")
      void mezcla() {
          assertEquals(6, Solution.countVowels("Programar en Java"));
      }
  }
