slug: count-vowels
level: 1
topic: strings
title: "Contar vocales"
statement: |
  Escribe un método que cuente cuántas vocales contiene una cadena de texto.

  Reglas del contrato:
  - Las vocales son a, e, i, o, u, sin distinguir mayúsculas de minúsculas.
  - Las vocales acentuadas (á, é, í, ó, ú) y la diéresis (ü) NO se cuentan; solo se cuentan las cinco vocales básicas.
  - Si el texto es null, el método devuelve 0.

  Ejemplo:
  - countVowels("hola") -> 2
  - countVowels("AEIOU") -> 5
  - countVowels("") -> 0
methodSignature: "public static int countVowels(String text)"
className: Solution
estimatedMinutes: 8
difficulty: easy
hints:
  - "Recorre la cadena carácter por carácter."
  - "Guarda las vocales en una cadena y usa indexOf para saber si el carácter está incluida."
  - "Convierte el carácter a minúscula antes de compararlo, o incluye las mayúsculas en la lista de vocales."
starterCode: |
