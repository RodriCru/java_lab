title: Ordenar personas por edad
statement: |
  Dentro de la clase Solution ya existe una clase anidada Person con los campos públicos name y age. Escribe un método que reciba dos arreglos PARALELOS, uno con nombres y otro con edades, y devuelva los NOMBRES ordenados por edad ascendente.

  Reglas del contrato:
  - El arreglo names[i] corresponde a la persona con edad ages[i].
  - Si dos edades coinciden, ordena por nombre alfabéticamente.
  - El resultado contiene solo los nombres, no las edades.

  Ejemplo:
  - sortByAge(names=["Ana", "Luis", "Eva"], ages=[30, 20, 25]) -> ["Luis", "Eva", "Ana"]
  - sortByAge(names=["Zoe", "Amy"], ages=[20, 20]) -> ["Amy", "Zoe"]
  - sortByAge(names=["Ana"], ages=[40]) -> ["Ana"]

  Si algún arreglo es null o las longitudes no coinciden, devuelve un arreglo vacío (new String[0]).
methodSignature: "public static String[] sortByAge(String[] names, int[] ages)"
className: Solution
