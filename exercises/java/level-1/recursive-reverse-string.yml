slug: recursive-reverse-string
level: 1
topic: recursion
title: Invertir recursivamente
statement: |
  Escribe un método RECURSIVO que devuelva la cadena de texto invertida.

  Reglas del contrato:
  - Si text es null, devuelve una cadena vacía "".
  - Si text tiene un solo carácter, se devuelve igual.
  - No puedes usar bucles ni StringBuilder.reverse(): el enunciado exige una solución recursiva.

  Ejemplo:
  - recursiveReverse("hola") -> "aloh"
  - recursiveReverse("a") -> "a"
  - recursiveReverse("") -> ""
methodSignature: "public static String recursiveReverse(String text)"
className: Solution
estimatedMinutes: 15
difficulty: easy
hints:
  - "El caso base es una cadena vacía o de un solo carácter: invertirla devuelve lo mismo."
  - "Toma el primer carácter y colócalo DESPUÉS del resto ya invertido."
  - "Puedes usar text.substring(1) para quedarte con el resto de la cadena."
starterCode: |
