          // Tu código aquí
          return "";
      }
  }
referenceSolution: |
  public class Solution {
      public static String recursiveReverse(String text) {
          if (text == null) {
              return "";
          }
          if (text.length() <= 1) {
              return text;
          }
          return recursiveReverse(text.substring(1)) + text.charAt(0);
      }
  }
tests: |
  import org.junit.jupiter.api.DisplayName;
  import org.junit.jupiter.api.Test;

  import static org.junit.jupiter.api.Assertions.*;

  class SolutionTest {

      @Test
      @DisplayName("Invierte una palabra normal")
      void palabraNormal() {
          assertEquals("aloh", Solution.recursiveReverse("hola"));
      }

      @Test
      @DisplayName("Invierte una cadena con espacios")
      void cadenaConEspacios() {
          assertEquals("odnum aloh", Solution.recursiveReverse("hola mundo"));
      }

      @Test
      @DisplayName("Devuelve la misma cadena cuando tiene un solo carácter")
      void unSoloCaracter() {
          assertEquals("a", Solution.recursiveReverse("a"));
      }

      @Test
      @DisplayName("Devuelve una cadena vacía cuando la entrada está vacía")
      void cadenaVacia() {
          assertEquals("", Solution.recursiveReverse(""));
      }

      @Test
      @DisplayName("Devuelve una cadena vacía cuando la entrada es null")
      void entradaNula() {
          assertEquals("", Solution.recursiveReverse(null));
      }

      @Test
      @DisplayName("Invierte una cadena de longitud par")
      void longitudPar() {
          assertEquals("dcba", Solution.recursiveReverse("abcd"));
      }
  }
