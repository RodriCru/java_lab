slug: validate-parentheses
level: 1
topic: structures
title: Corchetes balanceados
statement: |
  Escribe un método que determine si los corchetes de un texto están balanceados. Se consideran únicamente los caracteres (), [] y {}, y deben cerrarse en el orden correcto. Cualquier otro carácter se ignora.

  Reglas del contrato:
  - Cada apertura debe tener su cierre del mismo tipo.
  - El orden importa: "(]" no es válido.
  - Los caracteres que no son corchetes no afectan el resultado.

  Ejemplo:
  - isBalanced("(a+b)") -> true
  - isBalanced("([)]") -> false
  - isBalanced("sin corchetes") -> true

  Si el texto es null o está vacío, devuelve true.
methodSignature: "public static boolean isBalanced(String text)"
className: Solution
estimatedMinutes: 15
difficulty: easy
hints:
  - "Usa una pila (java.util.Deque) para recordar las aperturas pendientes."
  - "Cuando veas un cierre, el tope de la pila debe ser su apertura correspondiente; si no, ya es inválido."
  - "Al terminar, la pila debe quedar vacía: cualquier apertura sin cerrar deja el texto desbalanceado."
