slug: rotate-left
level: 1
topic: arrays
title: Rotar a la izquierda
statement: |
  Escribe un método que devuelva un arreglo NUEVO rotado a la izquierda las posiciones indicadas.

  Ejemplo:
  - rotateLeft([1, 2, 3, 4, 5], positions=2) -> [3, 4, 5, 1, 2]
  - rotateLeft([1, 2, 3], positions=0) -> [1, 2, 3]
  - rotateLeft([1, 2, 3], positions=5) -> [3, 1, 2]

  Si positions es mayor que el largo del arreglo, usa el módulo (positions % length).
  Si positions es negativo, aplícalo con módulo positivo para obtener una rotación válida.
  Si el arreglo es null o vacío, devuelve un arreglo vacío (new int[0]).
  El arreglo de entrada nunca debe modificarse.
methodSignature: "public static int[] rotateLeft(int[] numbers, int positions)"
className: Solution
estimatedMinutes: 15
difficulty: easy
hints:
  - "Calcula el desplazamiento efectivo como positions % numbers.length, ajustándolo si es negativo."
  - "El elemento en la posición i se mueve a la posición (i - desplazamiento + largo) % largo."
  - "Crea un arreglo resultado del mismo tamaño y llena cada posición sin tocar el arreglo original."
starterCode: |
