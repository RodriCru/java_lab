slug: fizzbuzz
level: 1
topic: divisibility
title: "FizzBuzz"
statement: |
  Escribe un método que devuelva un arreglo de textos con la secuencia de FizzBuzz desde el 1 hasta el límite indicado.

  El arreglo tiene tantas posiciones como el límite, y la posición i (empezando en 0) corresponde al número i + 1:
  - "FizzBuzz" si el número es divisible entre 3 y entre 5.
  - "Fizz" si el número solo es divisible entre 3.
  - "Buzz" si el número solo es divisible entre 5.
  - El número convertido a texto en cualquier otro caso.

  Reglas del contrato:
  - Si el límite es menor o igual a 0, devuelve un arreglo vacío (new String[0]).
  - Comprueba primero la condición de "FizzBuzz", porque un múltiplo de 15 cumple las otras dos a la vez.

  Ejemplo:
  - fizzBuzz(5) -> ["1", "2", "Fizz", "4", "Buzz"]
  - fizzBuzz(15) -> la posición 14 (el número 15) es "FizzBuzz"
  - fizzBuzz(0) -> []
methodSignature: "public static String[] fizzBuzz(int limit)"
className: Solution
estimatedMinutes: 15
difficulty: easy
hints:
  - "El arreglo debe tener exactamente limit posiciones, y el texto de la posición i corresponde al número i + 1."
  - "Usa el operador módulo para saber si un número es divisible entre 3 o entre 5."
  - "Pregunta primero si es divisible entre 15; si no, después por 3 y por 5 por separado."
