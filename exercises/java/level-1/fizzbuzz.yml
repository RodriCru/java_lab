referenceSolution: |
  public class Solution {
      public static String[] fizzBuzz(int limit) {
          if (limit <= 0) {
              return new String[0];
          }
          String[] resultado = new String[limit];
          for (int i = 0; i < limit; i++) {
              int numero = i + 1;
              if (numero % 15 == 0) {
                  resultado[i] = "FizzBuzz";
              } else if (numero % 3 == 0) {
                  resultado[i] = "Fizz";
              } else if (numero % 5 == 0) {
                  resultado[i] = "Buzz";
              } else {
                  resultado[i] = String.valueOf(numero);
              }
          }
          return resultado;
      }
  }
tests: |
  import org.junit.jupiter.api.DisplayName;
  import org.junit.jupiter.api.Test;

  import static org.junit.jupiter.api.Assertions.assertArrayEquals;
  import static org.junit.jupiter.api.Assertions.assertEquals;

  class SolutionTest {

      @Test
      @DisplayName("Los primeros cinco valores son 1, 2, Fizz, 4 y Buzz")
      void primerosCinco() {
          assertArrayEquals(new String[] {"1", "2", "Fizz", "4", "Buzz"}, Solution.fizzBuzz(5));
      }

      @Test
      @DisplayName("Un límite menor o igual a cero devuelve un arreglo vacío")
      void limiteNoPositivo() {
          assertEquals(0, Solution.fizzBuzz(0).length);
          assertEquals(0, Solution.fizzBuzz(-3).length);
      }

      @Test
      @DisplayName("El límite 1 devuelve solo el texto \"1\"")
      void limiteIgualAUno() {
          assertArrayEquals(new String[] {"1"}, Solution.fizzBuzz(1));
      }

      @Test
      @DisplayName("El número 15 es FizzBuzz y no Fizz ni Buzz")
      void multiploDeQuince() {
          String[] resultado = Solution.fizzBuzz(15);
          assertEquals("FizzBuzz", resultado[14]);
      }

      @Test
      @DisplayName("Los múltiplos de 3 y de 5 se etiquetan correctamente hasta 15")
      void secuenciaHastaQuince() {
          assertArrayEquals(
                  new String[] {
                      "1", "2", "Fizz", "4", "Buzz",
                      "Fizz", "7", "8", "Fizz", "Buzz",
                      "11", "Fizz", "13", "14", "FizzBuzz"
                  },
                  Solution.fizzBuzz(15));
      }

      @Test
      @DisplayName("La posición 29 corresponde al número 30, que es FizzBuzz")
      void ultimaPosicion() {
          String[] resultado = Solution.fizzBuzz(30);
          assertEquals("FizzBuzz", resultado[29]);
      }
  }
