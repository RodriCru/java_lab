slug: binary-search
level: 1
topic: binary-search
title: Búsqueda binaria
statement: |
  Escribe un método que busque un número en un arreglo ORDENADO de forma ascendente
  y devuelva su índice.

  Reglas del contrato:
  - Si el valor se encuentra, devuelve su índice.
  - Si el valor no está, devuelve -1.
  - Si el arreglo es null o está vacío, devuelve -1.
  - Aprovecha que el arreglo está ordenado para descartar la mitad de cada vez.

  Ejemplo:
  - binarySearch([1, 3, 5, 7, 9], target=7) -> 3
  - binarySearch([1, 3, 5], target=4) -> -1
  - binarySearch([], target=4) -> -1
methodSignature: "public static int binarySearch(int[] numbers, int target)"
className: Solution
estimatedMinutes: 20
difficulty: easy
hints:
  - "Lleva dos índices: el inicio y el fin del rango donde puede estar el valor."
  - "Calcula el punto medio y descarta la mitad donde no puede estar."
  - "Cuida el cálculo del medio con inicio + (fin - inicio) / 2 para evitar desbordes."
