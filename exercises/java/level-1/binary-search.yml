referenceSolution: |
  public class Solution {
      public static int binarySearch(int[] numbers, int target) {
          if (numbers == null || numbers.length == 0) {
              return -1;
          }
          int inicio = 0;
          int fin = numbers.length - 1;
          while (inicio <= fin) {
              int medio = inicio + (fin - inicio) / 2;
              if (numbers[medio] == target) {
                  return medio;
              }
              if (numbers[medio] < target) {
                  inicio = medio + 1;
              } else {
                  fin = medio - 1;
              }
          }
          return -1;
      }
  }
tests: |
  import org.junit.jupiter.api.DisplayName;
  import org.junit.jupiter.api.Test;

  import static org.junit.jupiter.api.Assertions.*;

  class SolutionTest {

      @Test
      @DisplayName("Encuentra un valor que está en el medio")
      void encuentraEnElMedio() {
          assertEquals(3, Solution.binarySearch(new int[] {1, 3, 5, 7, 9}, 7));
      }

      @Test
      @DisplayName("Encuentra un valor que está al inicio")
      void encuentraAlInicio() {
          assertEquals(0, Solution.binarySearch(new int[] {1, 3, 5, 7, 9}, 1));
      }

      @Test
      @DisplayName("Encuentra un valor que está al final")
      void encuentraAlFinal() {
          assertEquals(4, Solution.binarySearch(new int[] {1, 3, 5, 7, 9}, 9));
      }

      @Test
      @DisplayName("Devuelve -1 cuando el valor no está en el arreglo")
      void noEncontrado() {
          assertEquals(-1, Solution.binarySearch(new int[] {1, 3, 5}, 4));
      }

      @Test
      @DisplayName("Devuelve -1 cuando el arreglo está vacío")
      void arregloVacio() {
          assertEquals(-1, Solution.binarySearch(new int[0], 4));
      }

      @Test
      @DisplayName("Devuelve -1 cuando el arreglo es null")
      void arregloNulo() {
          assertEquals(-1, Solution.binarySearch(null, 4));
      }
  }
