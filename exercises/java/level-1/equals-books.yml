title: Dos libros son iguales
statement: |
  Dentro de la clase Solution ya existe una clase anidada Book con título y autor, que sobrescribe equals y hashCode. Escribe un método que determine si dos libros son iguales.

  Reglas del contrato:
  - Dos libros son iguales cuando tienen el MISMO título y el MISMO autor.
  - El método debe delegar la comparación en equals del propio libro.

  Ejemplo:
  - sameBook(first=Book("Java", "Ana"), second=Book("Java", "Ana")) -> true
  - sameBook(first=Book("Java", "Ana"), second=Book("Java", "Luis")) -> false
  - sameBook(first=Book("Java", "Ana"), second=Book("Python", "Ana")) -> false

  Si cualquiera de los dos libros es null, devuelve false.
