referenceSolution: |
  public class Solution {

      public static class Book {
          private final String title;
          private final String author;

          public Book(String title, String author) {
              this.title = title;
              this.author = author;
          }

          @Override
          public boolean equals(Object other) {
              if (this == other) {
                  return true;
              }
              if (!(other instanceof Book)) {
                  return false;
              }
              Book otro = (Book) other;
              return java.util.Objects.equals(title, otro.title) && java.util.Objects.equals(author, otro.author);
          }

          @Override
          public int hashCode() {
              return java.util.Objects.hash(title, author);
          }
      }

      public static boolean sameBook(Book first, Book second) {
          if (first == null || second == null) {
              return false;
          }
          return first.equals(second);
      }
  }
tests: |
  import org.junit.jupiter.api.DisplayName;
  import org.junit.jupiter.api.Test;

  import static org.junit.jupiter.api.Assertions.*;

  class SolutionTest {

      @Test
      @DisplayName("Dos libros con el mismo título y autor son iguales")
      void librosIguales() {
          assertTrue(Solution.sameBook(new Solution.Book("Java", "Ana"), new Solution.Book("Java", "Ana")));
      }

      @Test
      @DisplayName("Dos libros con el mismo título pero distinto autor no son iguales")
      void distintoAutor() {
          assertFalse(Solution.sameBook(new Solution.Book("Java", "Ana"), new Solution.Book("Java", "Luis")));
      }

      @Test
      @DisplayName("Dos libros con distinto título no son iguales")
      void distintoTitulo() {
          assertFalse(Solution.sameBook(new Solution.Book("Java", "Ana"), new Solution.Book("Python", "Ana")));
      }

      @Test
      @DisplayName("Un libro nunca es igual a null")
      void libroConNull() {
          assertFalse(Solution.sameBook(new Solution.Book("Java", "Ana"), null));
          assertFalse(Solution.sameBook(null, new Solution.Book("Java", "Ana")));
      }

      @Test
      @DisplayName("Dos libros iguales tienen el mismo hashCode")
      void mismoHashCode() {
          Solution.Book uno = new Solution.Book("Java", "Ana");
          Solution.Book dos = new Solution.Book("Java", "Ana");
          assertEquals(uno.hashCode(), dos.hashCode());
      }

      @Test
      @DisplayName("Un libro es igual a sí mismo")
      void mismaReferencia() {
          Solution.Book libro = new Solution.Book("Java", "Ana");
          assertTrue(Solution.sameBook(libro, libro));
      }
  }
