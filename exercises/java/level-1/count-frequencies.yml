slug: count-frequencies
level: 1
topic: structures
title: Contar frecuencias
statement: |
  Escribe un método que reciba un arreglo de números enteros y devuelva un mapa con la cantidad de veces que aparece cada número.

  La clave del mapa es el número y el valor es la cantidad de apariciones.

  Ejemplo:
  - countFrequencies([1, 2, 2, 3, 3, 3]) -> {1=1, 2=2, 3=3}
  - countFrequencies([5, 5, 5]) -> {5=3}
  - countFrequencies([7]) -> {7=1}

  Si el arreglo es null o está vacío, devuelve un mapa vacío (no null).
methodSignature: "public static java.util.Map<Integer, Integer> countFrequencies(int[] numbers)"
className: Solution
estimatedMinutes: 15
difficulty: easy
hints:
  - "Crea un java.util.HashMap vacío y recórrelo con el arreglo."
  - "Usa getOrDefault(clave, 0) para obtener la cuenta actual sin preocuparte por las claves que aún no existen."
  - "Antes de recorrer, revisa si numbers es null para devolver el mapa vacío."
