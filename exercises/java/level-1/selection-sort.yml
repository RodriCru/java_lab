slug: selection-sort
level: 1
topic: sorting
title: Ordenamiento por selección
statement: |
  Escribe un método que ordene un arreglo de enteros de menor a mayor usando el
  algoritmo de selección.

  Reglas del contrato:
  - Devuelve un arreglo NUEVO con los valores ordenados.
  - El arreglo de entrada NO debe modificarse.
  - Si el arreglo es null, devuelve null.
  - Si el arreglo está vacío, devuelve un arreglo vacío.

  Ejemplo:
  - selectionSort([64, 25, 12, 22]) -> [12, 22, 25, 64]
  - selectionSort([-3, -1, -7]) -> [-7, -3, -1]
  - selectionSort([]) -> []
methodSignature: "public static int[] selectionSort(int[] numbers)"
className: Solution
estimatedMinutes: 20
difficulty: easy
hints:
  - "En cada posición busca el valor más pequeño del resto del arreglo."
  - "Guarda el índice del mínimo y luego intercámbialo con la posición actual."
  - "Trabaja sobre una copia del arreglo para no modificar la entrada."
starterCode: |
