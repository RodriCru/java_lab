referenceSolution: |
  import java.util.*;
  public class Solution {
      public static boolean isIsomorphic(String first, String second) {
          if (first == null || second == null) return false;
          if (first.length() != second.length()) return false;
          Map<Character, Character> ida = new HashMap<>();
          Map<Character, Character> vuelta = new HashMap<>();
          for (int i = 0; i < first.length(); i++) {
              char a = first.charAt(i);
              char b = second.charAt(i);
              Character mapeadoA = ida.get(a);
              Character mapeadoB = vuelta.get(b);
              if (mapeadoA == null && mapeadoB == null) {
                  ida.put(a, b);
                  vuelta.put(b, a);
              } else if (mapeadoA == null || mapeadoB == null || mapeadoA != b || mapeadoB != a) {
                  return false;
              }
          }
          return true;
      }
  }
tests: |
  import org.junit.jupiter.api.DisplayName;
  import org.junit.jupiter.api.Test;
  import java.util.*;
  import static org.junit.jupiter.api.Assertions.*;

  class SolutionTest {

      @Test
      @DisplayName("egg y add son isomorfas")
      void t0() {
          assertTrue(Solution.isIsomorphic("egg", "add"));
      }

      @Test
      @DisplayName("foo y bar no son isomorfas")
      void t1() {
          assertFalse(Solution.isIsomorphic("foo", "bar"));
      }

      @Test
      @DisplayName("paper y title son isomorfas")
      void t2() {
          assertTrue(Solution.isIsomorphic("paper", "title"));
      }

      @Test
      @DisplayName("Dos caracteres no pueden mapear al mismo")
      void t3() {
          assertFalse(Solution.isIsomorphic("ab", "aa"));
      }

      @Test
      @DisplayName("Un carácter no puede mapear a dos distintos")
      void t4() {
          assertFalse(Solution.isIsomorphic("aa", "ab"));
      }

      @Test
      @DisplayName("Distinta longitud o null")
      void t5() {
          assertFalse(Solution.isIsomorphic("abc", "ab"));
          assertFalse(Solution.isIsomorphic(null, "a"));
      }

      @Test
      @DisplayName("Cadenas vacías")
      void t6() {
          assertTrue(Solution.isIsomorphic("", ""));
      }

      @Test
      @DisplayName("Entrada grande")
      void t7() {
          StringBuilder a = new StringBuilder();
          StringBuilder b = new StringBuilder();
          for (int i = 0; i < 100000; i++) { a.append((char) ('a' + i % 26)); b.append((char) ('A' + i % 26)); }
          assertTrue(Solution.isIsomorphic(a.toString(), b.toString()));
      }
  }
