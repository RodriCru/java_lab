slug: move-zeros
level: 2
topic: two-pointers
title: Mover los ceros al final
statement: |
  Mueve todos los ceros de un arreglo al final, conservando el orden relativo de los elementos
  distintos de cero. Hazlo en el mismo arreglo (sin crear otro) y devuelve ese mismo arreglo.

  Ejemplo:
  - moveZeros([0, 1, 0, 3, 12]) -> [1, 3, 12, 0, 0]
  - moveZeros([0, 0, 1]) -> [1, 0, 0]
  - moveZeros([4, 5]) -> [4, 5]

  Si el arreglo es null, devuelve null. Se espera O(n) tiempo y O(1) espacio extra.
methodSignature: "public static int[] moveZeros(int[] numbers)"
className: Solution
estimatedMinutes: 15
difficulty: medium
hints:
  - "Usa un puntero de escritura que indica la próxima posición para un elemento distinto de cero."
  - "Recorre el arreglo: cada vez que encuentres un valor distinto de cero, colócalo en la posición de escritura y avanza ese puntero."
  - "Al terminar el recorrido, rellena con ceros desde la posición de escritura hasta el final (o intercambia en lugar de copiar)."
