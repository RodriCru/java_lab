slug: roman-to-int
level: 2
topic: strings
title: "Número romano a entero"
statement: |
  Convierte un número romano a entero. Símbolos: I=1, V=5, X=10, L=50, C=100, D=500, M=1000.

  Cuando un símbolo menor aparece antes de uno mayor, se resta (IV=4, IX=9, XL=40, XC=90, CD=400, CM=900).

  Ejemplos:
  - romanToInt("III") -> 3
  - romanToInt("LVIII") -> 58
  - romanToInt("MCMXCIV") -> 1994

  Las entradas siempre son números romanos válidos (en mayúsculas) entre 1 y 3999. Si el texto es null o vacío, devuelve 0.
