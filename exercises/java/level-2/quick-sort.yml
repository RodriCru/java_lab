slug: quick-sort
level: 2
topic: sorting
title: Ordenamiento rápido (Quick Sort)
statement: |
  Implementa el algoritmo Quick Sort: devuelve un arreglo NUEVO con los elementos de
  `numbers` en orden ascendente. El arreglo original no debe modificarse.

  Ejemplo:
  - quickSort([5, 2, 9, 1, 5, 6]) -> [1, 2, 5, 5, 6, 9]
  - quickSort([3]) -> [3]
  - quickSort([]) -> []

  Si `numbers` es null, devuelve un arreglo vacío. Se conservan los duplicados.
  Se espera una solución que divida el problema alrededor de un pivote (no vale Arrays.sort).
methodSignature: "public static int[] quickSort(int[] numbers)"
className: Solution
estimatedMinutes: 25
difficulty: medium
hints:
  - "Copia el arreglo de entrada antes de ordenar, para no modificar el original."
  - "Elige un pivote y reubica los elementos menores a su izquierda y los mayores a su derecha (partición)."
  - "Ordena recursivamente la parte izquierda y la derecha del pivote."
