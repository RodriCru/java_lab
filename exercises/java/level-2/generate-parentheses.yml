slug: generate-parentheses
level: 2
topic: recursion
title: "Generar paréntesis válidos"
statement: |
  Dado un número n de pares de paréntesis, genera todas las combinaciones bien formadas, ordenadas lexicográficamente considerando '(' menor que ')'.

  Ejemplos:
  - generateParentheses(n=1) -> ["()"]
  - generateParentheses(n=2) -> ["(())", "()()"]
  - generateParentheses(n=3) -> ["((()))", "(()())", "(())()", "()(())", "()()()"]
  - generateParentheses(n=0) -> [""] (una lista con la cadena vacía)

  Si n es negativo, devuelve una lista vacía.
methodSignature: "public static java.util.List<String> generateParentheses(int pairs)"
className: Solution
estimatedMinutes: 30
difficulty: medium
hints:
  - "Una combinación es válida si en ningún prefijo hay más ')' que '('."
  - "Con backtracking lleva la cuenta de paréntesis abiertos y cerrados usados."
  - "Puedes abrir si abiertos < n, y cerrar si cerrados < abiertos. Probar primero '(' produce el orden pedido."
