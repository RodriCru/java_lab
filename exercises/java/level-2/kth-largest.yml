slug: kth-largest
level: 2
topic: sorting
title: K-ésimo elemento mayor
statement: |
  Devuelve el k-ésimo elemento mayor de `numbers`. Con k=1 se devuelve el máximo. Los
  duplicados cuentan como elementos distintos.

  Ejemplo:
  - kthLargest([3, 2, 1, 5, 6, 4], k=2) -> 5
  - kthLargest([3, 2, 3, 1, 2, 4, 5, 5, 6], k=4) -> 4
  - kthLargest([7], k=1) -> 7

  Se garantiza que `numbers` no es null y que 1 <= k <= numbers.length.
  No modifiques el arreglo de entrada.
methodSignature: "public static int kthLargest(int[] numbers, int k)"
className: Solution
estimatedMinutes: 20
difficulty: medium
hints:
  - "Ordenar todo el arreglo funciona, pero hay una forma mejor con una cola de prioridad."
  - "Mantén un PriorityQueue (min-heap) con tamaño máximo k."
  - "Al terminar, la raíz del heap (peek) es el k-ésimo mayor."
