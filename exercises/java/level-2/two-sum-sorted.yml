referenceSolution: |
  public class Solution {
      public static int[] twoSumSorted(int[] sorted, int target) {
          if (sorted == null || sorted.length < 2) {
              return new int[] {-1, -1};
          }
          int left = 0;
          int right = sorted.length - 1;
          while (left < right) {
              long suma = (long) sorted[left] + sorted[right];
              if (suma == target) {
                  return new int[] {left, right};
              } else if (suma < target) {
                  left++;
              } else {
                  right--;
              }
          }
          return new int[] {-1, -1};
      }
  }
tests: |
  import org.junit.jupiter.api.DisplayName;
  import org.junit.jupiter.api.Test;

  import static org.junit.jupiter.api.Assertions.*;

  class SolutionTest {

      @Test
      @DisplayName("Pareja en los extremos")
      void extremos() {
          assertArrayEquals(new int[] {0, 1}, Solution.twoSumSorted(new int[] {2, 7, 11, 15}, 9));
          assertArrayEquals(new int[] {0, 3}, Solution.twoSumSorted(new int[] {2, 7, 11, 15}, 17));
      }

      @Test
      @DisplayName("Pareja en el interior")
      void interior() {
          assertArrayEquals(new int[] {1, 3}, Solution.twoSumSorted(new int[] {1, 2, 3, 4, 6}, 6));
      }

      @Test
      @DisplayName("Sin pareja devuelve [-1, -1]")
      void sinPareja() {
          assertArrayEquals(new int[] {-1, -1}, Solution.twoSumSorted(new int[] {1, 2, 3}, 10));
      }

      @Test
      @DisplayName("Arreglo vacío, null o de un elemento devuelve [-1, -1]")
      void casosBorde() {
          assertArrayEquals(new int[] {-1, -1}, Solution.twoSumSorted(new int[0], 0));
          assertArrayEquals(new int[] {-1, -1}, Solution.twoSumSorted(null, 0));
          assertArrayEquals(new int[] {-1, -1}, Solution.twoSumSorted(new int[] {5}, 10));
      }

      @Test
      @DisplayName("Dos elementos iguales")
      void iguales() {
          assertArrayEquals(new int[] {0, 1}, Solution.twoSumSorted(new int[] {3, 3}, 6));
      }

      @Test
      @DisplayName("Funciona con negativos")
      void negativos() {
          assertArrayEquals(new int[] {0, 4}, Solution.twoSumSorted(new int[] {-4, -1, 0, 3, 4}, 0));
      }

      @Test
      @DisplayName("No usa el mismo elemento dos veces")
      void mismoElemento() {
          assertArrayEquals(new int[] {-1, -1}, Solution.twoSumSorted(new int[] {2, 5, 9}, 10));
      }

      @Test
      @DisplayName("No desborda con valores enormes")
      void sinDesbordamiento() {
          int m = Integer.MAX_VALUE;
          assertArrayEquals(new int[] {-1, -1}, Solution.twoSumSorted(new int[] {1, m - 1, m}, -5));
      }

      @Test
      @DisplayName("Funciona rápido con 500000 elementos")
      void grande() {
          int[] a = new int[500000];
          for (int i = 0; i < a.length; i++) {
              a[i] = i * 2;
          }
          assertArrayEquals(new int[] {499998, 499999}, Solution.twoSumSorted(a, 1999994));
      }
  }
