slug: two-sum-sorted
level: 2
topic: two-pointers
title: Suma de dos en arreglo ordenado
statement: |
  Dado un arreglo de enteros ordenado de forma ascendente y un objetivo `target`, encuentra
  dos elementos en posiciones distintas que sumen `target` y devuelve sus índices [i, j] con i < j.

  Ejemplo:
  - twoSumSorted(sorted=[2, 7, 11, 15], target=9) -> [0, 1]
  - twoSumSorted(sorted=[1, 2, 3, 4, 6], target=6) -> [1, 3]
  - twoSumSorted(sorted=[1, 2, 3], target=10) -> [-1, -1]

  Si no existe ninguna pareja (o el arreglo es null o tiene menos de 2 elementos), devuelve
  [-1, -1]. En los casos de prueba existe como máximo una pareja válida. Se espera O(n) tiempo
  y O(1) espacio extra.
methodSignature: "public static int[] twoSumSorted(int[] sorted, int target)"
className: Solution
estimatedMinutes: 15
difficulty: medium
hints:
  - "Aprovecha que el arreglo está ordenado: no necesitas un Map."
  - "Coloca un puntero al inicio (left) y otro al final (right) y mira la suma de ambos."
  - "Si la suma es menor que target, avanza left; si es mayor, retrocede right; si es igual, devuelve [left, right]."
