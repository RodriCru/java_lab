title: "Conteo de palabras con Map"
statement: |
  Devuelve un Map con la cantidad de veces que aparece cada palabra del texto.

  Reglas:
  - Las palabras están separadas por uno o más espacios.
  - Se convierten a minúsculas antes de contar.
  - Se ignoran los espacios iniciales, finales y múltiples.
  - No hay signos de puntuación en las entradas.

  Ejemplos:
  - wordCount("Hola hola Mundo") -> {hola=2, mundo=1}
  - wordCount("  a   b  a ") -> {a=2, b=1}
  - wordCount("") -> {} (Map vacío)

  Si el texto es null o vacío, devuelve un Map vacío.
methodSignature: "public static java.util.Map<String, Integer> wordCount(String text)"
