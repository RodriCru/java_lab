title: Registro de temperaturas
statement: |
  Dentro de Solution existe el record CityTemp(String city, double celsius) con un constructor compacto sin validar. Complétalo y después implementa hottestCity.

  Validación del constructor compacto (lanza IllegalArgumentException):
  - city no puede ser null ni estar vacía o contener solo espacios.
  - celsius debe estar entre -90 y 60, ambos incluidos. Cualquier otro valor (incluido NaN) es inválido.

  Reglas de hottestCity(readings):
  - Devuelve el nombre de la ciudad con la temperatura MÁS ALTA.
  - Si hay empate, devuelve la que aparece primero en la lista.
  - Si la lista es null o está vacía, devuelve null.

  Ejemplo:
  - hottestCity([("Madrid", 35.5), ("Sevilla", 41.0), ("Oslo", 12.0)]) -> "Sevilla"
  - hottestCity([("A", 20), ("B", 20)]) -> "A"
  - new CityTemp("X", 100) -> lanza IllegalArgumentException
methodSignature: "public static String hottestCity(java.util.List<CityTemp> readings)"
className: Solution
