  - "Usa city == null || city.isBlank() y la condición !(celsius >= -90 && celsius <= 60), que también atrapa NaN."
  - "Para hottestCity recorre la lista guardando la mejor lectura; solo reemplázala si la nueva es ESTRICTAMENTE mayor."
