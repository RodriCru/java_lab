slug: first-repeated-element
level: 2
topic: structures
title: Primer elemento repetido
statement: |
  Escribe un método que devuelva el primer elemento cuya SEGUNDA aparición ocurre antes que
  la segunda aparición de cualquier otro elemento. Es decir, recorriendo de izquierda a derecha,
  devuelve el primer valor que ya habías visto antes.

  Ejemplo:
  - firstRepeated([2, 1, 3, 1, 2]) -> 1 (el 1 se repite en el índice 3, antes que el 2 en el índice 4)
  - firstRepeated([5, 6, 7]) -> -1
  - firstRepeated([4, 4]) -> 4

  Si no hay elementos repetidos, o el arreglo es null o vacío, devuelve -1.
  Los valores del arreglo pueden ser cualquier entero, incluido -1.
methodSignature: "public static int firstRepeated(int[] numbers)"
className: Solution
estimatedMinutes: 15
difficulty: medium
hints:
  - "Fíjate en la posición de la segunda aparición, no de la primera."
  - "Mantén un Set con lo que ya viste mientras recorres de izquierda a derecha."
  - "En cuanto un elemento ya esté en el Set, ese es el resultado; si terminas el recorrido, devuelve -1."
