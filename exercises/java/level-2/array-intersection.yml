slug: array-intersection
level: 2
topic: structures
title: Intersección de dos arreglos
statement: |
  Escribe un método que devuelva los elementos que aparecen en AMBOS arreglos, sin repetir,
  ordenados de forma ascendente.

  Ejemplo:
  - intersection(first=[1, 2, 2, 1], second=[2, 2]) -> [2]
  - intersection(first=[4, 9, 5], second=[9, 4, 9, 8, 4]) -> [4, 9]
  - intersection(first=[1, 2], second=[3, 4]) -> []

  Si alguno de los arreglos es null, trátalo como vacío. No modifiques los arreglos de entrada.
methodSignature: "public static int[] intersection(int[] first, int[] second)"
className: Solution
estimatedMinutes: 20
difficulty: medium
hints:
  - "Convierte uno de los arreglos en un Set para consultar la pertenencia en O(1)."
  - "Recorre el otro arreglo y agrega a un segundo Set los elementos que estén en el primero (así no se repiten)."
  - "Un TreeSet mantiene los elementos ordenados; al final copia el resultado a un int[]."
