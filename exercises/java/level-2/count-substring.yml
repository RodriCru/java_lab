referenceSolution: |
  public class Solution {
      public static int countSubstring(String text, String pattern) {
          if (text == null || pattern == null || pattern.isEmpty()) return 0;
          int total = 0;
          int pos = text.indexOf(pattern);
          while (pos >= 0) {
              total++;
              pos = text.indexOf(pattern, pos + 1);
          }
          return total;
      }
  }
tests: |
  import org.junit.jupiter.api.DisplayName;
  import org.junit.jupiter.api.Test;
  import java.util.*;
  import static org.junit.jupiter.api.Assertions.*;

  class SolutionTest {

      @Test
      @DisplayName("Solapadas aaa con aa")
      void t0() {
          assertEquals(2, Solution.countSubstring("aaa", "aa"));
      }

      @Test
      @DisplayName("abababa con aba")
      void t1() {
          assertEquals(3, Solution.countSubstring("abababa", "aba"));
      }

      @Test
      @DisplayName("Sin apariciones")
      void t2() {
          assertEquals(0, Solution.countSubstring("hola", "x"));
      }

      @Test
      @DisplayName("Patrón vacío devuelve 0")
      void t3() {
          assertEquals(0, Solution.countSubstring("hola", ""));
      }

      @Test
      @DisplayName("Null devuelve 0")
      void t4() {
          assertEquals(0, Solution.countSubstring(null, "a"));
          assertEquals(0, Solution.countSubstring("a", null));
      }

      @Test
      @DisplayName("Patrón más largo que el texto")
      void t5() {
          assertEquals(0, Solution.countSubstring("ab", "abc"));
      }

      @Test
      @DisplayName("Distingue mayúsculas")
      void t6() {
          assertEquals(0, Solution.countSubstring("aaa", "AA"));
        assertEquals(2, Solution.countSubstring("aAaA", "aA"));
      }

      @Test
      @DisplayName("Texto grande")
      void t7() {
          StringBuilder sb = new StringBuilder();
          for (int i = 0; i < 100000; i++) sb.append('a');
          assertEquals(99999, Solution.countSubstring(sb.toString(), "aa"));
      }
  }
