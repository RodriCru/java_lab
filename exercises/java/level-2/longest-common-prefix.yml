slug: longest-common-prefix
level: 2
topic: strings
title: "Prefijo común más largo"
statement: |
  Dado un arreglo de cadenas, devuelve el prefijo común más largo a todas ellas.

  Ejemplos:
  - longestCommonPrefix(["flower", "flow", "flight"]) -> "fl"
  - longestCommonPrefix(["dog", "racecar", "car"]) -> ""
  - longestCommonPrefix(["alone"]) -> "alone"

  Devuelve "" si no hay prefijo común, si el arreglo es null o está vacío.
methodSignature: "public static String longestCommonPrefix(String[] words)"
className: Solution
estimatedMinutes: 15
difficulty: medium
hints:
  - "Considera el caso de arreglo vacío o null antes de empezar."
  - "Toma la primera palabra como candidata a prefijo."
  - "Recorre las demás palabras y acorta el prefijo hasta que cada palabra empiece con él."
starterCode: |
  public class Solution {
