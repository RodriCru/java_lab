          // Tu código aquí
          return "x";
      }
  }
referenceSolution: |
  public class Solution {
      public static String longestCommonPrefix(String[] words) {
          if (words == null || words.length == 0) return "";
          String prefijo = words[0];
          for (int i = 1; i < words.length; i++) {
              while (!words[i].startsWith(prefijo)) {
                  prefijo = prefijo.substring(0, prefijo.length() - 1);
                  if (prefijo.isEmpty()) return "";
              }
          }
          return prefijo;
      }
  }
tests: |
  import org.junit.jupiter.api.DisplayName;
  import org.junit.jupiter.api.Test;
  import java.util.*;
  import static org.junit.jupiter.api.Assertions.*;

  class SolutionTest {

      @Test
      @DisplayName("Prefijo común fl")
      void t0() {
          assertEquals("fl", Solution.longestCommonPrefix(new String[] {"flower", "flow", "flight"}));
      }

      @Test
      @DisplayName("Sin prefijo común")
      void t1() {
          assertEquals("", Solution.longestCommonPrefix(new String[] {"dog", "racecar", "car"}));
      }

      @Test
      @DisplayName("Un solo elemento")
      void t2() {
          assertEquals("alone", Solution.longestCommonPrefix(new String[] {"alone"}));
      }

      @Test
      @DisplayName("Arreglo vacío o null")
      void t3() {
          assertEquals("", Solution.longestCommonPrefix(new String[0]));
          assertEquals("", Solution.longestCommonPrefix(null));
      }

      @Test
      @DisplayName("Contiene una cadena vacía")
      void t4() {
          assertEquals("", Solution.longestCommonPrefix(new String[] {"abc", "", "abd"}));
      }

      @Test
      @DisplayName("Cadenas idénticas")
      void t5() {
          assertEquals("abc", Solution.longestCommonPrefix(new String[] {"abc", "abc", "abc"}));
      }

      @Test
      @DisplayName("Una palabra es prefijo de las otras")
      void t6() {
          assertEquals("ab", Solution.longestCommonPrefix(new String[] {"abcd", "ab", "abxyz"}));
      }
  }
