title: Métodos de pago (contrato abstracto)
statement: |
  Crea la clase abstracta `Payment(ABC)` con el método abstracto `pay(amount)`, que devuelve un texto. Implementa `Cash`, que siempre devuelve `"Pagado {amount} en efectivo"`, y `CreditCard(limite)`: si el importe supera el límite devuelve `"Rechazado"`, y si no descuenta el importe del límite y devuelve `"Pagado {amount} con tarjeta"`.

  Ejemplos:
  - `Cash().pay(50) -> "Pagado 50 en efectivo"`
  - `CreditCard(100).pay(30) -> "Pagado 30 con tarjeta"`
  - `CreditCard(100).pay(150) -> "Rechazado"`

methodSignature: "class Payment(ABC):"
estimatedMinutes: 12
difficulty: medium
hints:
- "Usa `from abc import ABC, abstractmethod` y decora `pay` con `@abstractmethod`."
- "En `CreditCard`, resta el importe al límite solo cuando el pago se acepta."
- 'Las f-strings facilitan el texto exacto: `f"Pagado {amount} con tarjeta"`.'
