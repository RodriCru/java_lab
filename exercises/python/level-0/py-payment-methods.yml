referenceSolution: |
  from abc import ABC, abstractmethod


  class Payment(ABC):
      @abstractmethod
      def pay(self, amount):
          ...


  class Cash(Payment):
      def pay(self, amount):
          return f"Pagado {amount} en efectivo"


  class CreditCard(Payment):
      def __init__(self, limite):
          self.limite = limite

      def pay(self, amount):
          if amount > self.limite:
              return "Rechazado"
          self.limite -= amount
          return f"Pagado {amount} con tarjeta"
tests: |
  from solution import Payment, Cash, CreditCard


  def test_cash_paga():
      assert Cash().pay(50) == "Pagado 50 en efectivo"


  def test_tarjeta_dentro_del_limite():
      assert CreditCard(100).pay(30) == "Pagado 30 con tarjeta"


  def test_tarjeta_rechaza_si_supera():
      assert CreditCard(100).pay(150) == "Rechazado"


  def test_tarjeta_descuenta_del_limite():
      t = CreditCard(100)
      t.pay(40)
      assert t.limite == 60


  def test_dos_pagos_seguidos():
      t = CreditCard(100)
      t.pay(60)
      assert t.pay(60) == "Rechazado"


  def test_payment_es_abstracto():
      try:
          Payment()
          creado = True
      except TypeError:
          creado = False
      assert not creado
