title: Bebidas con método plantilla
statement: |
  En el patrón método plantilla la clase base fija el orden de los pasos y las hijas rellenan los que cambian. La clase abstracta `Beverage` tiene `prepare()`, que ejecuta hervir agua, `brew()`, servir y `add_condiments()` en ese orden, uniendo los pasos con `" | "`. `brew()` y `add_condiments()` son abstractos. Implementa `Tea` y `Coffee`.

  Ejemplos:
  - `Tea().prepare() -> "Hervir agua | Infusionar té | Servir en taza | Añadir limón"`
  - `Coffee().prepare() -> "Hervir agua | Colar café | Servir en taza | Añadir azúcar"`

methodSignature: "class Beverage(ABC):"
estimatedMinutes: 12
difficulty: medium
hints:
- "`boil_water` y `pour` traen el texto fijo desde la base."
- "Las subclases solo implementan `brew` y `add_condiments`."
- 'Junta los cuatro textos con `" | ".join([...])`.'
