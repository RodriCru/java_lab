language: python
slug: py-print-one-to-n
level: 0
topic: basics
title: Imprimir del 1 hasta n
statement: |
  Escribe una función que muestre en la consola los números del 1 hasta n, uno por línea. Si n es menor que 1, no debe imprimir nada.

  Ejemplos:
  - `print_one_to_n(3) imprime: 1, 2 y 3, uno por línea`
  - `print_one_to_n(1) imprime: 1`
  - `print_one_to_n(0) imprime: (nada)`

methodSignature: print_one_to_n(n)
estimatedMinutes: 5
difficulty: easy
hints:
- Recorre los números con un for y range(1, n + 1).
- range(1, n + 1) llega hasta n incluido, porque el límite superior no se incluye.
starterCode: |
  def print_one_to_n(n):
      # Tu código aquí
      return
referenceSolution: |
  def print_one_to_n(n):
      for i in range(1, n + 1):
          print(i)
tests: |
  from solution import print_one_to_n

  def test_tres(capsys):
      print_one_to_n(3)
      captured = capsys.readouterr()
      assert captured.out == "1\n2\n3\n"

  def test_uno(capsys):
      print_one_to_n(1)
      captured = capsys.readouterr()
      assert captured.out == "1\n"

  def test_cero_no_imprime_nada(capsys):
      print_one_to_n(0)
      captured = capsys.readouterr()
      assert captured.out == ""

  def test_cinco_termina_en_cinco(capsys):
      print_one_to_n(5)
      captured = capsys.readouterr()
      assert captured.out.splitlines()[-1] == "5"

  def test_negativo_no_imprime_nada(capsys):
      print_one_to_n(-3)
      captured = capsys.readouterr()
      assert captured.out == ""
