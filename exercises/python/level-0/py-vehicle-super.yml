referenceSolution: |
  class Vehicle:
      def __init__(self, marca, ruedas):
          self.marca = marca
          self.ruedas = ruedas

      def describe(self):
          return f"{self.marca} con {self.ruedas} ruedas"


  class Car(Vehicle):
      def __init__(self, marca, puertas):
          super().__init__(marca, 4)
          self.puertas = puertas

      def describe(self):
          return super().describe() + f" y {self.puertas} puertas"
tests: |
  from solution import Vehicle, Car


  def test_describe_vehicle():
      assert Vehicle("Bici", 2).describe() == "Bici con 2 ruedas"


  def test_car_fija_cuatro_ruedas():
      assert Car("Toyota", 5).ruedas == 4


  def test_describe_car():
      assert Car("Toyota", 5).describe() == "Toyota con 4 ruedas y 5 puertas"


  def test_car_guarda_marca():
      assert Car("Ford", 3).marca == "Ford"


  def test_car_es_vehicle():
      assert isinstance(Car("Fiat", 4), Vehicle)
