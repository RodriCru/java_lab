title: Vehículos y super()
statement: |
  `super()` llama al método de la clase padre, útil para reutilizar su inicialización. Crea `Vehicle(marca, ruedas)` con un método `describe()` que devuelva `"marca con N ruedas"`. La clase `Car(marca, puertas)` hereda de `Vehicle`, llama a `super().__init__` con 4 ruedas y sobrescribe `describe()` añadiendo `" y M puertas"`.

  Ejemplos:
  - `Vehicle("Bici", 2).describe() -> "Bici con 2 ruedas"`
  - `Car("Toyota", 5).describe() -> "Toyota con 4 ruedas y 5 puertas"`

methodSignature: "class Vehicle:"
estimatedMinutes: 9
difficulty: medium
hints:
- "En `Car.__init__` llama primero a `super().__init__(marca, 4)`."
- "En `Car.describe` reutiliza `super().describe()` y concatena el resto."
- "Todas las ruedas del coche son 4, por eso no se reciben por parámetro."
