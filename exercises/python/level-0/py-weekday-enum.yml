referenceSolution: |
  from enum import Enum


  class Weekday(Enum):
      LUNES = 1
      MARTES = 2
      MIERCOLES = 3
      JUEVES = 4
      VIERNES = 5
      SABADO = 6
      DOMINGO = 7

      def is_weekend(self):
          return self in (Weekday.SABADO, Weekday.DOMINGO)
tests: |
  from solution import Weekday

  def test_sabado_es_fin_de_semana():
      assert Weekday.SABADO.is_weekend() is True

  def test_domingo_es_fin_de_semana():
      assert Weekday.DOMINGO.is_weekend() is True

  def test_lunes_no_es_fin_de_semana():
      assert Weekday.LUNES.is_weekend() is False

  def test_viernes_no_es_fin_de_semana():
      assert Weekday.VIERNES.is_weekend() is False

  def test_solo_dos_dias_son_fin_de_semana():
      fines = [dia for dia in Weekday if dia.is_weekend()]
      assert fines == [Weekday.SABADO, Weekday.DOMINGO]
