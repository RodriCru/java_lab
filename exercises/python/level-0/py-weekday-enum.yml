statement: |
  Un Enum puede tener métodos que se leen sobre cada miembro. Escribe un Enum Weekday con los días LUNES, MARTES, MIERCOLES, JUEVES, VIERNES, SABADO y DOMINGO, y un método is_weekend() que devuelva True si el día es sábado o domingo, y False en cualquier otro caso.

  Ejemplos:
  - `Weekday.SABADO.is_weekend() -> True`
  - `Weekday.DOMINGO.is_weekend() -> True`
  - `Weekday.LUNES.is_weekend() -> False`

