title: Semáforo con Enum
statement: |
  Un Enum agrupa un conjunto fijo de valores con nombre; sus miembros son constantes y se comparan con is. Escribe un Enum TrafficLight con los miembros ROJO, AMARILLO y VERDE y un atributo siguiente que devuelva la luz que viene después: tras ROJO viene VERDE, tras VERDE viene AMARILLO y tras AMARILLO vuelve a ROJO.

  Ejemplos:
  - `TrafficLight.ROJO.siguiente -> TrafficLight.VERDE`
  - `TrafficLight.VERDE.siguiente -> TrafficLight.AMARILLO`
  - `TrafficLight.AMARILLO.siguiente -> TrafficLight.ROJO`

methodSignature: "class TrafficLight(Enum):"
