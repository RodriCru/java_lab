referenceSolution: |
  from enum import Enum


  class TrafficLight(Enum):
      ROJO = 1
      AMARILLO = 2
      VERDE = 3

      @property
      def siguiente(self):
          if self is TrafficLight.ROJO:
              return TrafficLight.VERDE
          if self is TrafficLight.VERDE:
              return TrafficLight.AMARILLO
          return TrafficLight.ROJO
tests: |
  from solution import TrafficLight

  def test_rojo_sigue_verde():
      assert TrafficLight.ROJO.siguiente is TrafficLight.VERDE

  def test_verde_sigue_amarillo():
      assert TrafficLight.VERDE.siguiente is TrafficLight.AMARILLO

  def test_amarillo_sigue_rojo():
      assert TrafficLight.AMARILLO.siguiente is TrafficLight.ROJO

  def test_ciclo_completo_vuelve_al_inicio():
      luz = TrafficLight.ROJO
      for _ in range(3):
          luz = luz.siguiente
      assert luz is TrafficLight.ROJO

  def test_miembros_del_enum():
      assert [luz.name for luz in TrafficLight] == ["ROJO", "AMARILLO", "VERDE"]
