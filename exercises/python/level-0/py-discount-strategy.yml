title: Estrategia de descuento
statement: |
  El patrón estrategia recibe el cálculo variable como un objeto aparte. Crea `Checkout(estrategia)` con un método `total(amount)` que delegue en `estrategia.apply(amount)`. Implementa `NoDiscount`, que devuelve el importe tal cual, y `PercentDiscount(percent)`, que resta el porcentaje indicado.

  Ejemplos:
  - `Checkout(NoDiscount()).total(200) -> 200`
  - `Checkout(PercentDiscount(10)).total(200) -> 180`
  - `Checkout(PercentDiscount(0)).total(50) -> 50`

