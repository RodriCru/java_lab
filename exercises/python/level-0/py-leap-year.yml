language: python
slug: py-leap-year
level: 0
topic: operators-decisions
title: ¿Es un año bisiesto?
statement: |
  Escribe una función que devuelva True si un año es bisiesto y False en caso contrario. Un año es bisiesto si es divisible por 4, excepto los que son divisibles por 100, salvo que además sean divisibles por 400.

  Ejemplos:
  - `is_leap_year(2024) -> True`
  - `is_leap_year(2023) -> False`
  - `is_leap_year(1900) -> False`
  - `is_leap_year(2000) -> True`

methodSignature: is_leap_year(year)
estimatedMinutes: 5
difficulty: medium
hints:
- El operador % da el resto de la división; un año es divisible por n cuando year % n == 0.
- Combina las condiciones con and, or y not respetando la regla de los 100 y los 400.
starterCode: |
  def is_leap_year(year):
      # Tu código aquí
      return False
referenceSolution: |
  def is_leap_year(year):
      return year % 4 == 0 and (year % 100 != 0 or year % 400 == 0)
tests: |
  from solution import is_leap_year

  def test_bisiesto_normal():
      assert is_leap_year(2024) is True

  def test_no_bisiesto():
      assert is_leap_year(2023) is False

  def test_divisible_por_100_no_bisiesto():
      assert is_leap_year(1900) is False

  def test_divisible_por_400_bisiesto():
      assert is_leap_year(2000) is True

  def test_otro_bisiesto():
      assert is_leap_year(2016) is True

  def test_anio_cero():
      assert is_leap_year(0) is True
