title: Alcance singleton
statement: |
  Un objeto con alcance *singleton* se crea una sola vez y siempre se devuelve la misma instancia. Completa `Registro` para que, sin importar cuántas veces se llame a `obtener_registro()`, todas apunten al mismo objeto y compartan sus datos.

  Ejemplos:
  - `obtener_registro() is obtener_registro() -> True`
  - tras `guardar("a", 1)` en una referencia, `obtener("a")` en otra devuelve `1`

methodSignature: "class Registro:"
estimatedMinutes: 9
difficulty: medium
hints:
- Guarda la instancia única en un atributo de clase (por ejemplo _instancia) y créala solo si es None.
- Puedes controlar la creación sobrescribiendo __new__ o devolviendo siempre la misma instancia desde obtener_registro.
- limpiar() debe vaciar el diccionario de datos.
