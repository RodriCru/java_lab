referenceSolution: |
  class Registro:
      _instancia = None

      def __new__(cls):
          if cls._instancia is None:
              cls._instancia = super().__new__(cls)
              cls._instancia.datos = {}
          return cls._instancia

      def guardar(self, clave, valor):
          self.datos[clave] = valor

      def obtener(self, clave):
          return self.datos.get(clave)

      def limpiar(self):
          self.datos.clear()


  def obtener_registro():
      return Registro()
tests: |
  from solution import Registro, obtener_registro

  def test_misma_instancia():
      assert obtener_registro() is obtener_registro()

  def test_comparte_el_estado():
      uno = obtener_registro()
      otro = obtener_registro()
      uno.limpiar()
      uno.guardar("a", 1)
      assert otro.obtener("a") == 1

  def test_limpiar_borra_los_datos():
      registro = obtener_registro()
      registro.guardar("x", 9)
      registro.limpiar()
      assert registro.obtener("x") is None

  def test_es_una_instancia_del_registro():
      assert isinstance(obtener_registro(), Registro)
