language: python
slug: py-animal-sounds
level: 0
topic: oop-basics
title: Sonidos de animales (polimorfismo)
statement: |
  El polimorfismo permite que objetos de clases distintas respondan al mismo método con su propio comportamiento. Crea una clase base `Animal` con un método `speak()` que devuelva `"..."`. Después crea `Perro` y `Gato`, que heredan de `Animal` y sobrescriben `speak()` para devolver `"Guau"` y `"Miau"`.

  Ejemplos:
  - `Animal().speak() -> "..."`
  - `Perro().speak() -> "Guau"`
  - `Gato().speak() -> "Miau"`

methodSignature: "class Animal:"
estimatedMinutes: 8
difficulty: medium
hints:
- "Una subclase hereda con `class Perro(Animal):`."
- "Sobrescribir es definir el mismo método `speak` en la subclase."
- "Usa `return` para devolver el texto; imprimir no sirve para el test."
starterCode: |
