referenceSolution: |
  class Animal:
      def speak(self):
          return "..."


  class Perro(Animal):
      def speak(self):
          return "Guau"


  class Gato(Animal):
      def speak(self):
          return "Miau"
tests: |
  from solution import Animal, Perro, Gato


  def test_animal_base():
      assert Animal().speak() == "..."


  def test_perro_ladra():
      assert Perro().speak() == "Guau"


  def test_gato_maulla():
      assert Gato().speak() == "Miau"


  def test_son_subclases():
      assert isinstance(Perro(), Animal) and isinstance(Gato(), Animal)


  def test_polimorfismo_en_lista():
      animales = [Perro(), Gato(), Perro()]
      assert [a.speak() for a in animales] == ["Guau", "Miau", "Guau"]
