referenceSolution: |
  class Contenedor:
      def __init__(self):
          self._fabricas = {}
          self._singletons = {}

      def registrar(self, nombre, fabrica, singleton=False):
          self._fabricas[nombre] = (fabrica, singleton)

      def resolver(self, nombre):
          fabrica, singleton = self._fabricas[nombre]
          if singleton:
              if nombre not in self._singletons:
                  self._singletons[nombre] = fabrica(self)
              return self._singletons[nombre]
          return fabrica(self)
tests: |
  from solution import Contenedor

  def test_resuelve_una_fabrica_simple():
      contenedor = Contenedor()
      contenedor.registrar("saludo", lambda cont: "hola")
      assert contenedor.resolver("saludo") == "hola"

  def test_singleton_devuelve_la_misma_instancia():
      contenedor = Contenedor()
      contenedor.registrar("obj", lambda cont: object(), singleton=True)
      assert contenedor.resolver("obj") is contenedor.resolver("obj")

  def test_transitorio_crea_cada_vez():
      contenedor = Contenedor()
      contenedor.registrar("obj", lambda cont: object())
      assert contenedor.resolver("obj") is not contenedor.resolver("obj")

  def test_resuelve_dependencias_anidadas():
      contenedor = Contenedor()
      contenedor.registrar("doble", lambda cont: 2)
      contenedor.registrar("cuadruple", lambda cont: cont.resolver("doble") * 2)
      assert contenedor.resolver("cuadruple") == 4
