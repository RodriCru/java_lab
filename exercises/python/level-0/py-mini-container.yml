title: Contenedor mínimo de dependencias
statement: |
  Un contenedor guarda **fábricas** y las resuelve cuando se le piden. Cada fábrica recibe el propio contenedor como argumento, así puede resolver sus dependencias. Si se registra como singleton, la instancia se crea una sola vez.

  Ejemplos:
  - `c.registrar("doble", lambda cont: 2); c.resolver("doble") -> 2`
  - `c.registrar("obj", lambda cont: object(), singleton=True)` -> `c.resolver("obj") is c.resolver("obj") -> True`

methodSignature: "class Contenedor:"
estimatedMinutes: 10
difficulty: medium
hints:
- Guarda las fábricas junto a si son singleton, por ejemplo como tupla (fabrica, singleton).
- 'resolver debe llamar a la fábrica pasándole self: fabrica(self).'
- Si es singleton, guárdala en un diccionario aparte la primera vez y devuélvela siempre.
