language: python
slug: py-unique-count
level: 0
topic: collections
title: Contar valores únicos
statement: |
  Escribe una función que devuelva cuántos valores distintos hay en una lista.

  Ejemplos:
  - `unique_count([3, 1, 3, 2, 1]) -> 3`
  - `unique_count([]) -> 0`
  - `unique_count(["a", "a", "a"]) -> 1`

methodSignature: unique_count(valores)
estimatedMinutes: 4
difficulty: easy
hints:
- Un conjunto (set) guarda valores sin repetir; convertir una lista a set elimina los duplicados.
- La cantidad de elementos de un conjunto se obtiene con len(...).
starterCode: |
  def unique_count(valores):
      # Tu código aquí
      return 0
referenceSolution: |
  def unique_count(valores):
      return len(set(valores))
tests: |
  from solution import unique_count

  def test_lista_con_repetidos():
      assert unique_count([3, 1, 3, 2, 1]) == 3

  def test_vacia():
      assert unique_count([]) == 0

  def test_todos_iguales():
      assert unique_count(["a", "a", "a"]) == 1

  def test_sin_repetidos():
      assert unique_count([1, 2, 3, 4]) == 4

  def test_un_solo_elemento():
      assert unique_count([7]) == 1
