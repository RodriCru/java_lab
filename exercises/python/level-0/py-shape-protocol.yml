title: Área con Protocol (duck typing)
statement: |
  `typing.Protocol` describe un contrato por la forma, sin necesidad de heredar: cualquier objeto con un método `area()` lo cumple. Define el protocolo `Shape` con `area()` e implementa `Square(lado)` y `Triangle(base, altura)`. Escribe `total_area(shapes)`, que suma las áreas.

  Ejemplos:
  - `Square(3).area() -> 9`
  - `Triangle(4, 5).area() -> 10.0`
  - `total_area([Square(2), Square(3)]) -> 13`

methodSignature: "class Shape(Protocol):"
estimatedMinutes: 10
difficulty: medium
hints:
- "Importa `from typing import Protocol`."
- "El protocolo solo declara el método; no hace falta que las clases lo hereden."
- "Cualquier objeto con `area()` sirve, gracias al duck typing."
