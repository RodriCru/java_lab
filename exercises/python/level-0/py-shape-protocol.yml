referenceSolution: |
  from typing import Protocol


  class Shape(Protocol):
      def area(self):
          ...


  class Square:
      def __init__(self, lado):
          self.lado = lado

      def area(self):
          return self.lado ** 2


  class Triangle:
      def __init__(self, base, altura):
          self.base = base
          self.altura = altura

      def area(self):
          return self.base * self.altura / 2


  def total_area(shapes):
      return sum(s.area() for s in shapes)
tests: |
  from solution import Shape, Square, Triangle, total_area


  def test_area_cuadrado():
      assert Square(3).area() == 9


  def test_area_triangulo():
      assert Triangle(4, 5).area() == 10


  def test_total_area():
      assert total_area([Square(2), Square(3)]) == 13


  def test_total_area_triangulos():
      assert total_area([Triangle(2, 2), Triangle(6, 1)]) == 5


  def test_duck_typing_con_otra_clase():
      class Circulo:
          def area(self):
              return 3

      assert total_area([Circulo()]) == 3
