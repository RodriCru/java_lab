title: Contador con límites
statement: |
  El encapsulamiento cuida que los datos de un objeto siempre sean válidos. Crea una clase `Counter` que guarde un valor dentro de un rango `[minimo, maximo]` y empiece en `minimo`. `increment(n)` sube el valor sin superar el máximo y `decrement(n)` lo baja sin bajar del mínimo; ambos devuelven el valor actual.

  Ejemplos:
  - `Counter(0, 10).increment(3) -> 3`
  - `Counter(0, 10).increment(20) -> 10`
  - `Counter(5, 20).decrement(1) -> 5`

