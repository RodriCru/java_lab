referenceSolution: |
  class Counter:
      def __init__(self, minimo=0, maximo=10, valor=None):
          self.minimo = minimo
          self.maximo = maximo
          self.valor = minimo if valor is None else valor

      def increment(self, n=1):
          self.valor = min(self.maximo, self.valor + n)
          return self.valor

      def decrement(self, n=1):
          self.valor = max(self.minimo, self.valor - n)
          return self.valor
tests: |
  from solution import Counter


  def test_valor_inicial():
      assert Counter(3, 8).valor == 3


  def test_incremento_normal():
      assert Counter(0, 10).increment(3) == 3


  def test_incremento_no_pasa_del_maximo():
      assert Counter(0, 10).increment(20) == 10


  def test_decremento_no_baja_del_minimo():
      c = Counter(0, 10)
      c.increment(5)
      assert c.decrement(9) == 0


  def test_secuencia_de_operaciones():
      c = Counter(1, 5)
      c.increment(2)
      c.increment(2)
      assert c.decrement(1) == 4
