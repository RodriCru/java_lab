title: Coste de vehículos (clase abstracta)
statement: |
  Una clase abstracta marca un contrato que las hijas deben cumplir. Crea `Vehicle(ABC)` con un atributo `nombre` y un método abstracto `cost()`. Implementa `Bicycle(nombre)`, cuyo `cost()` es `0`, y `Truck(nombre, toneladas)`, cuyo `cost()` es `100` por tonelada. Añade `total_cost(vehicles)`, que suma el coste de todos.

  Ejemplos:
  - `Bicycle("BMX").cost() -> 0`
  - `Truck("Volvo", 3).cost() -> 300`
  - `total_cost([Bicycle("BMX"), Truck("Volvo", 2)]) -> 200`

methodSignature: "class Vehicle(ABC):"
