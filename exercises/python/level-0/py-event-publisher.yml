title: Publicador de eventos (observador)
statement: |
  Implementa el patrón **observador**: un publicador al que varios manejadores se **suscriben** a un evento, y al **publicar** se avisa a todos los suscritos de ese evento pasándoles los datos.

  Ejemplos:
  - tras `suscribir("saludo", f)` y `publicar("saludo", "hola")`, `f` recibe `"hola"`
  - `publicar("otro")` sin suscriptores no falla

methodSignature: "class PublicadorDeEventos:"
estimatedMinutes: 10
difficulty: medium
hints:
- Guarda los manejadores en un diccionario cuyo valor sea una lista por evento.
- En suscribir, usa setdefault para añadir el manejador a la lista del evento.
- En publicar, recorre los manejadores del evento con un bucle y llámales pasando los datos.
