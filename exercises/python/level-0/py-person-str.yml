referenceSolution: |
  class Person:
      def __init__(self, nombre, edad):
          self.nombre = nombre
          self.edad = edad

      def __str__(self):
          return f"{self.nombre} ({self.edad} años)"
tests: |
  from solution import Person


  def test_str_basico():
      assert str(Person("Ana", 30)) == "Ana (30 años)"


  def test_str_con_un_digito():
      assert str(Person("Luis", 7)) == "Luis (7 años)"


  def test_f_string_usa_str():
      p = Person("Eva", 25)
      assert f"{p}" == "Eva (25 años)"


  def test_guarda_atributos():
      p = Person("Mario", 40)
      assert p.nombre == "Mario" and p.edad == 40
