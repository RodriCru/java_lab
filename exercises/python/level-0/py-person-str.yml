title: Texto de una persona (__str__)
statement: |
  El método especial `__str__` decide cómo se convierte un objeto en texto. Crea una clase `Person` con los atributos `nombre` y `edad`; su `__str__` debe devolver el nombre, un paréntesis, la edad, un espacio y la palabra `años`, así: `Nombre (edad años)`.

  Ejemplos:
  - `str(Person("Ana", 30)) -> "Ana (30 años)"`
  - `str(Person("Luis", 7)) -> "Luis (7 años)"`

methodSignature: "class Person:"
estimatedMinutes: 6
difficulty: medium
hints:
- "`__str__` no lleva parámetros además de `self` y debe devolver un `str`."
- 'Con una f-string puedes interpolar: `f"{self.nombre} ({self.edad} años)"`.'
- "Guarda los datos en `__init__` para poder usarlos después."
