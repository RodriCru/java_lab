referenceSolution: |
  class RepositorioEnMemoria:
      def __init__(self):
          self.datos = {}

      def guardar(self, clave, valor):
          self.datos[clave] = valor

      def obtener(self, clave):
          return self.datos.get(clave)


  class ServicioDeUsuarios:
      def __init__(self, repositorio):
          self.repositorio = repositorio

      def registrar(self, nombre):
          valor = nombre.upper()
          self.repositorio.guardar(nombre, valor)
          return valor

      def buscar(self, nombre):
          return self.repositorio.obtener(nombre)
tests: |
  from solution import RepositorioEnMemoria, ServicioDeUsuarios

  def test_registrar_devuelve_el_valor_guardado():
      servicio = ServicioDeUsuarios(RepositorioEnMemoria())
      assert servicio.registrar("ana") == "ANA"

  def test_buscar_devuelve_none_si_no_existe():
      servicio = ServicioDeUsuarios(RepositorioEnMemoria())
      assert servicio.buscar("luis") is None

  def test_usa_la_dependencia_inyectada():
      repo = RepositorioEnMemoria()
      servicio = ServicioDeUsuarios(repo)
      servicio.registrar("bob")
      assert repo.obtener("bob") == "BOB"

  def test_dos_servicios_comparten_repositorio():
      repo = RepositorioEnMemoria()
      uno = ServicioDeUsuarios(repo)
      otro = ServicioDeUsuarios(repo)
      uno.registrar("x")
      assert otro.buscar("x") == "X"
