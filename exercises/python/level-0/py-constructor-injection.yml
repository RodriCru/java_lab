title: Inyección por constructor
statement: |
  Un servicio debe recibir su dependencia (el repositorio) en el constructor, en vez de crearla él mismo. Completa `ServicioDeUsuarios` para que use el repositorio inyectado: `registrar(nombre)` guarda el nombre en mayúsculas y devuelve ese valor; `buscar(nombre)` devuelve lo guardado o `None`.

  Ejemplos:
  - `ServicioDeUsuarios(repo).registrar("ana") -> "ANA"`
  - `ServicioDeUsuarios(repo).buscar("luis") -> None`

methodSignature: "class ServicioDeUsuarios:"
estimatedMinutes: 8
difficulty: medium
hints:
- 'Guarda el repositorio recibido en el constructor: self.repositorio = repositorio.'
- Para registrar, guarda nombre.upper() con el método guardar del repositorio y devuélvelo.
- Para buscar, delega en el método obtener del repositorio.
