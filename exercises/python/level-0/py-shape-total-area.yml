title: Área total de figuras
statement: |
  Una clase base define el contrato que comparten sus hijas. Crea `Shape` con un método `area()`, y dos subclases: `Rectangle(ancho, alto)` y `Circle(radio)`. Después escribe `total_area(shapes)`, que suma el área de todas las figuras recibidas. Usa `math.pi` para el círculo.

  Ejemplos:
  - `Rectangle(2, 3).area() -> 6`
  - `round(Circle(1).area(), 2) -> 3.14`
  - `total_area([Rectangle(2, 3), Rectangle(1, 1)]) -> 7`

