referenceSolution: |
  import math


  class Shape:
      def area(self):
          raise NotImplementedError


  class Rectangle(Shape):
      def __init__(self, ancho, alto):
          self.ancho = ancho
          self.alto = alto

      def area(self):
          return self.ancho * self.alto


  class Circle(Shape):
      def __init__(self, radio):
          self.radio = radio

      def area(self):
          return math.pi * self.radio ** 2


  def total_area(shapes):
      return sum(s.area() for s in shapes)
tests: |
  import math

  from solution import Shape, Rectangle, Circle, total_area


  def test_area_rectangulo():
      assert Rectangle(2, 3).area() == 6


  def test_area_circulo():
      assert round(Circle(1).area(), 2) == 3.14


  def test_es_subclase():
      assert isinstance(Rectangle(2, 2), Shape) and isinstance(Circle(1), Shape)


  def test_total_area_vacia():
      assert total_area([]) == 0


  def test_total_area_mezcla():
      figuras = [Rectangle(2, 3), Rectangle(1, 1), Circle(2)]
      assert round(total_area(figuras), 2) == round(7 + math.pi * 4, 2)
