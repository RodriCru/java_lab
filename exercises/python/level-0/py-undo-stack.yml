referenceSolution: |
  class UndoStack:
      def __init__(self):
          self._items = []

      def push(self, valor):
          self._items.append(valor)

      def pop(self):
          if not self._items:
              return None
          return self._items.pop()

      def peek(self):
          if not self._items:
              return None
          return self._items[-1]
tests: |
  from solution import UndoStack

  def test_peek_devuelve_el_ultimo():
      pila = UndoStack()
      pila.push("a")
      pila.push("b")
      assert pila.peek() == "b"

  def test_pop_devuelve_el_ultimo():
      pila = UndoStack()
      pila.push("a")
      pila.push("b")
      assert pila.pop() == "b"

  def test_orden_lifo():
      pila = UndoStack()
      pila.push("primero")
      pila.push("segundo")
      pila.push("tercero")
      assert [pila.pop(), pila.pop(), pila.pop()] == ["tercero", "segundo", "primero"]

  def test_pop_en_vacia_devuelve_none():
      pila = UndoStack()
      assert pila.pop() is None

  def test_peek_en_vacia_devuelve_none():
      pila = UndoStack()
      assert pila.peek() is None
