title: Una pila de deshacer
statement: |
  Una pila (LIFO) guarda elementos y siempre saca el último que entró. Crea la clase `UndoStack` con tres métodos:

  - `push(valor)`: apila un valor.
  - `pop()`: saca y devuelve el último valor, o `None` si la pila está vacía.
  - `peek()`: devuelve el último valor sin sacarlo, o `None` si está vacía.

  Ejemplos:
  - `pila.push("a"); pila.peek() -> "a"`
  - `pila.push("b"); pila.pop() -> "b"`

methodSignature: 'class UndoStack:'
