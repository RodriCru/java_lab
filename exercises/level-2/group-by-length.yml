title: Agrupar palabras por longitud
statement: |
  Escribe un método que agrupe una lista de palabras según su longitud. La clave del mapa es
  la longitud y el valor es la lista de palabras de esa longitud, en el MISMO orden en que
  aparecen en la entrada. Las palabras repetidas se conservan.

  Ejemplo:
  - Entrada: ["hola", "a", "casa", "yo", "sol"] -> Salida: {1=[a], 2=[yo], 3=[sol], 4=[hola, casa]}
  - Entrada: [] -> Salida: {}

  Si la lista es null o vacía, devuelve un mapa vacío. Solo aparecen las longitudes presentes.
  Se espera que las claves queden ordenadas de menor a mayor al recorrer el mapa (usa un TreeMap).
methodSignature: "public static java.util.Map<Integer, java.util.List<String>> groupByLength(java.util.List<String> words)"
className: Solution
estimatedMinutes: 15
