referenceSolution: |
  import java.util.*;

  public class Solution {
      public static java.util.Map<Integer, java.util.List<String>> groupByLength(java.util.List<String> words) {
          Map<Integer, List<String>> grupos = new TreeMap<>();
          if (words == null) {
              return grupos;
          }
          for (String w : words) {
              grupos.computeIfAbsent(w.length(), k -> new ArrayList<>()).add(w);
          }
          return grupos;
      }
  }
tests: |
  import org.junit.jupiter.api.DisplayName;
  import org.junit.jupiter.api.Test;

  import java.util.*;

  import static org.junit.jupiter.api.Assertions.*;

  class SolutionTest {

      @Test
      @DisplayName("Agrupa palabras de distinta longitud")
      void agrupaBasico() {
          Map<Integer, List<String>> r = Solution.groupByLength(List.of("hola", "a", "casa", "yo", "sol"));
          assertEquals(4, r.size());
          assertEquals(List.of("a"), r.get(1));
          assertEquals(List.of("yo"), r.get(2));
          assertEquals(List.of("sol"), r.get(3));
          assertEquals(List.of("hola", "casa"), r.get(4));
      }

      @Test
      @DisplayName("Lista vacía o null devuelve mapa vacío")
      void vaciaONula() {
          assertTrue(Solution.groupByLength(new ArrayList<>()).isEmpty());
          assertNotNull(Solution.groupByLength(null));
          assertTrue(Solution.groupByLength(null).isEmpty());
      }

      @Test
      @DisplayName("Un solo elemento")
      void unElemento() {
          Map<Integer, List<String>> r = Solution.groupByLength(List.of("java"));
          assertEquals(1, r.size());
          assertEquals(List.of("java"), r.get(4));
      }

      @Test
      @DisplayName("Conserva el orden de entrada dentro de cada grupo")
      void conservaOrden() {
          Map<Integer, List<String>> r = Solution.groupByLength(List.of("zeta", "beta", "alfa", "omega", "pi"));
          assertEquals(List.of("zeta", "beta", "alfa"), r.get(4));
          assertEquals(List.of("omega"), r.get(5));
      }

      @Test
      @DisplayName("Conserva las palabras duplicadas")
      void conservaDuplicadas() {
          Map<Integer, List<String>> r = Solution.groupByLength(List.of("ok", "ok", "no"));
          assertEquals(List.of("ok", "ok", "no"), r.get(2));
      }

      @Test
      @DisplayName("La cadena vacía tiene longitud 0")
      void cadenaVacia() {
          Map<Integer, List<String>> r = Solution.groupByLength(List.of("", "a", ""));
          assertEquals(List.of("", ""), r.get(0));
          assertEquals(List.of("a"), r.get(1));
      }

      @Test
      @DisplayName("Las claves salen ordenadas de menor a mayor")
      void clavesOrdenadas() {
          Map<Integer, List<String>> r = Solution.groupByLength(List.of("tres", "uno", "cinco", "a"));
          assertEquals(List.of(1, 3, 4, 5), new ArrayList<>(r.keySet()));
      }

      @Test
      @DisplayName("Funciona con 100000 palabras")
      void grande() {
          List<String> words = new ArrayList<>();
          for (int i = 0; i < 100000; i++) {
              words.add("x".repeat(i % 10 + 1));
          }
          Map<Integer, List<String>> r = Solution.groupByLength(words);
          assertEquals(10, r.size());
          assertEquals(10000, r.get(3).size());
      }
  }
complexityQuestion:
  prompt: "Si hay n palabras con longitud promedio m, ¿cuál es la complejidad temporal de la solución óptima?"
  options: ["O(n²)", "O(n log n)", "O(1)", "O(n)"]
  correctIndex: 3
  explanation: "Cada palabra se procesa una vez con operaciones O(1) del mapa (length() es O(1)), por lo que el total es lineal en n."
