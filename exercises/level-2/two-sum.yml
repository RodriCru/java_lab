slug: two-sum
level: 2
topic: structures
title: Suma de dos (Two Sum)
statement: |
  Dado un arreglo de enteros y un objetivo `target`, devuelve los índices [i, j] de los dos
  elementos que suman `target`, con i < j.

  Ejemplo:
  - twoSum([2, 7, 11, 15], target=9) -> [0, 1]
  - twoSum([3, 2, 4], target=6) -> [1, 2]
  - twoSum([3, 3], target=6) -> [0, 1]

  Se garantiza que existe EXACTAMENTE una solución, así que no hay que decidir entre varias.
  No puedes usar el mismo elemento (el mismo índice) dos veces. El arreglo puede tener negativos.
methodSignature: "public static int[] twoSum(int[] numbers, int target)"
className: Solution
estimatedMinutes: 20
difficulty: medium
hints:
  - "La fuerza bruta compara todos los pares y cuesta O(n²)."
  - "Para cada número x, necesitas encontrar target - x. ¿Cómo buscarlo en O(1)?"
  - "Usa un Map<valor, índice> con lo ya visto: si target - x está en el mapa, devuelve [mapa.get(target - x), i]."
