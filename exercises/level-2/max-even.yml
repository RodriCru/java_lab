title: Mayor número par
statement: |
  Devuelve el mayor número PAR de una lista de enteros dentro de un Optional. Si no hay ningún par, devuelve Optional.empty().

  Reglas:
  - Los negativos también pueden ser pares (-2 es par); el 0 es par.
  - Si la lista es null o está vacía, devuelve Optional.empty().
  - Los elementos null de la lista se ignoran.
  - Nunca devuelvas null: usa siempre Optional.

  Ejemplo:
  - maxEven([3, 8, 5, 10, 7]) -> Optional[10]
  - maxEven([-4, -2, -9]) -> Optional[-2]
  - maxEven([1, 3, 5]) -> Optional.empty
methodSignature: "public static java.util.Optional<Integer> maxEven(java.util.List<Integer> numbers)"
