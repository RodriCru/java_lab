referenceSolution: |
  public class Solution {

      public static java.util.Optional<Integer> maxEven(java.util.List<Integer> numbers) {
          if (numbers == null) {
              return java.util.Optional.empty();
          }
          return numbers.stream()
                  .filter(n -> n != null && n % 2 == 0)
                  .max(Integer::compare);
      }
  }
tests: |
  import org.junit.jupiter.api.DisplayName;
  import org.junit.jupiter.api.Test;

  import java.util.ArrayList;
  import java.util.Arrays;
  import java.util.List;
  import java.util.Optional;

  import static org.junit.jupiter.api.Assertions.*;

  class SolutionTest {

      @Test
      @DisplayName("Devuelve el mayor par")
      void basico() {
          assertEquals(Optional.of(10), Solution.maxEven(Arrays.asList(3, 8, 5, 10, 7)));
      }

      @Test
      @DisplayName("Funciona con negativos")
      void negativos() {
          assertEquals(Optional.of(-2), Solution.maxEven(Arrays.asList(-4, -2, -9)));
      }

      @Test
      @DisplayName("Sin pares devuelve Optional vacío")
      void sinPares() {
          assertEquals(Optional.empty(), Solution.maxEven(Arrays.asList(1, 3, 5)));
      }

      @Test
      @DisplayName("Lista vacía o null devuelve Optional vacío")
      void vacia() {
          assertEquals(Optional.empty(), Solution.maxEven(new ArrayList<>()));
          assertEquals(Optional.empty(), Solution.maxEven(null));
      }

      @Test
      @DisplayName("El cero es par")
      void cero() {
          assertEquals(Optional.of(0), Solution.maxEven(Arrays.asList(0, -3, -1)));
      }

      @Test
      @DisplayName("Un impar mayor no gana al par mayor")
      void imparMayor() {
          assertEquals(Optional.of(2), Solution.maxEven(Arrays.asList(2, 99, 1)));
      }

      @Test
      @DisplayName("Los null se ignoran y los duplicados no molestan")
      void nulls() {
          assertEquals(Optional.of(6), Solution.maxEven(Arrays.asList(null, 6, 6, null, 4)));
          assertEquals(Optional.empty(), Solution.maxEven(Arrays.asList((Integer) null)));
      }

      @Test
      @DisplayName("Lista grande")
      void grande() {
          List<Integer> in = new ArrayList<>();
          for (int i = 0; i < 100000; i++) {
              in.add(i);
          }
          assertEquals(Optional.of(99998), Solution.maxEven(in));
      }
  }
complexityQuestion:
  prompt: "¿Qué complejidad temporal tiene obtener el mayor par con filter + max sobre n elementos?"
  options: ["O(n log n), porque max ordena internamente", "O(n)", "O(1)", "O(n²)"]
  correctIndex: 1
  explanation: "max no ordena: mantiene el mayor visto mientras el stream recorre la lista una sola vez, O(n) con O(1) de espacio extra."
