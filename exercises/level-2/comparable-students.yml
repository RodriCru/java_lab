statement: |
  Dentro de Solution existe la clase anidada Student (nombre y nota entera) que implementa Comparable<Student>. Completa compareTo y luego implementa sortStudents.

  Orden natural de Student (compareTo):
  - Primero la nota MAYOR (orden descendente por nota).
  - Si la nota es igual, por nombre en orden alfabético ascendente (String.compareTo).

  Reglas de sortStudents:
  - Devuelve una lista NUEVA ordenada según el orden natural; la lista original no se modifica.
  - Si la lista es null, devuelve una lista vacía.

  Ejemplo:
  - Entrada: [("Luis", 70), ("Ana", 90), ("Eva", 90)] -> Salida: [("Ana", 90), ("Eva", 90), ("Luis", 70)]
  - Entrada: [] -> Salida: []
