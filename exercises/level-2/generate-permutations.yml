title: "Generar permutaciones"
statement: |
  Devuelve todas las permutaciones de una cadena cuyos caracteres son todos distintos, ordenadas lexicográficamente (orden de String.compareTo).

  Ejemplos:
  - "abc" -> ["abc", "acb", "bac", "bca", "cab", "cba"]
  - "ab" -> ["ab", "ba"]
  - "x" -> ["x"]
  - "" -> [""] (una lista con la cadena vacía)

  Si el texto es null, devuelve una lista vacía.
