referenceSolution: |
  import java.util.*;
  public class Solution {
      public static List<String> permutations(String text) {
          List<String> resultado = new ArrayList<>();
          if (text == null) return resultado;
          char[] letras = text.toCharArray();
          Arrays.sort(letras);
          construir(letras, new boolean[letras.length], new StringBuilder(), resultado);
          return resultado;
      }

      private static void construir(char[] letras, boolean[] usada, StringBuilder actual, List<String> resultado) {
          if (actual.length() == letras.length) {
              resultado.add(actual.toString());
              return;
          }
          for (int i = 0; i < letras.length; i++) {
              if (usada[i]) continue;
              usada[i] = true;
              actual.append(letras[i]);
              construir(letras, usada, actual, resultado);
              actual.deleteCharAt(actual.length() - 1);
              usada[i] = false;
          }
      }
  }
tests: |
  import org.junit.jupiter.api.DisplayName;
  import org.junit.jupiter.api.Test;
  import java.util.*;
  import static org.junit.jupiter.api.Assertions.*;

  class SolutionTest {

      @Test
      @DisplayName("Tres caracteres")
      void t0() {
          assertEquals(Arrays.asList("abc", "acb", "bac", "bca", "cab", "cba"), Solution.permutations("abc"));
      }

      @Test
      @DisplayName("Dos caracteres")
      void t1() {
          assertEquals(Arrays.asList("ab", "ba"), Solution.permutations("ab"));
      }

      @Test
      @DisplayName("Un carácter")
      void t2() {
          assertEquals(Arrays.asList("x"), Solution.permutations("x"));
      }

      @Test
      @DisplayName("Cadena vacía devuelve lista con vacío")
      void t3() {
          assertEquals(Arrays.asList(""), Solution.permutations(""));
      }

      @Test
      @DisplayName("Null devuelve lista vacía")
      void t4() {
          assertEquals(new ArrayList<String>(), Solution.permutations(null));
      }

      @Test
      @DisplayName("Entrada desordenada sale ordenada")
      void t5() {
          assertEquals(Arrays.asList("abc", "acb", "bac", "bca", "cab", "cba"), Solution.permutations("cab"));
      }

      @Test
      @DisplayName("Cantidad factorial de 7 caracteres")
      void t6() {
          List<String> r = Solution.permutations("gfedcba");
          assertEquals(5040, r.size());
          assertEquals("abcdefg", r.get(0));
          assertEquals("gfedcba", r.get(5039));
          assertEquals(5040, new HashSet<>(r).size());
      }
  }
