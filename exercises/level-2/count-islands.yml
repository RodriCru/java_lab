slug: count-islands
level: 2
topic: matrices-patterns
title: Contar islas
statement: |
  Dada una matriz `grid` de 0 y 1, donde 1 es tierra y 0 es agua, cuenta cuántas islas hay.
  Una isla es un grupo de celdas con 1 conectadas en las 4 direcciones (arriba, abajo,
  izquierda, derecha); las diagonales NO cuentan como conexión.

  Ejemplo:
  - Entrada: [[1,1,0,0],[1,0,0,1],[0,0,1,1]] -> Salida: 2
  - Entrada: [[1,0],[0,1]] -> Salida: 2   (están en diagonal)
  - Entrada: [[0,0]] -> Salida: 0

  Si `grid` es null o vacío, devuelve 0. La matriz de entrada NO debe modificarse
  (usa una matriz auxiliar de visitados).
methodSignature: "public static int countIslands(int[][] grid)"
className: Solution
estimatedMinutes: 30
difficulty: medium
hints:
  - "Recorre todas las celdas; cada vez que encuentres una tierra sin visitar, cuenta una isla nueva."
  - "Al encontrarla, marca toda su isla como visitada con DFS o BFS en 4 direcciones."
  - "Usa un boolean[][] de visitados (no modifiques grid). Con BFS y una cola evitas desbordar la pila en islas enormes."
