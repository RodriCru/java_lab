slug: merge-sort
level: 2
topic: sorting
title: "Ordenamiento por mezcla"
statement: |
  Implementa merge sort: divide el arreglo por la mitad, ordena cada mitad recursivamente y mezcla las dos mitades ordenadas.

  El arreglo original NO debe modificarse: devuelve un arreglo NUEVO ordenado de forma ascendente.

  Ejemplos:
  - mergeSort([5, 2, 9, 1]) -> [1, 2, 5, 9]
  - mergeSort([3, 3, 1]) -> [1, 3, 3]
  - mergeSort([]) -> []

  Si el arreglo es null, devuelve un arreglo vacío.
methodSignature: "public static int[] mergeSort(int[] numbers)"
className: Solution
estimatedMinutes: 30
difficulty: medium
hints:
