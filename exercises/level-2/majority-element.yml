slug: majority-element
level: 2
topic: structures
title: Elemento mayoritario
statement: |
  Dado un arreglo de enteros, devuelve el elemento mayoritario: el que aparece MÁS de n/2 veces
  (n = longitud del arreglo). Se garantiza que siempre existe, así que no necesitas validarlo.

  Ejemplo:
  - Entrada: [3, 2, 3] -> Salida: 3
  - Entrada: [2, 2, 1, 1, 1, 2, 2] -> Salida: 2
  - Entrada: [7] -> Salida: 7

  Se espera una solución O(n) tiempo y O(1) espacio (algoritmo de votación de Boyer-Moore).
  No modifiques el arreglo de entrada.
methodSignature: "public static int majorityElement(int[] numbers)"
className: Solution
estimatedMinutes: 20
difficulty: medium
hints:
  - "Contar frecuencias con un Map funciona, pero usa O(n) de espacio."
  - "Boyer-Moore: mantén un candidato y un contador. Si el contador llega a 0, el elemento actual es el nuevo candidato."
  - "Si el elemento actual es igual al candidato suma 1 al contador, si no, réstale 1. Al final el candidato es el mayoritario."
