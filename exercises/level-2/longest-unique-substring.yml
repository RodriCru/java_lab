referenceSolution: |
  import java.util.*;
  public class Solution {
      public static int lengthOfLongestSubstring(String text) {
          if (text == null) return 0;
          Map<Character, Integer> ultima = new HashMap<>();
          int inicio = 0, mejor = 0;
          for (int fin = 0; fin < text.length(); fin++) {
              char c = text.charAt(fin);
              Integer previa = ultima.get(c);
              if (previa != null && previa >= inicio) inicio = previa + 1;
              ultima.put(c, fin);
              mejor = Math.max(mejor, fin - inicio + 1);
          }
          return mejor;
      }
  }
tests: |
  import org.junit.jupiter.api.DisplayName;
  import org.junit.jupiter.api.Test;
  import java.util.*;
  import static org.junit.jupiter.api.Assertions.*;

  class SolutionTest {

      @Test
      @DisplayName("Ejemplo básico abcabcbb")
      void t0() {
          assertEquals(3, Solution.lengthOfLongestSubstring("abcabcbb"));
      }

      @Test
      @DisplayName("Todos los caracteres iguales")
      void t1() {
          assertEquals(1, Solution.lengthOfLongestSubstring("bbbbb"));
      }

      @Test
      @DisplayName("pwwkew devuelve 3")
      void t2() {
          assertEquals(3, Solution.lengthOfLongestSubstring("pwwkew"));
      }

      @Test
      @DisplayName("Cadena vacía y null devuelven 0")
      void t3() {
          assertEquals(0, Solution.lengthOfLongestSubstring(""));
          assertEquals(0, Solution.lengthOfLongestSubstring(null));
      }

      @Test
      @DisplayName("Un solo carácter")
      void t4() {
          assertEquals(1, Solution.lengthOfLongestSubstring("a"));
      }

      @Test
      @DisplayName("Repetido separado: abba y dvdf")
      void t5() {
          assertEquals(2, Solution.lengthOfLongestSubstring("abba"));
          assertEquals(3, Solution.lengthOfLongestSubstring("dvdf"));
      }

      @Test
      @DisplayName("Distingue mayúsculas de minúsculas")
      void t6() {
          assertEquals(4, Solution.lengthOfLongestSubstring("aAbB"));
      }

      @Test
      @DisplayName("Entrada grande rápida")
      void t7() {
          StringBuilder sb = new StringBuilder();
          for (int i = 0; i < 200000; i++) sb.append((char) ('a' + i % 26));
          assertEquals(26, Solution.lengthOfLongestSubstring(sb.toString()));
      }
  }
complexityQuestion:
  prompt: "¿Cuál es la complejidad temporal de tu solución óptima, en función de n?"
