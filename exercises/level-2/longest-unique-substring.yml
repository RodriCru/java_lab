slug: longest-unique-substring
level: 2
topic: strings
title: "Subcadena más larga sin repetidos"
statement: |
  Dada una cadena, devuelve la longitud de la subcadena (caracteres contiguos) más larga que no contiene caracteres repetidos.

  Ejemplos:
  - "abcabcbb" -> 3 (la subcadena "abc")
  - "bbbbb" -> 1
  - "pwwkew" -> 3 (la subcadena "wke")
  - "" -> 0

  Si el texto es null o vacío, devuelve 0. Se distinguen mayúsculas de minúsculas.
