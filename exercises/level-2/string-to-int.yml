slug: string-to-int
level: 2
topic: strings
title: "Cadena a entero (atoi)"
statement: |
  Implementa myAtoi: convierte una cadena a un entero de 32 bits.

  Reglas, en orden:
  1. Ignora los espacios iniciales.
  2. Si el siguiente carácter es '+' o '-', es el signo (por defecto positivo).
  3. Lee dígitos hasta el primer carácter que no sea dígito o el fin de la cadena.
  4. Si no se leyó ningún dígito, devuelve 0.
  5. Si el valor sale del rango de int, satura: Integer.MAX_VALUE o Integer.MIN_VALUE.

  Ejemplos:
  - myAtoi("42") -> 42
  - myAtoi("   -42") -> -42
  - myAtoi("4193 with words") -> 4193
  - myAtoi("words 987") -> 0
  - myAtoi("-91283472332") -> -2147483648

  Si el texto es null, devuelve 0.
methodSignature: "public static int myAtoi(String text)"
className: Solution
estimatedMinutes: 30
difficulty: hard
hints:
  - "Avanza el índice saltando espacios, luego detecta el signo."
  - "Acumula el resultado en un long (o comprueba el desbordamiento antes de multiplicar por 10)."
  - "Si el acumulado supera Integer.MAX_VALUE, devuelve el límite correspondiente al signo sin seguir leyendo."
