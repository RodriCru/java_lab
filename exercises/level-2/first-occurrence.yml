referenceSolution: |
  public class Solution {
      public static int firstOccurrence(int[] sorted, int target) {
          if (sorted == null) {
              return -1;
          }
          int low = 0;
          int high = sorted.length - 1;
          int resultado = -1;
          while (low <= high) {
              int mid = low + (high - low) / 2;
              if (sorted[mid] == target) {
                  resultado = mid;
                  high = mid - 1;
              } else if (sorted[mid] < target) {
                  low = mid + 1;
              } else {
                  high = mid - 1;
              }
          }
          return resultado;
      }
  }
tests: |
  import org.junit.jupiter.api.DisplayName;
  import org.junit.jupiter.api.Test;

  import static org.junit.jupiter.api.Assertions.*;

  class SolutionTest {

      @Test
      @DisplayName("Devuelve la primera aparición con duplicados")
      void conDuplicados() {
          assertEquals(1, Solution.firstOccurrence(new int[] {1, 2, 2, 2, 5}, 2));
      }

      @Test
      @DisplayName("Devuelve -1 si el valor no está")
      void noExiste() {
          assertEquals(-1, Solution.firstOccurrence(new int[] {1, 3, 5}, 4));
          assertEquals(-1, Solution.firstOccurrence(new int[] {1, 3, 5}, 0));
          assertEquals(-1, Solution.firstOccurrence(new int[] {1, 3, 5}, 9));
      }

      @Test
      @DisplayName("Arreglo vacío o null devuelve -1")
      void vacioONulo() {
          assertEquals(-1, Solution.firstOccurrence(new int[0], 1));
          assertEquals(-1, Solution.firstOccurrence(null, 1));
      }

      @Test
      @DisplayName("Un solo elemento")
      void unElemento() {
          assertEquals(0, Solution.firstOccurrence(new int[] {7}, 7));
          assertEquals(-1, Solution.firstOccurrence(new int[] {7}, 8));
      }

      @Test
      @DisplayName("Todos los elementos iguales devuelve 0")
      void todosIguales() {
          assertEquals(0, Solution.firstOccurrence(new int[] {4, 4, 4, 4, 4}, 4));
      }

      @Test
      @DisplayName("Primer y último elemento")
      void extremos() {
          assertEquals(0, Solution.firstOccurrence(new int[] {1, 2, 3, 4}, 1));
          assertEquals(3, Solution.firstOccurrence(new int[] {1, 2, 3, 4}, 4));
      }

      @Test
      @DisplayName("Funciona con un arreglo grande con muchos duplicados")
      void grande() {
          int[] datos = new int[2_000_000];
          for (int i = 0; i < datos.length; i++) {
              datos[i] = i / 1000;
          }
          assertEquals(500_000, Solution.firstOccurrence(datos, 500));
          assertEquals(-1, Solution.firstOccurrence(datos, 5000));
      }
  }
