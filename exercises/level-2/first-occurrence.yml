slug: first-occurrence
level: 2
topic: binary-search
title: Primera aparición en un arreglo ordenado
statement: |
  Dado un arreglo `sorted` ordenado de forma ascendente (puede contener duplicados) y un
  valor `target`, devuelve el índice de la PRIMERA aparición de `target`, o -1 si no está.

  Ejemplo:
  - Entrada: sorted=[1, 2, 2, 2, 5], target=2 -> Salida: 1
  - Entrada: sorted=[1, 3, 5], target=4 -> Salida: -1
  - Entrada: sorted=[], target=1 -> Salida: -1

  Si `sorted` es null, devuelve -1. Se espera una búsqueda binaria (no recorrer todo el arreglo).
methodSignature: "public static int firstOccurrence(int[] sorted, int target)"
className: Solution
estimatedMinutes: 20
difficulty: medium
hints:
  - "Usa búsqueda binaria con los límites low y high."
  - "Cuando encuentres el objetivo, no te detengas: guarda el índice y sigue buscando hacia la izquierda."
  - "Para seguir a la izquierda, haz high = mid - 1 después de guardar el resultado."
