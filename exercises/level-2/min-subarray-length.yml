referenceSolution: |
  public class Solution {
      public static int minSubarrayLength(int target, int[] numbers) {
          if (numbers == null || numbers.length == 0) {
              return 0;
          }
          long suma = 0;
          int left = 0;
          int mejor = Integer.MAX_VALUE;
          for (int right = 0; right < numbers.length; right++) {
              suma += numbers[right];
              while (suma >= target) {
                  mejor = Math.min(mejor, right - left + 1);
                  suma -= numbers[left];
                  left++;
              }
          }
          return mejor == Integer.MAX_VALUE ? 0 : mejor;
      }
  }
tests: |
  import org.junit.jupiter.api.DisplayName;
  import org.junit.jupiter.api.Test;

  import static org.junit.jupiter.api.Assertions.*;

  class SolutionTest {

      @Test
      @DisplayName("Ejemplo básico con target 7")
      void ejemploBasico() {
          assertEquals(2, Solution.minSubarrayLength(7, new int[] {2, 3, 1, 2, 4, 3}));
      }

      @Test
      @DisplayName("Un solo elemento ya alcanza el objetivo")
      void unElementoAlcanza() {
          assertEquals(1, Solution.minSubarrayLength(4, new int[] {1, 4, 4}));
      }

      @Test
      @DisplayName("Nunca se alcanza el objetivo devuelve 0")
      void imposible() {
          assertEquals(0, Solution.minSubarrayLength(11, new int[] {1, 1, 1, 1}));
      }

      @Test
      @DisplayName("Arreglo vacío o null devuelve 0")
      void vacioONulo() {
          assertEquals(0, Solution.minSubarrayLength(5, new int[0]));
          assertEquals(0, Solution.minSubarrayLength(5, null));
      }

      @Test
      @DisplayName("Se necesita todo el arreglo")
      void todoElArreglo() {
          assertEquals(4, Solution.minSubarrayLength(15, new int[] {1, 2, 4, 8}));
      }

      @Test
      @DisplayName("Suma exactamente igual al objetivo")
      void sumaExacta() {
          assertEquals(3, Solution.minSubarrayLength(6, new int[] {1, 2, 3, 1, 1}));
      }

      @Test
      @DisplayName("Un solo elemento en el arreglo")
      void unElemento() {
          assertEquals(1, Solution.minSubarrayLength(5, new int[] {5}));
          assertEquals(0, Solution.minSubarrayLength(6, new int[] {5}));
      }

      @Test
      @DisplayName("No desborda con valores grandes")
      void sinDesbordamiento() {
          int m = Integer.MAX_VALUE;
          assertEquals(2, Solution.minSubarrayLength(m, new int[] {m - 1, m - 1}));
          assertEquals(1, Solution.minSubarrayLength(m, new int[] {1, m}));
      }

      @Test
      @DisplayName("Funciona rápido con 500000 elementos")
      void grande() {
          int[] a = new int[500000];
          for (int i = 0; i < a.length; i++) {
              a[i] = 1;
          }
          assertEquals(500000, Solution.minSubarrayLength(500000, a));
          assertEquals(0, Solution.minSubarrayLength(500001, a));
      }
  }
