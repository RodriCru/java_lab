slug: min-subarray-length
level: 2
topic: sliding-window
title: Longitud mínima de subarreglo con suma mayor o igual
statement: |
  Dado un arreglo de enteros POSITIVOS y un número `target`, devuelve la longitud mínima de un
  subarreglo contiguo cuya suma sea mayor o igual que `target`. Si no existe, devuelve 0.

  Ejemplo:
  - Entrada: target=7, numbers=[2, 3, 1, 2, 4, 3] -> Salida: 2 (el subarreglo [4, 3])
  - Entrada: target=4, numbers=[1, 4, 4] -> Salida: 1
  - Entrada: target=11, numbers=[1, 1, 1, 1] -> Salida: 0

  Si el arreglo es null o vacío, devuelve 0. Todos los números del arreglo son positivos (> 0).
  Se espera una solución O(n) con ventana deslizante.
methodSignature: "public static int minSubarrayLength(int target, int[] numbers)"
className: Solution
estimatedMinutes: 25
difficulty: medium
hints:
  - "Como todos los números son positivos, ampliar la ventana siempre aumenta la suma y reducirla la disminuye."
  - "Avanza el extremo derecho sumando elementos; cuando la suma sea >= target, intenta encoger la ventana por la izquierda."
  - "Mientras la suma siga siendo >= target, actualiza la longitud mínima (right - left + 1) y resta numbers[left] avanzando left."
