slug: max-sum-window
level: 2
topic: sliding-window
title: Suma máxima de ventana de tamaño k
statement: |
  Dado un arreglo de enteros y un tamaño `k`, devuelve la mayor suma posible de k elementos
  CONSECUTIVOS del arreglo.

  Ejemplo:
  - Entrada: numbers=[2, 1, 5, 1, 3, 2], k=3 -> Salida: 9 (5 + 1 + 3)
  - Entrada: numbers=[1, 4, 2, 10, 2, 3, 1, 0, 20], k=4 -> Salida: 24 (3 + 1 + 0 + 20)
  - Entrada: numbers=[-1, -2, -3], k=2 -> Salida: -3

  Devuelve -1 si k <= 0, si k es mayor que la longitud del arreglo, o si el arreglo es null o vacío.
  Se espera O(n): no recalcules la suma completa en cada ventana. Usa long internamente si lo necesitas.
methodSignature: "public static int maxSumOfSizeK(int[] numbers, int k)"
className: Solution
estimatedMinutes: 15
difficulty: medium
hints:
  - "Calcular la suma de cada ventana desde cero cuesta O(n·k)."
  - "Calcula la suma de la primera ventana (los primeros k elementos)."
  - "Para deslizar la ventana, suma el elemento que entra y resta el que sale; ve guardando el máximo."
