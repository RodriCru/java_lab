slug: remove-duplicates-in-place
level: 2
topic: two-pointers
title: Eliminar duplicados en el mismo arreglo
statement: |
  Dado un arreglo de enteros ORDENADO ascendentemente, elimina los duplicados "en el lugar":
  modifica el propio arreglo de modo que los primeros k elementos sean los valores únicos,
  en el mismo orden, y devuelve k. Lo que haya después de la posición k no importa.

  Ejemplo:
  - removeDuplicatesInPlace([1, 1, 2]) -> 2 y el arreglo queda [1, 2, _]
  - removeDuplicatesInPlace([0, 0, 1, 1, 1, 2, 2, 3, 3, 4]) -> 5 y el arreglo empieza con [0, 1, 2, 3, 4]
  - removeDuplicatesInPlace([]) -> 0

  Si el arreglo es null o vacío, devuelve 0. No crees un arreglo nuevo: usa O(1) de espacio extra.
methodSignature: "public static int removeDuplicatesInPlace(int[] sorted)"
className: Solution
estimatedMinutes: 15
difficulty: medium
hints:
  - "Usa dos punteros: uno de lectura que recorre todo el arreglo y uno de escritura que marca dónde va el siguiente valor único."
  - "Un elemento es nuevo si es distinto del último valor escrito (sorted[write - 1])."
  - "Empieza con write = 1 (el primer elemento siempre es único) y devuelve write al final."
