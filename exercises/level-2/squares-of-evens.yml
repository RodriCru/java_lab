title: Cuadrados de los pares
statement: |
  Dada una lista de enteros, devuelve una lista con el cuadrado de cada número PAR, conservando el orden original. Resuélvelo con Streams (filter, map y collect).

  Reglas:
  - Los números negativos también pueden ser pares (-4 es par); el 0 es par.
  - Los duplicados se conservan.
  - Si la lista es null o está vacía, devuelve una lista vacía.
  - No modifiques la lista de entrada.

  Ejemplo:
  - Entrada: [1, 2, 3, 4] -> Salida: [4, 16]
  - Entrada: [-2, 0, 5, 2] -> Salida: [4, 0, 4]
  - Entrada: [1, 3, 5] -> Salida: []
methodSignature: "public static java.util.List<Integer> squaresOfEvens(java.util.List<Integer> numbers)"
