referenceSolution: |
  public class Solution {

      public static java.util.List<Integer> squaresOfEvens(java.util.List<Integer> numbers) {
          if (numbers == null) {
              return new java.util.ArrayList<>();
          }
          return numbers.stream()
                  .filter(n -> n % 2 == 0)
                  .map(n -> n * n)
                  .collect(java.util.stream.Collectors.toList());
      }
  }
tests: |
  import org.junit.jupiter.api.DisplayName;
  import org.junit.jupiter.api.Test;

  import java.util.ArrayList;
  import java.util.Arrays;
  import java.util.Collections;
  import java.util.List;

  import static org.junit.jupiter.api.Assertions.*;

  class SolutionTest {

      @Test
      @DisplayName("Eleva al cuadrado solo los pares")
      void basico() {
          assertEquals(Arrays.asList(4, 16), Solution.squaresOfEvens(Arrays.asList(1, 2, 3, 4)));
      }

      @Test
      @DisplayName("Incluye el cero y los pares negativos, conserva duplicados y orden")
      void negativosYCero() {
          assertEquals(Arrays.asList(4, 0, 4), Solution.squaresOfEvens(Arrays.asList(-2, 0, 5, 2)));
      }

      @Test
      @DisplayName("Sin pares devuelve lista vacía")
      void sinPares() {
          assertTrue(Solution.squaresOfEvens(Arrays.asList(1, 3, 5)).isEmpty());
      }

      @Test
      @DisplayName("Lista vacía o null devuelve lista vacía")
      void vacia() {
          assertTrue(Solution.squaresOfEvens(new ArrayList<>()).isEmpty());
          assertTrue(Solution.squaresOfEvens(null).isEmpty());
      }

      @Test
      @DisplayName("Un solo elemento")
      void unoSolo() {
          assertEquals(Arrays.asList(100), Solution.squaresOfEvens(Arrays.asList(10)));
          assertTrue(Solution.squaresOfEvens(Arrays.asList(7)).isEmpty());
      }

      @Test
      @DisplayName("No modifica la lista de entrada")
      void noMuta() {
          List<Integer> in = new ArrayList<>(Arrays.asList(1, 2, 3, 4));
          Solution.squaresOfEvens(in);
          assertEquals(Arrays.asList(1, 2, 3, 4), in);
      }

      @Test
      @DisplayName("Lista grande")
      void grande() {
          List<Integer> in = new ArrayList<>();
          for (int i = 0; i < 100000; i++) {
              in.add(i % 100);
          }
          List<Integer> r = Solution.squaresOfEvens(in);
          assertEquals(50000, r.size());
          assertEquals(Integer.valueOf(0), r.get(0));
          assertEquals(Integer.valueOf(4), r.get(1));
      }
  }
complexityQuestion:
  prompt: "Con filter, map y collect encadenados sobre n elementos, ¿cuántas pasadas hace el stream y qué complejidad temporal tiene?"
  options: ["Tres pasadas independientes, O(n³)", "Una sola pasada perezosa, O(n)", "Dos pasadas, O(n²)", "Una pasada, O(log n)"]
