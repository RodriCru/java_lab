slug: fast-power-mod
level: 2
topic: logic-math
title: Exponenciación rápida modular
statement: |
  Calcula (base ^ exponent) mod modulus de forma eficiente, aunque el exponente sea enorme
  (hasta 10^18). Una solución que multiplique `exponent` veces no terminará a tiempo.

  Ejemplo:
  - fastPower(base=2, exponent=10, modulus=1000) -> 24
  - fastPower(base=3, exponent=0, modulus=7) -> 1
  - fastPower(base=5, exponent=3, modulus=1) -> 0

  Restricciones: base >= 0, exponent >= 0, 1 <= modulus <= 1_000_000_007 (así los productos
  caben en un long). Cualquier cosa elevada a 0 vale 1 (mod modulus), y todo mod 1 vale 0.
methodSignature: "public static long fastPower(long base, long exponent, long modulus)"
className: Solution
estimatedMinutes: 20
difficulty: medium
hints:
  - "Reduce la base módulo `modulus` desde el inicio y empieza con resultado = 1 % modulus."
  - "Mira el bit menos significativo del exponente: si es 1, multiplica el resultado por la base (mod)."
  - "En cada vuelta eleva la base al cuadrado (mod) y desplaza el exponente una posición a la derecha."
