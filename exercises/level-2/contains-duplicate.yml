slug: contains-duplicate
level: 2
topic: structures
title: Contiene duplicados
statement: |
  Escribe un método que indique si un arreglo de enteros contiene al menos un valor repetido.

  Ejemplo:
  - containsDuplicate([1, 2, 3, 1]) -> true
  - containsDuplicate([1, 2, 3, 4]) -> false
  - containsDuplicate([]) -> false

  Si el arreglo es null o está vacío, devuelve false. No modifiques el arreglo de entrada.
methodSignature: "public static boolean containsDuplicate(int[] numbers)"
className: Solution
estimatedMinutes: 10
difficulty: medium
hints:
  - "Comparar cada par de elementos funciona, pero es lento para arreglos grandes."
  - "Un Set no admite elementos repetidos: piensa en qué devuelve add() cuando el elemento ya existe."
  - "Recorre el arreglo una sola vez; si add() devuelve false, ya encontraste un duplicado."
