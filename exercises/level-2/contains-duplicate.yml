referenceSolution: |
  import java.util.HashSet;
  import java.util.Set;

  public class Solution {
      public static boolean containsDuplicate(int[] numbers) {
          if (numbers == null) {
              return false;
          }
          Set<Integer> vistos = new HashSet<>();
          for (int n : numbers) {
              if (!vistos.add(n)) {
                  return true;
              }
          }
          return false;
      }
  }
tests: |
  import org.junit.jupiter.api.DisplayName;
  import org.junit.jupiter.api.Test;

  import static org.junit.jupiter.api.Assertions.*;

  class SolutionTest {

      @Test
      @DisplayName("Detecta un duplicado simple")
      void duplicadoSimple() {
          assertTrue(Solution.containsDuplicate(new int[] {1, 2, 3, 1}));
      }

      @Test
      @DisplayName("Devuelve false cuando todos son distintos")
      void todosDistintos() {
          assertFalse(Solution.containsDuplicate(new int[] {1, 2, 3, 4}));
      }

      @Test
      @DisplayName("Arreglo vacío o null devuelve false")
      void vacioONulo() {
          assertFalse(Solution.containsDuplicate(new int[0]));
          assertFalse(Solution.containsDuplicate(null));
      }

      @Test
      @DisplayName("Un solo elemento no tiene duplicados")
      void unElemento() {
          assertFalse(Solution.containsDuplicate(new int[] {7}));
      }

      @Test
      @DisplayName("Detecta duplicados con números negativos y cero")
      void negativosYCero() {
          assertTrue(Solution.containsDuplicate(new int[] {-1, 0, 5, -1}));
          assertFalse(Solution.containsDuplicate(new int[] {-1, 0, 1}));
      }

      @Test
      @DisplayName("Todos los elementos iguales")
      void todosIguales() {
          assertTrue(Solution.containsDuplicate(new int[] {4, 4, 4, 4}));
      }

      @Test
      @DisplayName("Funciona rápido con 200000 elementos")
      void grande() {
          int[] a = new int[200000];
          for (int i = 0; i < a.length; i++) {
              a[i] = i;
          }
          assertFalse(Solution.containsDuplicate(a));
          a[199999] = 0;
          assertTrue(Solution.containsDuplicate(a));
      }
  }
complexityQuestion:
  prompt: "¿Cuál es la complejidad temporal de tu solución óptima, en función de n?"
  options: ["O(1)", "O(n log n)", "O(n²)", "O(n)"]
