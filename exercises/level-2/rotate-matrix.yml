slug: rotate-matrix
level: 2
topic: matrices-patterns
title: Rotar una matriz 90 grados
statement: |
  Rota una matriz cuadrada n x n 90 grados en sentido horario y devuelve el resultado como
  una matriz NUEVA. La matriz de entrada no debe modificarse.

  Ejemplo:
  - Entrada: [[1,2,3],[4,5,6],[7,8,9]] -> Salida: [[7,4,1],[8,5,2],[9,6,3]]
  - Entrada: [[1,2],[3,4]] -> Salida: [[3,1],[4,2]]
  - Entrada: [[5]] -> Salida: [[5]]

  Si `matrix` es null o vacía, devuelve una matriz vacía (new int[0][0]).
methodSignature: "public static int[][] rotateMatrix(int[][] matrix)"
className: Solution
estimatedMinutes: 15
difficulty: medium
hints:
  - "Crea una matriz resultado del mismo tamaño n x n."
  - "El elemento en la posición [i][j] termina en la posición [j][n - 1 - i]."
  - "Comprueba con el ejemplo 2x2: el 1 está en [0][0] y debe terminar en [0][1]."
starterCode: |
