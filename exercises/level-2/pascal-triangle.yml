statement: |
  Devuelve las primeras `rows` filas del triángulo de Pascal. Cada fila empieza y termina en 1,
  y cada elemento interior es la suma de los dos elementos que tiene encima en la fila anterior.

  Ejemplo:
  - pascalTriangle(rows=5) -> [[1], [1,1], [1,2,1], [1,3,3,1], [1,4,6,4,1]]
  - pascalTriangle(rows=1) -> [[1]]
  - pascalTriangle(rows=0) -> [] (lista vacía)

  Restricción: 0 <= rows <= 30 (los valores caben en un int).
