slug: apply-all
level: 2
topic: modern-java
title: Aplicar funciones en cadena
statement: |
  Dado un valor inicial y una lista de funciones Function<Integer, Integer>, aplícalas EN ORDEN: la salida de cada función es la entrada de la siguiente. Devuelve el resultado final.

  Reglas:
  - El orden de la lista importa: la primera función se aplica primero.
  - Si la lista es null o está vacía, devuelve initial.
  - Las funciones null de la lista se ignoran.

  Ejemplo:
  - applyAll(3, functions=[x -> x + 1, x -> x * 2]) -> 8   ((3 + 1) * 2)
  - applyAll(3, functions=[x -> x * 2, x -> x + 1]) -> 7   ((3 * 2) + 1)
  - applyAll(5, functions=[]) -> 5
methodSignature: "public static int applyAll(int initial, java.util.List<java.util.function.Function<Integer, Integer>> functions)"
className: Solution
estimatedMinutes: 12
difficulty: medium
