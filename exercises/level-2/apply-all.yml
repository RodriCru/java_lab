referenceSolution: |
  public class Solution {

      public static int applyAll(int initial, java.util.List<java.util.function.Function<Integer, Integer>> functions) {
          if (functions == null) {
              return initial;
          }
          int result = initial;
          for (java.util.function.Function<Integer, Integer> f : functions) {
              if (f != null) {
                  result = f.apply(result);
              }
          }
          return result;
      }
  }
tests: |
  import org.junit.jupiter.api.DisplayName;
  import org.junit.jupiter.api.Test;

  import java.util.ArrayList;
  import java.util.Arrays;
  import java.util.List;
  import java.util.function.Function;

  import static org.junit.jupiter.api.Assertions.*;

  class SolutionTest {

      @Test
      @DisplayName("Aplica las funciones en orden: (3 + 1) * 2")
      void sumarLuegoMultiplicar() {
          List<Function<Integer, Integer>> fs = Arrays.asList(x -> x + 1, x -> x * 2);
          assertEquals(8, Solution.applyAll(3, fs));
      }

      @Test
      @DisplayName("El orden importa: (3 * 2) + 1")
      void multiplicarLuegoSumar() {
          List<Function<Integer, Integer>> fs = Arrays.asList(x -> x * 2, x -> x + 1);
          assertEquals(7, Solution.applyAll(3, fs));
      }

      @Test
      @DisplayName("Lista vacía o null devuelve el valor inicial")
      void vacia() {
          assertEquals(5, Solution.applyAll(5, new ArrayList<>()));
          assertEquals(5, Solution.applyAll(5, null));
      }

      @Test
      @DisplayName("Una sola función")
      void una() {
          List<Function<Integer, Integer>> fs = Arrays.asList(x -> x - 10);
          assertEquals(-7, Solution.applyAll(3, fs));
      }

      @Test
      @DisplayName("Las funciones null se ignoran")
      void conNulls() {
          List<Function<Integer, Integer>> fs = Arrays.asList(null, x -> x + 1, null);
          assertEquals(4, Solution.applyAll(3, fs));
      }

      @Test
      @DisplayName("Funciones con estado de entrada distinto en cada paso")
      void encadenadasDistintas() {
          List<Function<Integer, Integer>> fs = Arrays.asList(x -> x * x, x -> x - 1, x -> -x);
          assertEquals(-8, Solution.applyAll(3, fs));
      }

      @Test
      @DisplayName("Cada función se llama exactamente una vez")
      void unaLlamadaPorFuncion() {
          int[] llamadas = {0};
          Function<Integer, Integer> contar = x -> {
              llamadas[0]++;
              return x + 1;
          };
          Solution.applyAll(0, Arrays.asList(contar, contar, contar));
          assertEquals(3, llamadas[0]);
      }

      @Test
      @DisplayName("Muchas funciones")
      void muchas() {
          List<Function<Integer, Integer>> fs = new ArrayList<>();
          for (int i = 0; i < 100000; i++) {
              fs.add(x -> x + 1);
          }
          assertEquals(100000, Solution.applyAll(0, fs));
      }
  }
complexityQuestion:
  prompt: "Si la lista tiene k funciones y cada una cuesta O(1), ¿qué complejidad temporal tiene applyAll?"
  options: ["O(k²)", "O(1)", "O(log k)", "O(k)"]
  correctIndex: 3
  explanation: "Cada función se aplica exactamente una vez sobre el resultado anterior; no hay forma de saltarse ninguna, por lo que el costo es lineal en k."
