slug: min-coins
level: 2
topic: dynamic-programming
title: Cambio con el mínimo de monedas
statement: |
  Dado un arreglo `coins` de denominaciones (enteros positivos, cada una con suministro
  ilimitado) y una cantidad `amount`, devuelve el NÚMERO MÍNIMO de monedas necesarias para
  sumar exactamente `amount`. Si es imposible, devuelve -1.

  Ejemplo:
  - Entrada: coins=[1, 2, 5], amount=11 -> Salida: 3   (5+5+1)
  - Entrada: coins=[2], amount=3 -> Salida: -1
  - Entrada: coins=[1], amount=0 -> Salida: 0

  Con amount = 0 la respuesta siempre es 0. Atención: el enfoque voraz (tomar siempre la
  moneda más grande) falla, por ejemplo con coins=[1, 3, 4] y amount=6 la respuesta es 2 (3+3).
  Usa programación dinámica.
methodSignature: "public static int minCoins(int[] coins, int amount)"
className: Solution
estimatedMinutes: 25
difficulty: medium
hints:
  - "Define dp[a] como el mínimo de monedas para sumar a, con dp[0] = 0."
  - "Para cada a de 1 a amount, prueba cada moneda c <= a: dp[a] = min(dp[a], dp[a - c] + 1)."
  - "Inicializa dp con un valor 'infinito' (amount + 1) y al final devuelve -1 si dp[amount] sigue siendo infinito."
