title: Nómina con polimorfismo
statement: |
  Dentro de Solution existe la clase abstracta Employee con el método abstracto salary(), y dos subclases: FullTimeEmployee (ya completa, su salario es el sueldo mensual) y HourlyEmployee (debes completar su método salary()). Después implementa totalPayroll, que suma el salario de todos los empleados.

  Reglas de HourlyEmployee.salary():
  - Hasta 160 horas se paga hours * rate.
  - Las horas por encima de 160 se pagan a 1.5 veces la tarifa.

  Reglas de totalPayroll:
  - Debe usar polimorfismo: llama a salary() sobre cada Employee sin preguntar su tipo (nada de instanceof).
  - Los elementos null de la lista se ignoran.
  - Si la lista es null o está vacía, devuelve 0.

  Ejemplo:
  - Entrada: [FullTime("Ana", 3000), Hourly("Luis", 100, 10)] -> Salida: 4000.0
  - Entrada: [Hourly("Eva", 170, 10)] -> Salida: 1750.0 (1600 + 10 * 15)
  - Entrada: [] -> Salida: 0.0
methodSignature: "public static double totalPayroll(java.util.List<Employee> employees)"
className: Solution
