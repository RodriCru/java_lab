hints:
  - "salary() de HourlyEmployee necesita separar las horas normales (máximo 160) de las extra."
  - "En totalPayroll basta un bucle for que llame a e.salary(); Java elige la versión correcta en tiempo de ejecución."
  - "No olvides saltarte los elementos null antes de llamar a salary()."
