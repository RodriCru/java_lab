slug: subarray-with-sum
level: 2
topic: structures
title: Subarreglo con suma objetivo
statement: |
  Escribe un método que indique si existe un subarreglo CONTIGUO y no vacío cuya suma sea
  exactamente `target`. El arreglo puede contener números negativos y ceros.

  Ejemplo:
  - hasSubarrayWithSum([1, 2, 3, 7], target=5) -> true ([2, 3])
  - hasSubarrayWithSum([4, -1, 2, 1], target=6) -> true (todo el arreglo)
  - hasSubarrayWithSum([1, 2, 3], target=7) -> false

  Si el arreglo es null o vacío, devuelve false. Usa long para acumular las sumas.
methodSignature: "public static boolean hasSubarrayWithSum(int[] numbers, int target)"
className: Solution
estimatedMinutes: 25
difficulty: hard
hints:
  - "La suma del subarreglo [i..j] es prefijo[j] - prefijo[i-1]."
  - "Buscas dos prefijos que difieran exactamente en target: prefijo_actual - target debe haberse visto antes."
  - "Guarda en un Set las sumas prefijas ya vistas, incluyendo el 0 inicial (prefijo vacío), y consulta antes de insertar la actual."
