slug: longest-consecutive
level: 2
topic: structures
title: Secuencia consecutiva más larga
statement: |
  Dado un arreglo de enteros SIN ordenar, devuelve la longitud de la secuencia más larga de
  números consecutivos (x, x+1, x+2, ...) que puede formarse con sus elementos, sin importar
  el orden en que aparecen. Los duplicados no suman a la secuencia.

  Ejemplo:
  - longestConsecutive([100, 4, 200, 1, 3, 2]) -> 4 (1, 2, 3, 4)
  - longestConsecutive([0, 3, 7, 2, 5, 8, 4, 6, 0, 1]) -> 9 (0 a 8)
  - longestConsecutive([]) -> 0

  Si el arreglo es null o vacío, devuelve 0. Se espera una solución O(n), sin ordenar el arreglo.
methodSignature: "public static int longestConsecutive(int[] numbers)"
className: Solution
estimatedMinutes: 25
difficulty: hard
hints:
  - "Ordenar y recorrer funciona, pero cuesta O(n log n). El reto es lograr O(n)."
  - "Mete todos los números en un Set. Un número x es el INICIO de una secuencia si x - 1 no está en el Set."
  - "Solo desde cada inicio, cuenta hacia arriba (x+1, x+2...) mientras estén en el Set; cada elemento se visita una vez en total."
