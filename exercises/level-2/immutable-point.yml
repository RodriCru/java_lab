title: Punto inmutable
statement: |
  Dentro de Solution existe la clase anidada Point (coordenadas enteras x e y). Debe ser INMUTABLE: una vez creado, un punto nunca cambia; cualquier "modificación" devuelve un punto nuevo.

  Completa la clase Point:
  - withX(newX): devuelve un NUEVO Point con x = newX y la misma y. El objeto original no cambia.
  - withY(newY): devuelve un NUEVO Point con la misma x e y = newY.
  - equals y hashCode: dos puntos son iguales si tienen las mismas x e y (y el mismo hashCode).
  - toString: devuelve "(x, y)", por ejemplo "(3, 4)".
  Los campos deben ser privados y final.

  Después implementa translate(point, dx, dy), que devuelve un nuevo Point desplazado dx en x y dy en y, sin modificar el original.

  Ejemplo:
  - Entrada: point=(1, 2), dx=3, dy=-1 -> Salida: (4, 1) (y el punto original sigue siendo (1, 2))
  - Entrada: point=(0, 0).withX(5) -> Salida: (5, 0)
methodSignature: "public static Point translate(Point point, int dx, int dy)"
className: Solution
estimatedMinutes: 20
difficulty: medium
hints:
  - "Una clase inmutable no tiene setters y todos sus campos son final: para 'cambiar' algo se crea otro objeto."
  - "withX devuelve new Point(newX, y); withY devuelve new Point(x, newY)."
  - "Para equals y hashCode puedes apoyarte en Objects.equals / Objects.hash, o comparar x e y directamente. translate es new Point(point.getX() + dx, point.getY() + dy)."
