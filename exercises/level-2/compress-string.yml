slug: compress-string
level: 2
topic: strings
title: "Comprimir cadena"
statement: |
  Comprime una cadena reemplazando cada racha de caracteres iguales consecutivos por el carácter seguido de la cantidad de repeticiones. Siempre se escribe la cantidad, incluso si es 1.

  Ejemplos:
  - compress("aaabcc") -> "a3b1c2"
  - compress("abc") -> "a1b1c1"
  - compress("zzzzzzzzzzzz") -> "z12"   (el texto es 12 letras z)
  - compress("") -> ""

  Si el texto es null o vacío, devuelve "".
methodSignature: "public static String compress(String text)"
className: Solution
estimatedMinutes: 20
difficulty: medium
hints:
  - "Recorre la cadena llevando el carácter actual y su contador."
  - "Cuando el carácter cambia, agrega el anterior y su contador al resultado y reinicia."
  - "Usa StringBuilder y no olvides agregar la última racha al terminar el bucle."
