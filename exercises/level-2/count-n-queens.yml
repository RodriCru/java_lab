slug: count-n-queens
level: 2
topic: recursion
title: Problema de las N reinas
statement: |
  Cuenta de cuántas maneras se pueden colocar `n` reinas en un tablero de n x n de modo que
  ninguna se ataque entre sí (dos reinas se atacan si comparten fila, columna o diagonal).

  Ejemplo:
  - Entrada: n=1 -> Salida: 1
  - Entrada: n=4 -> Salida: 2
  - Entrada: n=8 -> Salida: 92

  Restricción: 1 <= n <= 8. Las soluciones que son rotaciones o reflejos de otras se cuentan
  por separado. Usa backtracking: coloca una reina por fila y retrocede si no hay jugada válida.
methodSignature: "public static int countQueens(int n)"
className: Solution
estimatedMinutes: 30
difficulty: hard
hints:
  - "Coloca exactamente una reina por fila: así nunca chocan por fila."
  - "Para cada fila prueba cada columna y comprueba que la columna y las dos diagonales estén libres."
  - "Lleva tres conjuntos de ocupación: columnas, diagonales (fila - col) y antidiagonales (fila + col). Al retroceder, libera la casilla."
