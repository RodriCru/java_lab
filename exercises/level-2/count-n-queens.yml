referenceSolution: |
  public class Solution {
      public static int countQueens(int n) {
          return colocar(0, n, new boolean[n], new boolean[2 * n], new boolean[2 * n]);
      }

      private static int colocar(int fila, int n, boolean[] columnas, boolean[] diag, boolean[] anti) {
          if (fila == n) {
              return 1;
          }
          int total = 0;
          for (int c = 0; c < n; c++) {
              int d = fila - c + n;
              int a = fila + c;
              if (columnas[c] || diag[d] || anti[a]) {
                  continue;
              }
              columnas[c] = true;
              diag[d] = true;
              anti[a] = true;
              total += colocar(fila + 1, n, columnas, diag, anti);
              columnas[c] = false;
              diag[d] = false;
              anti[a] = false;
          }
          return total;
      }
  }
tests: |
  import org.junit.jupiter.api.DisplayName;
  import org.junit.jupiter.api.Test;

  import static org.junit.jupiter.api.Assertions.*;

  class SolutionTest {

      @Test
      @DisplayName("n=1 tiene 1 solución")
      void unaReina() {
          assertEquals(1, Solution.countQueens(1));
      }

      @Test
      @DisplayName("n=2 y n=3 no tienen solución")
      void sinSolucion() {
          assertEquals(0, Solution.countQueens(2));
          assertEquals(0, Solution.countQueens(3));
      }

      @Test
      @DisplayName("n=4 tiene 2 soluciones")
      void cuatro() {
          assertEquals(2, Solution.countQueens(4));
      }

      @Test
      @DisplayName("n=5 tiene 10 soluciones")
      void cinco() {
          assertEquals(10, Solution.countQueens(5));
      }

      @Test
      @DisplayName("n=6 tiene 4 soluciones")
      void seis() {
          assertEquals(4, Solution.countQueens(6));
      }

      @Test
      @DisplayName("n=7 tiene 40 soluciones")
      void siete() {
          assertEquals(40, Solution.countQueens(7));
      }

      @Test
      @DisplayName("n=8 tiene 92 soluciones")
      void ocho() {
          assertEquals(92, Solution.countQueens(8));
      }
  }
complexityQuestion:
  prompt: "¿Qué describe mejor la complejidad temporal del backtracking para N reinas?"
  options: ["O(n)", "O(n²)", "O(n · n!) en el peor caso, muy podado en la práctica", "O(log n)"]
  correctIndex: 2
  explanation: "Hay a lo sumo n opciones en la primera fila, n-1 en la siguiente, etc., lo que da del orden de n! ramas; la poda por columnas y diagonales reduce mucho el trabajo real, pero sigue siendo factorial."
