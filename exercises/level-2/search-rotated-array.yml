referenceSolution: |
  public class Solution {
      public static int searchRotated(int[] numbers, int target) {
          if (numbers == null || numbers.length == 0) {
              return -1;
          }
          int low = 0;
          int high = numbers.length - 1;
          while (low <= high) {
              int mid = low + (high - low) / 2;
              if (numbers[mid] == target) {
                  return mid;
              }
              if (numbers[low] <= numbers[mid]) {
                  if (target >= numbers[low] && target < numbers[mid]) {
                      high = mid - 1;
                  } else {
                      low = mid + 1;
                  }
              } else {
                  if (target > numbers[mid] && target <= numbers[high]) {
                      low = mid + 1;
                  } else {
                      high = mid - 1;
                  }
              }
          }
          return -1;
      }
  }
tests: |
  import org.junit.jupiter.api.DisplayName;
  import org.junit.jupiter.api.Test;

  import static org.junit.jupiter.api.Assertions.*;

  class SolutionTest {

      @Test
      @DisplayName("Encuentra un valor en la parte rotada")
      void enParteRotada() {
          assertEquals(4, Solution.searchRotated(new int[] {4, 5, 6, 7, 0, 1, 2}, 0));
          assertEquals(6, Solution.searchRotated(new int[] {4, 5, 6, 7, 0, 1, 2}, 2));
      }

      @Test
      @DisplayName("Encuentra un valor en la parte inicial")
      void enParteInicial() {
          assertEquals(0, Solution.searchRotated(new int[] {4, 5, 6, 7, 0, 1, 2}, 4));
          assertEquals(3, Solution.searchRotated(new int[] {4, 5, 6, 7, 0, 1, 2}, 7));
      }

      @Test
      @DisplayName("Devuelve -1 si no existe")
      void noExiste() {
          assertEquals(-1, Solution.searchRotated(new int[] {4, 5, 6, 7, 0, 1, 2}, 3));
          assertEquals(-1, Solution.searchRotated(new int[] {4, 5, 6, 7, 0, 1, 2}, 100));
      }

      @Test
      @DisplayName("Un elemento, vacío y null")
      void casosBorde() {
          assertEquals(0, Solution.searchRotated(new int[] {1}, 1));
          assertEquals(-1, Solution.searchRotated(new int[] {1}, 0));
          assertEquals(-1, Solution.searchRotated(new int[0], 1));
          assertEquals(-1, Solution.searchRotated(null, 1));
      }

      @Test
      @DisplayName("Dos elementos rotados")
      void dosElementos() {
          assertEquals(1, Solution.searchRotated(new int[] {3, 1}, 1));
          assertEquals(0, Solution.searchRotated(new int[] {3, 1}, 3));
      }

      @Test
      @DisplayName("Arreglo sin rotación efectiva")
      void sinRotacion() {
          assertEquals(2, Solution.searchRotated(new int[] {1, 2, 3, 4, 5}, 3));
      }

      @Test
      @DisplayName("Todas las posiciones de un arreglo grande rotado")
      void grande() {
          int n = 100_000;
          int rot = 37_777;
          int[] datos = new int[n];
          for (int i = 0; i < n; i++) {
              datos[(i + rot) % n] = i * 2;
          }
          for (int i = 0; i < n; i += 997) {
              assertEquals((i + rot) % n, Solution.searchRotated(datos, i * 2));
          }
          assertEquals(-1, Solution.searchRotated(datos, 7));
      }
  }
