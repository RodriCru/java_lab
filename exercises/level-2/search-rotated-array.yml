slug: search-rotated-array
level: 2
topic: binary-search
title: Búsqueda en un arreglo ordenado y rotado
statement: |
  Un arreglo ordenado de forma ascendente y SIN duplicados fue rotado en algún punto. Por ejemplo,
  [0, 1, 2, 4, 5, 6, 7] rotado queda [4, 5, 6, 7, 0, 1, 2]. Devuelve el índice de `target`
  en el arreglo, o -1 si no está.

  Ejemplo:
  - Entrada: numbers=[4, 5, 6, 7, 0, 1, 2], target=0 -> Salida: 4
  - Entrada: numbers=[4, 5, 6, 7, 0, 1, 2], target=3 -> Salida: -1
  - Entrada: numbers=[1], target=1 -> Salida: 0

  Si `numbers` es null o vacío, devuelve -1. La solución debe ser O(log n).
methodSignature: "public static int searchRotated(int[] numbers, int target)"
className: Solution
estimatedMinutes: 30
difficulty: hard
hints:
  - "Usa búsqueda binaria: en cada paso, al menos una de las dos mitades está ordenada con normalidad."
  - "Si numbers[low] <= numbers[mid], la mitad izquierda está ordenada; si no, lo está la derecha."
  - "Comprueba si el objetivo cae dentro del rango de la mitad ordenada; si sí, busca ahí, y si no, en la otra."
