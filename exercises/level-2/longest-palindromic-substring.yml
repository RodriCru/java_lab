slug: longest-palindromic-substring
level: 2
topic: strings
title: "Subcadena palíndroma más larga"
statement: |
  Devuelve la subcadena palíndroma más larga contenida en el texto.

  Si hay varias con la misma longitud máxima, devuelve la que aparece más a la izquierda.

  Ejemplos:
  - longestPalindrome("babad") -> "bab" (también "aba" tiene longitud 3, pero "bab" aparece primero)
  - longestPalindrome("cbbd") -> "bb"
  - longestPalindrome("a") -> "a"
  - longestPalindrome("abc") -> "a"

  Si el texto es null o vacío, devuelve "". Se distinguen mayúsculas.
methodSignature: "public static String longestPalindrome(String text)"
className: Solution
estimatedMinutes: 30
difficulty: hard
hints:
  - "Todo palíndromo tiene un centro: un carácter (longitud impar) o entre dos caracteres (longitud par)."
  - "Para cada centro, expande hacia los lados mientras los caracteres coincidan."
  - "Actualiza el mejor resultado solo si encuentras uno estrictamente más largo, así el desempate favorece al de la izquierda."
