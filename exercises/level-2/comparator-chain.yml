title: Cadena de comparadores
statement: |
  Dentro de Solution existe la clase anidada Person (apellido, nombre y edad). Escribe sortPeople, que devuelve las personas ordenadas con un Comparator encadenado.

  Criterios, en este orden:
  1. Apellido (lastName) en orden alfabético ascendente.
  2. Si coinciden, nombre (firstName) en orden alfabético ascendente.
  3. Si también coinciden, edad (age) de MAYOR a MENOR.

  Reglas:
  - Devuelve una lista NUEVA; la lista original no debe modificarse.
  - Si la lista es null, devuelve una lista vacía.
  - La comparación de textos es la natural de String (distingue mayúsculas).

  Ejemplo:
  - Entrada: [("Ruiz","Ana",30), ("Gómez","Luis",40), ("Ruiz","Ana",35), ("Ruiz","Aba",20)]
    -> Salida: [("Gómez","Luis",40), ("Ruiz","Aba",20), ("Ruiz","Ana",35), ("Ruiz","Ana",30)]
methodSignature: "public static java.util.List<Person> sortPeople(java.util.List<Person> people)"
className: Solution
estimatedMinutes: 20
difficulty: medium
hints:
  - "Comparator.comparing(Person::getLastName) crea el primer criterio."
  - "Encadena con thenComparing; para la edad descendente usa thenComparing(Person::getAge, Comparator.reverseOrder()) o Comparator.comparingInt con reversed."
  - "Copia primero la lista (new ArrayList<>(people)) y ordena la copia con sort(comparator)."
