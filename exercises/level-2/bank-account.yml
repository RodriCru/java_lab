referenceSolution: |
  public class Solution {

      public static class Account {
          private double balance;

          public Account(double initial) {
              this.balance = initial;
          }

          public void deposit(double amount) {
              if (amount <= 0) {
                  throw new IllegalArgumentException("El depósito debe ser positivo");
              }
              balance += amount;
          }

          public void withdraw(double amount) {
              if (amount <= 0 || amount > balance) {
                  throw new IllegalArgumentException("Retiro inválido");
              }
              balance -= amount;
          }

          public double getBalance() {
              return balance;
          }
      }

      public static double finalBalance(double initial, double[] movements) {
          Account account = new Account(initial);
          if (movements == null) {
              return account.getBalance();
          }
          for (double movement : movements) {
              if (movement > 0) {
                  account.deposit(movement);
              } else if (movement < 0) {
                  try {
                      account.withdraw(-movement);
                  } catch (IllegalArgumentException e) {
                      // retiro sin saldo suficiente: se ignora
                  }
              }
          }
          return account.getBalance();
      }
  }
tests: |
  import org.junit.jupiter.api.DisplayName;
  import org.junit.jupiter.api.Test;

  import static org.junit.jupiter.api.Assertions.*;

  class SolutionTest {

      @Test
      @DisplayName("deposit suma al saldo")
      void deposito() {
          Solution.Account a = new Solution.Account(10);
          a.deposit(5.5);
          assertEquals(15.5, a.getBalance(), 1e-9);
      }

      @Test
      @DisplayName("withdraw resta del saldo y permite retirar todo")
      void retiro() {
          Solution.Account a = new Solution.Account(10);
          a.withdraw(4);
          assertEquals(6, a.getBalance(), 1e-9);
          a.withdraw(6);
          assertEquals(0, a.getBalance(), 1e-9);
      }

      @Test
      @DisplayName("withdraw mayor al saldo lanza excepción y no cambia el saldo")
      void retiroExcesivo() {
          Solution.Account a = new Solution.Account(10);
          assertThrows(IllegalArgumentException.class, () -> a.withdraw(10.01));
          assertEquals(10, a.getBalance(), 1e-9);
      }

      @Test
      @DisplayName("deposit y withdraw rechazan montos no positivos")
      void montosInvalidos() {
          Solution.Account a = new Solution.Account(10);
          assertThrows(IllegalArgumentException.class, () -> a.deposit(0));
          assertThrows(IllegalArgumentException.class, () -> a.deposit(-1));
          assertThrows(IllegalArgumentException.class, () -> a.withdraw(0));
          assertThrows(IllegalArgumentException.class, () -> a.withdraw(-1));
          assertEquals(10, a.getBalance(), 1e-9);
      }

      @Test
      @DisplayName("finalBalance aplica depósitos y retiros en orden")
      void saldoFinal() {
          assertEquals(140.0, Solution.finalBalance(100, new double[]{50, -30, -200, 20}), 1e-9);
      }

      @Test
      @DisplayName("El orden importa: un retiro antes del depósito se ignora")
      void ordenImporta() {
          assertEquals(100.0, Solution.finalBalance(0, new double[]{-50, 100}), 1e-9);
          assertEquals(50.0, Solution.finalBalance(0, new double[]{100, -50}), 1e-9);
      }

      @Test
      @DisplayName("Arreglo vacío, null o con ceros devuelve el saldo inicial")
      void casosBorde() {
          assertEquals(10.0, Solution.finalBalance(10, new double[]{}), 1e-9);
          assertEquals(10.0, Solution.finalBalance(10, null), 1e-9);
          assertEquals(5.0, Solution.finalBalance(0, new double[]{0, 5}), 1e-9);
      }

      @Test
      @DisplayName("Muchos movimientos")
      void muchos() {
          double[] m = new double[10000];
          for (int i = 0; i < m.length; i++) {
              m[i] = (i % 2 == 0) ? 2 : -1;
          }
          assertEquals(5000.0, Solution.finalBalance(0, m), 1e-6);
      }
  }
