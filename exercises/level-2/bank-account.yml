title: Cuenta bancaria
statement: |
  Dentro de Solution existe una clase anidada Account con un saldo. Completa sus métodos deposit y withdraw y después implementa finalBalance, que aplica una lista de movimientos a una cuenta nueva y devuelve el saldo final.

  Reglas de Account:
  - deposit(amount): suma amount al saldo. Si amount <= 0 lanza IllegalArgumentException y el saldo no cambia.
  - withdraw(amount): resta amount del saldo. Si amount <= 0 o amount es MAYOR que el saldo, lanza IllegalArgumentException y el saldo no cambia. Retirar exactamente el saldo es válido.
  - getBalance(): devuelve el saldo actual (ya está hecho).

  Reglas de finalBalance(initial, movements):
  - Crea una Account con el saldo initial y recorre movements en orden.
  - Un movimiento positivo es un depósito; uno negativo es un retiro por su valor absoluto; un 0 se ignora.
  - Si un retiro no se puede realizar por falta de saldo, ese movimiento se ignora y se continúa con el siguiente.
  - Si movements es null, devuelve initial.

  Ejemplo:
  - finalBalance(initial=100, movements=[50, -30, -200, 20]) -> 140.0 (el retiro de 200 se ignora)
  - finalBalance(initial=10, movements=[]) -> 10.0
  - finalBalance(initial=0, movements=[0, 5]) -> 5.0
methodSignature: "public static double finalBalance(double initial, double[] movements)"
