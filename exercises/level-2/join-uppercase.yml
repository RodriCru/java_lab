title: Unir en mayúsculas
statement: |
  Dada una lista de palabras, devuelve un único String con las palabras NO vacías convertidas a mayúsculas y separadas por ", " (coma y espacio). Resuélvelo con Streams.

  Reglas:
  - Se descartan los elementos null y los Strings vacíos (""). Un String con solo espacios NO se considera vacío y se conserva tal cual (en mayúsculas).
  - Se conserva el orden original.
  - Si no queda ninguna palabra, la lista es null o está vacía, devuelve "" (cadena vacía).

  Ejemplo:
  - Entrada: ["java", "", "stream", "api"] -> Salida: "JAVA, STREAM, API"
  - Entrada: ["hola"] -> Salida: "HOLA"
  - Entrada: ["", ""] -> Salida: ""
