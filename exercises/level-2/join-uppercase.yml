referenceSolution: |
  public class Solution {

      public static String joinUppercase(java.util.List<String> words) {
          if (words == null) {
              return "";
          }
          return words.stream()
                  .filter(w -> w != null && !w.isEmpty())
                  .map(String::toUpperCase)
                  .collect(java.util.stream.Collectors.joining(", "));
      }
  }
tests: |
  import org.junit.jupiter.api.DisplayName;
  import org.junit.jupiter.api.Test;

  import java.util.ArrayList;
  import java.util.Arrays;
  import java.util.List;

  import static org.junit.jupiter.api.Assertions.*;

  class SolutionTest {

      @Test
      @DisplayName("Descarta vacíos, pasa a mayúsculas y une con coma y espacio")
      void basico() {
          assertEquals("JAVA, STREAM, API", Solution.joinUppercase(Arrays.asList("java", "", "stream", "api")));
      }

      @Test
      @DisplayName("Una sola palabra no lleva separador")
      void unaPalabra() {
          assertEquals("HOLA", Solution.joinUppercase(Arrays.asList("hola")));
      }

      @Test
      @DisplayName("Solo vacíos devuelve cadena vacía")
      void soloVacios() {
          assertEquals("", Solution.joinUppercase(Arrays.asList("", "")));
      }

      @Test
      @DisplayName("Lista vacía o null devuelve cadena vacía")
      void vacia() {
          assertEquals("", Solution.joinUppercase(new ArrayList<>()));
          assertEquals("", Solution.joinUppercase(null));
      }

      @Test
      @DisplayName("Los elementos null se descartan")
      void conNulls() {
          assertEquals("A, B", Solution.joinUppercase(Arrays.asList(null, "a", null, "b")));
      }

      @Test
      @DisplayName("Un String con espacios no se considera vacío")
      void espacios() {
          assertEquals("A,  , B", Solution.joinUppercase(Arrays.asList("a", " ", "b")));
      }

      @Test
      @DisplayName("Mantiene el orden y maneja acentos")
      void ordenYAcentos() {
          assertEquals("ÁRBOL, CASA, ÑANDÚ", Solution.joinUppercase(Arrays.asList("árbol", "casa", "ñandú")));
      }

      @Test
      @DisplayName("Lista grande")
      void grande() {
          List<String> in = new ArrayList<>();
          for (int i = 0; i < 20000; i++) {
              in.add(i % 2 == 0 ? "ab" : "");
          }
          String r = Solution.joinUppercase(in);
          assertEquals(10000 * 2 + 9999 * 2, r.length());
          assertTrue(r.startsWith("AB, AB"));
      }
  }
