title: Puntos distintos en un conjunto
statement: |
  Dentro de Solution existe la clase anidada Point (x, y enteros) que todavía NO sobrescribe equals ni hashCode, por lo que un HashSet considera distintos dos puntos con las mismas coordenadas. Implementa equals y hashCode en Point y después countDistinctPoints.

  Reglas:
  - Dos puntos son iguales si tienen la misma x y la misma y; los puntos iguales deben tener el mismo hashCode.
  - countDistinctPoints devuelve cuántos puntos distintos hay en la lista, usando un HashSet.
  - Los elementos null de la lista se ignoran.
  - Si la lista es null o está vacía, devuelve 0.

  Ejemplo:
  - Entrada: [(1,2), (3,4), (1,2)] -> Salida: 2
  - Entrada: [(0,0), (0,0), (0,0)] -> Salida: 1
  - Entrada: [] -> Salida: 0
