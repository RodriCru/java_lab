hints:
  - "HashSet usa hashCode para elegir el cubo y equals para confirmar si dos objetos son el mismo; sin ellos compara por referencia."
  - "En equals comprueba instanceof y compara x e y; en hashCode usa Objects.hash(x, y)."
  - "Añade cada punto no nulo a un HashSet<Point> y devuelve su size()."
