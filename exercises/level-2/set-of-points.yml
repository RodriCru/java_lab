referenceSolution: |
  public class Solution {

      public static class Point {
          private final int x;
          private final int y;

          public Point(int x, int y) {
              this.x = x;
              this.y = y;
          }

          public int getX() {
              return x;
          }

          public int getY() {
              return y;
          }

          @Override
          public boolean equals(Object other) {
              if (this == other) {
                  return true;
              }
              if (!(other instanceof Point)) {
                  return false;
              }
              Point p = (Point) other;
              return x == p.x && y == p.y;
          }

          @Override
          public int hashCode() {
              return java.util.Objects.hash(x, y);
          }
      }

      public static int countDistinctPoints(java.util.List<Point> points) {
          if (points == null) {
              return 0;
          }
          java.util.Set<Point> set = new java.util.HashSet<>();
          for (Point p : points) {
              if (p != null) {
                  set.add(p);
              }
          }
          return set.size();
      }
  }
tests: |
  import org.junit.jupiter.api.DisplayName;
  import org.junit.jupiter.api.Test;

  import java.util.ArrayList;
  import java.util.Arrays;
  import java.util.HashSet;
  import java.util.List;
  import java.util.Set;

  import static org.junit.jupiter.api.Assertions.*;

  class SolutionTest {

      @Test
      @DisplayName("Cuenta puntos distintos con un duplicado")
      void conDuplicado() {
          List<Solution.Point> in = Arrays.asList(
                  new Solution.Point(1, 2), new Solution.Point(3, 4), new Solution.Point(1, 2));
          assertEquals(2, Solution.countDistinctPoints(in));
      }

      @Test
      @DisplayName("Todos iguales cuentan como uno")
      void todosIguales() {
          List<Solution.Point> in = Arrays.asList(
                  new Solution.Point(0, 0), new Solution.Point(0, 0), new Solution.Point(0, 0));
          assertEquals(1, Solution.countDistinctPoints(in));
      }

      @Test
      @DisplayName("Lista vacía o null devuelve 0")
      void vacia() {
          assertEquals(0, Solution.countDistinctPoints(new ArrayList<>()));
          assertEquals(0, Solution.countDistinctPoints(null));
      }

      @Test
      @DisplayName("Un solo punto")
      void uno() {
          assertEquals(1, Solution.countDistinctPoints(Arrays.asList(new Solution.Point(5, 5))));
      }

      @Test
      @DisplayName("(1,2) y (2,1) son puntos distintos")
      void coordenadasInvertidas() {
          List<Solution.Point> in = Arrays.asList(new Solution.Point(1, 2), new Solution.Point(2, 1));
          assertEquals(2, Solution.countDistinctPoints(in));
      }

      @Test
      @DisplayName("Los null se ignoran")
      void conNulls() {
          List<Solution.Point> in = Arrays.asList(new Solution.Point(1, 1), null, new Solution.Point(1, 1), null);
          assertEquals(1, Solution.countDistinctPoints(in));
      }

      @Test
      @DisplayName("equals y hashCode son coherentes y funcionan con HashSet")
      void contrato() {
          Solution.Point a = new Solution.Point(7, -3);
          Solution.Point b = new Solution.Point(7, -3);
          assertEquals(a, b);
          assertEquals(a.hashCode(), b.hashCode());
          assertNotEquals(a, new Solution.Point(7, 3));
          assertNotEquals(a, null);
          Set<Solution.Point> set = new HashSet<>();
          set.add(a);
          assertTrue(set.contains(b));
      }

      @Test
      @DisplayName("Lista grande con muchos duplicados")
      void grande() {
          List<Solution.Point> in = new ArrayList<>();
          for (int i = 0; i < 50000; i++) {
              in.add(new Solution.Point(i % 100, i % 7));
          }
          assertEquals(700, Solution.countDistinctPoints(in));
      }
  }
complexityQuestion:
  prompt: "Con equals y hashCode bien implementados, ¿qué complejidad temporal promedio tiene contar los puntos distintos de una lista de n puntos con un HashSet?"
  options: ["O(n²)", "O(n log n)", "O(1)", "O(n)"]
  correctIndex: 3
  explanation: "Cada inserción en un HashSet es O(1) promedio (hashCode + equals), así que n inserciones cuestan O(n). Comparar todos contra todos sería O(n²)."
