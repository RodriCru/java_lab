title: Primera palabra larga
statement: |
  Devuelve, dentro de un Optional, la PRIMERA palabra de la lista cuya longitud sea mayor o igual que minLength. Si ninguna cumple, devuelve Optional.empty().

  Reglas:
  - "Primera" significa según el orden de la lista, no la más larga.
  - Los elementos null se ignoran.
  - Si la lista es null o está vacía, devuelve Optional.empty().
  - Nunca devuelvas null: usa siempre Optional.

  Ejemplo:
  - firstLongWord(words=["sol", "casa", "elefante", "mar"], minLength=4) -> Optional["casa"]
  - firstLongWord(words=["a", "bb"], minLength=5) -> Optional.empty
  - firstLongWord(words=null, minLength=1) -> Optional.empty
methodSignature: "public static java.util.Optional<String> firstLongWord(java.util.List<String> words, int minLength)"
className: Solution
