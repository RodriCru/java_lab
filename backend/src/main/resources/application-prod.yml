# Perfil de produccion (SPRING_PROFILES_ACTIVE=prod): Postgres en lugar de SQLite.
# JAVALAB_DB_URL con formato JDBC, por ejemplo:
#   jdbc:postgresql://ep-xxxx.us-east-2.aws.neon.tech/neondb?sslmode=require
#
# Reutiliza el perfil "postgres" (datasource, driver y dialecto) y solo anade lo propio
# de produccion, para que ambos no se desincronicen.
spring:
  profiles:
    include: postgres

javalab:
  auth:
    # En produccion el registro esta cerrado salvo que se abra a proposito: las cuentas se crean por invitacion.
    registration-enabled: ${JAVALAB_REGISTRATION_ENABLED:false}
