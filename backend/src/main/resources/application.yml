server:
  # Render asigna el puerto en PORT.
  port: ${PORT:8080}
  # Las cookies de otras apps en localhost viajan en cada petición y pueden pasar de 8 KB
  max-http-request-header-size: 32KB

spring:
  application:
    name: javalab-backend
  profiles:
    # Activar "prod" activa tambien "postgres": prod solo anade lo propio de produccion
    # (registro cerrado) y hereda de postgres el datasource, el driver y el dialecto.
    # Va aqui, en el application.yml principal: spring.profiles.include seria invalido
    # dentro de application-prod.yml.
    group:
      prod: postgres
  config:
    # Lee el .env de la raiz del proyecto (esta o la carpeta de arriba segun desde donde se arranque).
    # Es opcional: si no existe, se usan los valores por defecto. Esta en el .gitignore.
    import: optional:file:../.env[.properties],optional:file:./.env[.properties]
  datasource:
    url: jdbc:sqlite:${JAVALAB_DB_PATH:./data/javalab.db}
    driver-class-name: org.sqlite.JDBC
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect
  jackson:
    default-property-inclusion: non_null

javalab:
  auth:
    # OBLIGATORIO: viene del .env o del entorno, no hay valor por defecto (>= 32 caracteres).
    # Si falta, JwtService aborta el arranque con un mensaje claro.
    jwt-secret: ${JAVALAB_JWT_SECRET:}
    jwt-expiration-minutes: ${JAVALAB_JWT_EXPIRATION_MINUTES:1440}
    cookie-name: javalab_token
    # En produccion debe ser true: la cookie de sesion solo viaja por HTTPS.
    cookie-secure: ${JAVALAB_COOKIE_SECURE:false}
    # false cierra el registro de cuentas nuevas (el login de las existentes sigue funcionando).
    registration-enabled: ${JAVALAB_REGISTRATION_ENABLED:true}
    # Correo que se promueve a SUPER_ADMIN al arrancar (si la cuenta ya existe). Opcional.
    super-admin-email: ${JAVALAB_SUPER_ADMIN_EMAIL:}
    # Origenes permitidos para el frontend (separados por coma).
    allowed-origins: ${JAVALAB_ALLOWED_ORIGINS:http://localhost:3000}
  mail:
    # Sin API key el correo (y su codigo OTP) sale en el log del backend.
    resend-api-key: ${JAVALAB_RESEND_API_KEY:}
    from: ${JAVALAB_MAIL_FROM:Java Lab <no-reply@mail.luisrodrigoch.lat>}
  catalog:
    exercises-dir: ${JAVALAB_EXERCISES_DIR:../exercises}
    questions-dir: ${JAVALAB_QUESTIONS_DIR:../questions}
  runner:
    use-docker: ${JAVALAB_RUNNER_USE_DOCKER:true}
    # Envios que se ejecutan a la vez; el resto espera su turno (hasta queue-wait-seconds).
    max-concurrent: ${JAVALAB_RUNNER_MAX_CONCURRENT:1}
    queue-wait-seconds: ${JAVALAB_RUNNER_QUEUE_WAIT_SECONDS:60}
    image: ${JAVALAB_RUNNER_IMAGE:javalab-runner:17}
    timeout-seconds: ${JAVALAB_RUNNER_TIMEOUT_SECONDS:10}
    memory: ${JAVALAB_RUNNER_MEMORY:256m}
    cpus: ${JAVALAB_RUNNER_CPUS:0.5}
    # Jar de JUnit usado tanto por la imagen Docker como por el fallback local.
    junit-jar: ${JAVALAB_RUNNER_JUNIT_JAR:../runner/junit-platform-console-standalone.jar}
    # Directorio compartido backend<->runners (obligatorio con Docker en un servidor: el daemon del
    # host no ve los temporales del contenedor). Vacio en local: se usa el temporal del sistema.
    work-dir: ${JAVALAB_RUNNER_WORK_DIR:}
    # Ruta del mismo directorio VISTA POR EL HOST (solo si el backend corre en un contenedor). El
    # daemon de Docker resuelve los -v contra el host, no contra el contenedor del backend.
    host-work-dir: ${JAVALAB_RUNNER_HOST_WORK_DIR:}

logging:
  level:
    com.lrch.javalab: INFO
